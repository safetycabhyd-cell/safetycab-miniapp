<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#009b3a">
<title>SafetyCab Driver</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f5f3;
  color:#17221c;
}
.header{
  background:#009b3a;
  color:white;
  padding:20px 16px;
  box-shadow:0 3px 12px #0002;
}
.header h1{margin:0;font-size:27px}
.header p{margin:6px 0 0;font-size:15px}
.container{max-width:700px;margin:auto;padding:16px}
.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 3px 14px #0001;
}
h2{margin-top:0}
input,select{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  margin:7px 0;
  font-size:16px;
}
button{
  border:0;
  border-radius:12px;
  padding:13px 17px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin:5px 3px 5px 0;
}
.primary{background:#009b3a;color:white}
.dark{background:#222;color:white}
.red{background:#d62828;color:white}
.blue{background:#1976d2;color:white}
.gray{background:#e8ecea;color:#222}
.booking{
  border:1px solid #ddd;
  border-radius:15px;
  padding:15px;
  margin:12px 0;
}
.booking h3{margin:0 0 10px;color:#008b35}
.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:5px 0;
  border-bottom:1px solid #eee;
}
.label{color:#777}
.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#fff3cd;
  color:#856404;
  font-weight:bold;
}
.success{
  background:#d8f5df;
  color:#08752d;
}
.hidden{display:none!important}
.small{font-size:13px;color:#777}
#message{
  padding:12px;
  border-radius:10px;
  background:#e8f5e9;
  margin-bottom:15px;
  display:none;
}
.location{
  background:#eef7ff;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
  <h1>🚕 SafetyCab Driver</h1>
  <p>Driver Management & Live Booking Panel</p>
</div>

<div class="container">

<div id="message"></div>

<!-- DRIVER LOGIN / PROFILE -->
<div class="card" id="driverCard">
  <h2>👨‍✈️ Driver Profile</h2>

  <input id="driverName" placeholder="Driver Name">
  <input id="driverMobile" placeholder="Mobile Number" inputmode="numeric">
  
  <select id="vehicleType">
    <option value="Mini">Mini</option>
    <option value="Sedan" selected>Sedan</option>
    <option value="SUV">SUV</option>
  </select>

  <input id="vehicleNumber" placeholder="Vehicle Number">

  <button class="primary" onclick="saveDriver()">💾 Save Driver</button>

  <div id="driverInfo" class="small"></div>
</div>

<!-- LIVE LOCATION -->
<div class="card">
  <h2>📍 Driver GPS</h2>

  <div id="gpsStatus" class="status">
    GPS Waiting
  </div>

  <div class="location">
    <b>Latitude:</b> <span id="lat">-</span><br>
    <b>Longitude:</b> <span id="lng">-</span><br>
    <b>Last Update:</b> <span id="gpsTime">-</span>
  </div>

  <button class="primary" onclick="startGPS()">
    📍 Start Live GPS
  </button>
</div>

<!-- BOOKINGS -->
<div class="card">
  <h2>🚕 Pending Bookings</h2>

  <button class="primary" onclick="loadBookings()">
    🔄 Refresh
  </button>

  <span id="bookingCount" class="status">0 Bookings</span>

  <div id="bookings">
    <p class="small">Bookings loading...</p>
  </div>
</div>

<!-- ACCEPTED -->
<div class="card">
  <h2>🟢 My Accepted Booking</h2>

  <div id="acceptedBooking">
    <p class="small">कोई accepted booking नहीं है।</p>
  </div>
</div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  limit,
  doc,
  updateDoc,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyCpKzlC8zDRXObOaqD3a5eyGtknGePl9Rc",
  authDomain: "safety-cab.firebaseapp.com",
  projectId: "safety-cab",
  storageBucket: "safety-cab.firebasestorage.app",
  messagingSenderId: "288347736605",
  appId: "1:288347736605:web:fb36e7a42e7bd58a3f14f4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =========================
   DRIVER DATA
========================= */

let driver = {
  id: localStorage.getItem("safetycab_driver_id") || "",
  name: localStorage.getItem("safetycab_driver_name") || "",
  mobile: localStorage.getItem("safetycab_driver_mobile") || "",
  vehicleType: localStorage.getItem("safetycab_driver_vehicle") || "Sedan",
  vehicleNumber: localStorage.getItem("safetycab_driver_number") || ""
};

document.getElementById("driverName").value = driver.name;
document.getElementById("driverMobile").value = driver.mobile;
document.getElementById("vehicleType").value = driver.vehicleType;
document.getElementById("vehicleNumber").value = driver.vehicleNumber;

if(driver.name){
  document.getElementById("driverInfo").innerText =
    "Driver: " + driver.name +
    " | Vehicle: " + driver.vehicleType +
    " | " + driver.vehicleNumber;
}


/* =========================
   MESSAGE
========================= */

function showMessage(text){
  const box=document.getElementById("message");
  box.innerText=text;
  box.style.display="block";

  setTimeout(()=>{
    box.style.display="none";
  },3000);
}


/* =========================
   SAVE DRIVER
========================= */

window.saveDriver = async function(){

  const name=document.getElementById("driverName").value.trim();
  const mobile=document.getElementById("driverMobile").value.trim();
  const vehicleType=document.getElementById("vehicleType").value;
  const vehicleNumber=document.getElementById("vehicleNumber").value.trim();

  if(!name){
    alert("Driver Name डालिए");
    return;
  }

  if(!/^[0-9]{10}$/.test(mobile)){
    alert("10 digit mobile number डालिए");
    return;
  }

  if(!vehicleNumber){
    alert("Vehicle Number डालिए");
    return;
  }

  driver.name=name;
  driver.mobile=mobile;
  driver.vehicleType=vehicleType;
  driver.vehicleNumber=vehicleNumber;

  if(!driver.id){
    driver.id="DRV"+Date.now();
    localStorage.setItem("safetycab_driver_id",driver.id);
  }

  localStorage.setItem("safetycab_driver_name",name);
  localStorage.setItem("safetycab_driver_mobile",mobile);
  localStorage.setItem("safetycab_driver_vehicle",vehicleType);
  localStorage.setItem("safetycab_driver_number",vehicleNumber);

  try{

    await addDoc(collection(db,"drivers"),{
      driverId:driver.id,
      name:name,
      mobile:mobile,
      vehicleType:vehicleType,
      vehicleNumber:vehicleNumber,
      status:"online",
      createdAt:serverTimestamp()
    });

    document.getElementById("driverInfo").innerText =
      "Driver: "+name+
      " | Vehicle: "+vehicleType+
      " | "+vehicleNumber;

    showMessage("✅ Driver profile saved");

  }catch(error){

    console.error(error);

    showMessage(
      "⚠️ Driver local profile saved. Firebase save error."
    );
  }
};


/* =========================
   LOAD BOOKINGS
========================= */

window.loadBookings = async function(){

  const box=document.getElementById("bookings");

  box.innerHTML="<p>Loading bookings...</p>";

  try{

    const q=query(
      collection(db,"bookings"),
      orderBy("createdAt","desc"),
      limit(100)
    );

    const snap=await getDocs(q);

    let pending=[];
    let accepted=[];

    snap.forEach(item=>{

      const data=item.data();

      const status=String(
        data.status || data.bookingStatus || "pending"
      ).toLowerCase();

      if(
        status==="pending" ||
        status==="searching" ||
        status==="requested" ||
        status==="driver searching"
      ){
        pending.push({
          id:item.id,
          data:data
        });
      }

      if(
        status==="accepted" &&
        data.driverId===driver.id
      ){
        accepted.push({
          id:item.id,
          data:data
        });
      }

    });

    document.getElementById("bookingCount").innerText =
      pending.length+" Bookings";

    if(pending.length===0){

      box.innerHTML=
        "<p class='small'>अभी कोई pending booking नहीं है।</p>";

    }else{

      box.innerHTML="";

      pending.forEach(item=>{
        box.appendChild(
          createBookingCard(item.id,item.data)
        );
      });
    }

    showAccepted(accepted);

  }catch(error){

    console.error(error);

    box.innerHTML=
      "<p style='color:red'>Bookings load नहीं हुईं।</p>"+
      "<p class='small'>"+error.message+"</p>";
  }
};


/* =========================
   BOOKING CARD
========================= */

function createBookingCard(id,data){

  const div=document.createElement("div");

  div.className="booking";

  const customer=
    data.customerName ||
    data.name ||
    data.customer ||
    "-";

  const mobile=
    data.mobile ||
    data.phone ||
    customerPhone(data) ||
    "-";

  const pickup=
    data.pickup ||
    data.pickupLocation ||
    "-";

  const drop=
    data.drop ||
    data.dropLocation ||
    "-";

  const cab=
    data.cabType ||
    data.vehicleType ||
    "-";

  const fare=
    data.estimatedTotal ||
    data.totalFare ||
    data.baseFare ||
    "-";

  const bookingId=
    data.bookingId ||
    id;

  div.innerHTML=`

    <h3>🚕 ${bookingId}</h3>

    <div class="row">
      <span class="label">Customer</span>
      <b>${escapeHTML(customer)}</b>
    </div>

    <div class="row">
      <span class="label">Mobile</span>
      <b>${escapeHTML(mobile)}</b>
    </div>

    <div class="row">
      <span class="label">Cab</span>
      <b>${escapeHTML(cab)}</b>
    </div>

    <div class="row">
      <span class="label">Pickup</span>
      <span>${escapeHTML(String(pickup))}</span>
    </div>

    <div class="row">
      <span class="label">Drop</span>
      <span>${escapeHTML(String(drop))}</span>
    </div>

    <div class="row">
      <span class="label">Fare</span>
      <b>₹${escapeHTML(String(fare))}</b>
    </div>

    <br>

    <button class="primary"
      onclick="acceptBooking('${id}')">
      ✅ Accept
    </button>

    <button class="red"
      onclick="rejectBooking('${id}')">
      ❌ Reject
    </button>

  `;

  return div;
}


/* =========================
   ACCEPT BOOKING
========================= */

window.acceptBooking = async function(id){

  if(!driver.name){

    alert("पहले Driver Profile Save करें।");
    return;
  }

  if(!confirm("क्या आप यह booking accept करना चाहते हैं?")){
    return;
  }

  try{

    const bookingRef=doc(db,"bookings",id);

    await updateDoc(bookingRef,{

      status:"accepted",

      driverId:driver.id,
      driverName:driver.name,
      driverMobile:driver.mobile,
      driverVehicleType:driver.vehicleType,
      driverVehicleNumber:driver.vehicleNumber,

      acceptedAt:serverTimestamp()

    });

    showMessage("✅ Booking Accepted");

    loadBookings();

  }catch(error){

    console.error(error);

    alert(
      "Booking accept नहीं हुई:\n"+
      error.message
    );
  }
};


/* =========================
   REJECT BOOKING
========================= */

window.rejectBooking = async function(id){

  if(!confirm("क्या आप booking reject करना चाहते हैं?")){
    return;
  }

  try{

    await updateDoc(
      doc(db,"bookings",id),
      {
        status:"rejected",
        rejectedBy:"driver",
        rejectedAt:serverTimestamp()
      }
    );

    showMessage("❌ Booking Rejected");

    loadBookings();

  }catch(error){

    console.error(error);

    alert(
      "Reject नहीं हुआ:\n"+
      error.message
    );
  }
};


/* =========================
   SHOW ACCEPTED BOOKING
========================= */

function showAccepted(list){

  const box=document.getElementById("acceptedBooking");

  if(!list.length){

    box.innerHTML=
      "<p class='small'>कोई accepted booking नहीं है।</p>";

    return;
  }

  const item=list[0];
  const data=item.data;

  const customer=
    data.customerName ||
    data.name ||
    data.customer ||
    "-";

  const pickup=
    data.pickup ||
    data.pickupLocation ||
    "-";

  const drop=
    data.drop ||
    data.dropLocation ||
    "-";

  box.innerHTML=`

    <div class="booking">

      <h3>🟢 Booking Accepted</h3>

      <div class="row">
        <span class="label">Booking ID</span>
        <b>${escapeHTML(data.bookingId || item.id)}</b>
      </div>

      <div class="row">
        <span class="label">Customer</span>
        <b>${escapeHTML(customer)}</b>
      </div>

      <div class="row">
        <span class="label">Pickup</span>
        <span>${escapeHTML(String(pickup))}</span>
      </div>

      <div class="row">
        <span class="label">Drop</span>
        <span>${escapeHTML(String(drop))}</span>
      </div>

      <br>

      <button class="blue"
        onclick="startTrip('${item.id}')">
        🚕 Start Trip
      </button>

      <button class="primary"
        onclick="completeTrip('${item.id}')">
        ✅ Complete Trip
      </button>

    </div>
  `;
}


/* =========================
   START TRIP
========================= */

window.startTrip=async function(id){

  try{

    await updateDoc(
      doc(db,"bookings",id),
      {
        status:"on_trip",
        tripStartedAt:serverTimestamp()
      }
    );

    showMessage("🚕 Trip Started");

    loadBookings();

  }catch(error){

    alert(error.message);
  }
};


/* =========================
   COMPLETE TRIP
========================= */

window.completeTrip=async function(id){

  if(!confirm("क्या trip complete करना है?")){
    return;
  }

  try{

    await updateDoc(
      doc(db,"bookings",id),
      {
        status:"completed",
        completedAt:serverTimestamp()
      }
    );

    showMessage("✅ Trip Completed");

    loadBookings();

  }catch(error){

    alert(error.message);
  }
};


/* =========================
   GPS
========================= */

let watchId=null;

window.startGPS=function(){

  if(!navigator.geolocation){

    alert("इस device में GPS उपलब्ध नहीं है।");
    return;
  }

  if(!driver.id){

    alert("पहले Driver Profile Save करें।");
    return;
  }

  document.getElementById("gpsStatus").innerText=
    "🟢 GPS Active";

  document.getElementById("gpsStatus")
    .classList.add("success");

  if(watchId!==null){
    navigator.geolocation.clearWatch(watchId);
  }

  watchId=navigator.geolocation.watchPosition(

    async position=>{

      const lat=position.coords.latitude;
      const lng=position.coords.longitude;

      document.getElementById("lat").innerText=
        lat.toFixed(6);

      document.getElementById("lng").innerText=
        lng.toFixed(6);

      document.getElementById("gpsTime").innerText=
        new Date().toLocaleTimeString();

      try{

        await addDoc(
          collection(db,"driverLocations"),
          {
            driverId:driver.id,
            driverName:driver.name,
            latitude:lat,
            longitude:lng,
            timestamp:serverTimestamp()
          }
        );

      }catch(error){

        console.error("GPS Firebase error:",error);
      }

    },

    error=>{

      console.error(error);

      document.getElementById("gpsStatus").innerText=
        "🔴 GPS Error";

      alert(
        "GPS permission दें और Location ON करें।"
      );
    },

    {
      enableHighAccuracy:true,
      maximumAge:5000,
      timeout:15000
    }
  );
};


/* =========================
   HELPERS
========================= */

function customerPhone(data){

  return data.customerMobile ||
         data.customerPhone ||
         data.phoneNumber ||
         "";
}

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================
   AUTO LOAD
========================= */

loadBookings();

setInterval(()=>{
  loadBookings();
},15000);

</script>

</body>
</html>
