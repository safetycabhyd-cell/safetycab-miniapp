<!-- ================= MAIN JAVASCRIPT ================= -->

<script>

let driver=null;

let duty=false;

let watchId=null;

let bookingListeners=[];

let currentBooking=null;

let tripStarted=false;

let tripStartTime=null;

let tripDistanceKm=0;

let lastTripPoint=null;

let lastBookingAlert="";

let liveMap=null;

let driverMarker=null;

let currentLat=null;

let currentLng=null;

let historyLoaded=false;


/* ================= FARES ================= */

const fares={

Mini:{
base:80,
perKm:16,
perMinute:1
},

Sedan:{
base:100,
perKm:21,
perMinute:1
},

SUV:{
base:150,
perKm:26,
perMinute:1.5
}

};


/* ================= ELEMENT ================= */

function $(id){

return document.getElementById(id);

}


/* ================= TOAST ================= */

function toast(msg){

$("toast").textContent=msg;

$("toast").classList.add("show");

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(function(){

$("toast").classList.remove("show");

},3000);

}


/* ================= STRONG BOOKING SOUND ================= */

let audioContext=null;


function bookingSound(){

try{

audioContext=
audioContext ||
new (
window.AudioContext ||
window.webkitAudioContext
)();


if(audioContext.state==="suspended"){

audioContext.resume();

}


let start=
audioContext.currentTime;


let frequencies=[
880,
1046,
880,
1174,
1046
];


frequencies.forEach(function(freq,i){

let osc=
audioContext.createOscillator();

let gain=
audioContext.createGain();


osc.type="sine";

osc.frequency.value=freq;


let t=
start+(i*0.18);


gain.gain.setValueAtTime(
0.0001,
t
);

gain.gain.exponentialRampToValueAtTime(
0.8,
t+0.03
);

gain.gain.exponentialRampToValueAtTime(
0.0001,
t+0.15
);


osc.connect(gain);

gain.connect(
audioContext.destination
);


osc.start(t);

osc.stop(t+0.17);

});

}catch(e){

console.log(e);

}

}


/* ================= VIBRATION ================= */

function bookingVibrate(){

try{

if(navigator.vibrate){

navigator.vibrate([
400,
120,
400,
120,
700
]);

}

}catch(e){}

}


/* ================= LOGIN ================= */

async function driverLogin(){

let name=
$("loginName").value.trim();

let phone=
$("loginPhone").value.trim();

let id=
$("loginId").value.trim();

let vehicle=
$("loginVehicle").value.trim();

let aadhaar=
$("loginAadhaar").value.trim();


if(name.length<2){

toast("Enter driver name");

return;

}


if(!/^[0-9]{10}$/.test(phone)){

toast("Enter valid 10 digit mobile number");

return;

}


if(!id){

toast("Enter Driver ID");

return;

}


if(!vehicle){

toast("Enter Vehicle Number");

return;

}


if(
aadhaar &&
!/^[0-9]{12}$/.test(aadhaar)
){

toast("Aadhaar must be 12 digits");

return;

}


driver={

name:name,

phone:phone,

driverid:id,

vehicle:vehicle,

aadhaar:aadhaar

};


localStorage.setItem(
"SafetyCab_Driver",
JSON.stringify(driver)
);


try{

let {
doc,
setDoc
}=window.firebaseFns;


await setDoc(

doc(
window.firebaseDB,
"drivers",
id
),

{

name:name,
phone:phone,
driverid:id,
vehicle:vehicle,
aadhaar:aadhaar,
dutystatus:"off",
gpsstatus:"offline",
latitude:null,
longitude:null,
updatedAt:new Date()

},

{
merge:true
}

);

}catch(e){

console.error(e);

}


showApp();

toast(
"Driver Login Successful"
);

}


/* ================= SHOW APP ================= */

function showApp(){

$("loginPage").classList.add("hidden");

$("appPage").classList.remove("hidden");

loadDriverUI();

restoreDuty();

startBookingListeners();

loadCompletedHistory();

}


/* ================= LOAD DRIVER ================= */

function loadDriverUI(){

if(!driver)return;


$("driverName").textContent=
driver.name;

$("driverId").textContent=
driver.driverid;

$("vehicle").textContent=
driver.vehicle;


$("profileName").value=
driver.name;

$("profilePhone").value=
driver.phone;

$("profileId").value=
driver.driverid;

$("profileVehicle").value=
driver.vehicle;

$("profileAadhaar").value=
driver.aadhaar||"";

}


/* ================= CHECK DRIVER ================= */

function checkDriver(){

try{

let saved=
localStorage.getItem(
"SafetyCab_Driver"
);


if(saved){

driver=
JSON.parse(saved);

showApp();

}

}catch(e){

console.error(e);

}

}


/* ================= RESTORE DUTY ================= */

async function restoreDuty(){

if(!driver)return;


let savedDuty=
localStorage.getItem(
"SafetyCab_Duty"
);


if(savedDuty==="on"){

duty=true;

updateDutyUI();

setTimeout(function(){

if(duty){

startGPS();

}

},800);

return;

}


try{

let {
doc,
getDoc
}=window.firebaseFns;


let snap=
await getDoc(

doc(
window.firebaseDB,
"drivers",
driver.driverid
)

);


if(snap.exists()){

let data=snap.data();


if(data.dutystatus==="on"){

duty=true;

localStorage.setItem(
"SafetyCab_Duty",
"on"
);

updateDutyUI();


setTimeout(function(){

if(duty){

startGPS();

}

},800);

}

}

}catch(e){

console.error(e);

}

}


/* ================= DUTY UI ================= */

function updateDutyUI(){

$("dutySwitch")
.classList
.toggle(
"on",
duty
);


$("dutyText").textContent=
duty
?"🟢 Duty ON"
:"🔴 Duty OFF";


$("headerStatus").textContent=
duty
?"🟢 Online"
:"🔴 Offline";

}


/* ================= DUTY ================= */

async function toggleDuty(){

if(!driver)return;


duty=!duty;


localStorage.setItem(
"SafetyCab_Duty",
duty?"on":"off"
);


updateDutyUI();


if(duty){

toast("🟢 Driver Online");

startGPS();

}else{

stopGPS();

toast("🔴 Driver Offline");

}


try{

let {
doc,
updateDoc
}=window.firebaseFns;


await updateDoc(

doc(
window.firebaseDB,
"drivers",
driver.driverid
),

{

dutystatus:
duty?"on":"off",

gpsstatus:
duty?"online":"offline",

updatedAt:new Date()

}

);

}catch(e){

console.error(e);

}

}


/* ================= GPS TOGGLE ================= */

function toggleGPS(){

if(watchId===null){

startGPS();

}else{

stopGPS();

}

}


/* ================= START GPS ================= */

function startGPS(){

if(!navigator.geolocation){

toast(
"Location is not available in this browser"
);

return;

}


if(watchId!==null){

return;

}


$("gpsStatus").textContent=
"🟡 GPS Updating...";


$("gpsButton").textContent=
"⛔ STOP LIVE GPS";


watchId=
navigator.geolocation.watchPosition(

async function(pos){

let lat=
pos.coords.latitude;

let lng=
pos.coords.longitude;


currentLat=lat;

currentLng=lng;


$("latitude").textContent=
lat.toFixed(6);

$("longitude").textContent=
lng.toFixed(6);


$("lastUpdate").textContent=
new Date().toLocaleTimeString();


$("gpsStatus").textContent=
"🟢 GPS ONLINE";


updateDriverMap(
lat,
lng
);


/* ===== TRIP DISTANCE ===== */

if(tripStarted){

if(lastTripPoint){

let d=
distanceBetween(
lastTripPoint.lat,
lastTripPoint.lng,
lat,
lng
);


/*
Ignore impossible GPS jumps.
*/

if(d>0 && d<2){

tripDistanceKm+=d;

}

}


lastTripPoint={
lat:lat,
lng:lng
};

}


/* ===== FIREBASE DRIVER GPS ===== */

if(driver){

try{

let {
doc,
updateDoc
}=window.firebaseFns;


await updateDoc(

doc(
window.firebaseDB,
"drivers",
driver.driverid
),

{

latitude:lat,

longitude:lng,

gpsstatus:"online",

dutystatus:
duty?"on":"off",

updatedAt:new Date()

}

);

}catch(e){

console.error(
"GPS Firebase:",
e
);

}

}

},


function(error){

$("gpsStatus").textContent=
"🔴 GPS OFFLINE";

$("gpsButton").textContent=
"📍 START LIVE GPS";


if(error.code===1){

toast(
"Location permission is required. Please tap Allow."
);

}else{

toast(
"Unable to get your location."
);

}

},


{

enableHighAccuracy:true,

timeout:20000,

maximumAge:5000

}

);

}


/* ================= STOP GPS ================= */

function stopGPS(){

if(
watchId!==null &&
navigator.geolocation
){

navigator.geolocation.clearWatch(
watchId
);

}


watchId=null;


$("gpsStatus").textContent=
"🔴 GPS OFFLINE";


$("gpsButton").textContent=
"📍 START LIVE GPS";


if(driver){

try{

let {
doc,
updateDoc
}=window.firebaseFns;


updateDoc(

doc(
window.firebaseDB,
"drivers",
driver.driverid
),

{

gpsstatus:"offline",

dutystatus:
duty?"on":"off",

updatedAt:new Date()

}

);

}catch(e){}

}

}


/* ================= MAP ================= */

function initDriverMap(){

if(typeof L==="undefined"){

return;

}


if(liveMap){

return;

}


liveMap=
L.map(
"driverMap"
)
.setView(
[17.3850,78.4867],
13
);


L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19,

attribution:
"© OpenStreetMap contributors"

}

).addTo(liveMap);

}


/* ================= UPDATE MAP ================= */

function updateDriverMap(
lat,
lng
){

if(
!Number.isFinite(lat) ||
!Number.isFinite(lng)
){

return;

}


initDriverMap();


if(!liveMap){

return;

}


let position=[
lat,
lng
];


if(!driverMarker){

let icon=
L.divIcon({

className:
"safetycab-driver-car",

html:
'<div style="font-size:36px">🚕</div>',

iconSize:[
40,
40
],

iconAnchor:[
20,
20
]

});


driverMarker=
L.marker(
position,
{
icon:icon
}
)
.addTo(
liveMap
);


driverMarker.bindPopup(
"🚕 Your Live GPS"
);

}else{

driverMarker.setLatLng(
position
);

}


liveMap.setView(
position,
16
);


setTimeout(function(){

liveMap.invalidateSize();

},200);

}


/* ================= DISTANCE ================= */

function distanceBetween(
lat1,
lng1,
lat2,
lng2
){

const R=6371;

const dLat=
(lat2-lat1)*
Math.PI/180;

const dLng=
(lng2-lng1)*
Math.PI/180;


const a=
Math.sin(dLat/2)*
Math.sin(dLat/2)+

Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*

Math.sin(dLng/2)*
Math.sin(dLng/2);


const c=
2*
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);


return R*c;

}


/* =====================================================
BOOKING LISTENERS
===================================================== */

function startBookingListeners(){

if(
!driver ||
!window.firebaseDB
){

return;

}


stopBookingListeners();


let {
collection,
query,
where,
onSnapshot
}=window.firebaseFns;


/* ===== NEW SEARCHING BOOKINGS ===== */

let searchingQuery=
query(

collection(
window.firebaseDB,
"bookings"
),

where(
"status",
"==",
"searching"
)

);


let searchingListener=
onSnapshot(

searchingQuery,

function(snapshot){

let found=null;


snapshot.forEach(function(d){

if(found)return;


let data=d.data();


found={
docId:d.id,
...data
};

});


if(found && !currentBooking){

let key=
found.docId ||
found.bookingId;


if(lastBookingAlert!==key){

lastBookingAlert=key;

bookingSound();

bookingVibrate();

toast(
"🔔 New Booking"
);

showBookingNotification(found);

}


showNewBooking(found);

}

},

function(error){

console.error(
"Searching listener:",
error
);

}

);


bookingListeners.push(
searchingListener
);


/* ===== ACTIVE BOOKING RESTORE ===== */

let activeQuery=
query(

collection(
window.firebaseDB,
"bookings"
),

where(
"driverId",
"==",
driver.driverid
),

where(
"status",
"in",
[
"driver_accepted",
"trip_started"
]
)

);


let activeListener=
onSnapshot(

activeQuery,

function(snapshot){

let active=null;


snapshot.forEach(function(d){

if(active)return;


active={
docId:d.id,
...d.data()
};

});


if(active){

restoreActiveBooking(active);

}

else if(
!currentBooking
){

$("rideBox").innerHTML=
'<div class="empty">No active booking.</div>';

}

},

function(error){

console.error(
"Active booking listener:",
error
);

}

);


bookingListeners.push(
activeListener
);

}


/* ================= STOP LISTENERS ================= */

function stopBookingListeners(){

bookingListeners.forEach(function(unsubscribe){

try{

unsubscribe();

}catch(e){}

});


bookingListeners=[];

}

/* ================= NAVIGATION ================= */

function navigateToPickup(){

if(!currentBooking){

toast("No active booking");

return;

}


let destination=
parseCoordinates(
currentBooking.pickup
);


if(
!destination
){

toast(
"Pickup coordinates not available"
);

return;

}


/*
Use current driver GPS as origin.
This avoids asking SafetyCab for GPS again.
*/

let origin="";


if(
Number.isFinite(currentLat) &&
Number.isFinite(currentLng)
){

origin=
currentLat+
","+
currentLng;

}


let url=
"https://www.google.com/maps/dir/?api=1"+
"&destination="+
encodeURIComponent(
destination.lat+","+destination.lng
)+
"&travelmode=driving";


if(origin){

url+=
"&origin="+
encodeURIComponent(origin);

}


sessionStorage.setItem(
"SafetyCab_ReturnFromMaps",
"1"
);


window.location.href=url;

}


/* ================= PARSE COORDINATES ================= */

function parseCoordinates(value){

if(!value)return null;


let text=
String(value).trim();


let match=
text.match(
/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/
);


if(!match){

return null;

}


let lat=
Number(match[1]);

let lng=
Number(match[2]);


if(
!Number.isFinite(lat) ||
!Number.isFinite(lng)
){

return null;

}


return {
lat:lat,
lng:lng
};

}

/* ================= COMPLETE TRIP ================= */

async function completeTrip(){

if(!currentBooking){

toast("No active booking");

return;

}


let minutes=1;


if(tripStartTime){

minutes=Math.max(

1,

Math.round(
(Date.now()-tripStartTime)/60000
)

);


}


/*
Use cab type pricing.
*/

let cabType=
currentBooking.cabType ||
"Mini";


let fare=
fares[cabType] ||
fares.Mini;


let distance=
Number(tripDistanceKm||0);


let baseFare=
Number(fare.base);

let perKm=
Number(fare.perKm);

let perMinute=
Number(fare.perMinute);


let total=

baseFare+

(distance*perKm)+

(minutes*perMinute);


total=
Math.round(total*100)/100;


let bookingDocId=
currentBooking.docId ||
currentBooking.bookingId;


try{

let {
doc,
updateDoc
}=window.firebaseFns;


await updateDoc(

doc(
window.firebaseDB,
"bookings",
bookingDocId
),

{

status:"completed",

finalFare:total,

fareBase:baseFare,

farePerKm:perKm,

farePerMinute:perMinute,

distanceKm:distance,

tripMinutes:minutes,

completedAt:new Date()

}

);


/*
Show final bill before clearing booking.
*/

showFinalFare(
currentBooking,
total,
distance,
minutes,
baseFare,
perKm,
perMinute
);


/*
Clear active state only after successful completion.
*/

localStorage.removeItem(
"SafetyCab_ActiveBooking"
);


currentBooking=null;

tripStarted=false;

tripStartTime=null;

tripDistanceKm=0;

lastTripPoint=null;


toast(
"🏁 Trip Completed Successfully"
);


loadCompletedHistory();


}catch(e){

console.error(e);

toast(
"Trip could not be completed"
);

}

}

/* ================= FIREBASE HISTORY ================= */

async function loadCompletedHistory(){

if(!driver || !window.firebaseDB){

return;

}


try{

let {
collection,
query,
where,
onSnapshot
}=window.firebaseFns;


let q=
query(

collection(
window.firebaseDB,
"bookings"
),

where(
"driverId",
"==",
driver.driverid
)

);


onSnapshot(

q,

function(snapshot){

let rides=[];


snapshot.forEach(function(d){

let data=d.data();


if(
data.status==="completed"
){

rides.push({

id:d.id,
...data

});

}

});


rides.sort(function(a,b){

let aTime=
getTimeValue(a.completedAt);

let bTime=
getTimeValue(b.completedAt);

return bTime-aTime;

});


renderHistory(rides);

},

function(error){

console.error(
"History:",
error
);

}

);

}catch(e){

console.error(e);

}

}


/* ================= TIME VALUE ================= */

function getTimeValue(value){

if(!value){

return 0;

}


if(
typeof value.toMillis==="function"
){

return value.toMillis();

}


if(
value.seconds
){

return value.seconds*1000;

}


return 0;

}


/* ================= RENDER HISTORY ================= */

$("history");


if(!rides.length){

history.innerHTML=
'<div class="empty">No completed rides yet.</div>';

return;

history.innerHTML="";


rides.forEach(function(booking){

let item=
document.createElement("div");


item.className="ride";


let total=
Number(booking.finalFare||0);

let distance=
Number(booking.distanceKm||0);

let minutes=
Number(booking.tripMinutes||0);


item.innerHTML=

"<b>✅ Completed Ride</b>"+

"<div class='muted'>"+
"Customer: "+
escapeHTML(
booking.customerName||"-"
)+
"</div>"+

"<div class='muted'>"+
"📍 Pickup: "+
escapeHTML(
booking.pickup||"-"
)+
"</div>"+

"<div class='muted'>"+
"🏁 Drop: "+
escapeHTML(
booking.drop||"-"
)+
"</div>"+

"<div class='muted'>"+
"🚕 Vehicle: "+
escapeHTML(
booking.cabType||"-"
)+
"</div>"+

"<div class='muted'>"+
"📏 Distance: "+
distance.toFixed(2)+
" km"+
"</div>"+

"<div class='muted'>"+
"⏱ Time: "+
minutes+
" min"+

$("ridesNav").classList.remove("active");

$("profileNav").classList.remove("active");

$("homePage").classList.remove("hidden");

$("homeNav").classList.add("active");

}

$("ridesPage").classList.remove("hidden");

$("ridesNav").classList.add("active");

$("profilePage").classList.remove("hidden");

$("profileNav").classList.add("active");

}

}


/* ================= ESCAPE ================= */

function escapeHTML(value){

return String(value)
.replace(
/[&<>"']/g,
function(c){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c];

}
);

}
