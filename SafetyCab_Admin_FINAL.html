<style>

*{box-sizing:border-box}

body{
margin:0;

button,input,select{font:inherit}

#loginScreen{

.loginTitle{

.header{

.stats{

grid-template-columns:repeat(3,1fr);

.panel{

.search{

.filters{

.small{

border-top:1px solid #ddd;

}

.navbtn{

.sheet{

<!-- Leaflet JS MUST LOAD BEFORE ADMIN JAVASCRIPT -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqSICccKKX94x04rjCUHXjW5EJoaI10Bc",

authDomain:
"safety-cab-radar.firebaseapp.com",

databaseURL:
"https://safety-cab-radar-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"safety-cab-radar",

storageBucket:
"safety-cab-radar.firebasestorage.app",

messagingSenderId:
"900129993912",

appId:
"1:900129993912:web:48c98c4d62154d0f39704d"

};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();


/* =====================================================
   ADMIN LOGIN
===================================================== */

async function adminLogin(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

const msg =
document.getElementById("loginMsg");

const btn =
document.getElementById("loginBtn");

msg.textContent="";


if(!email || !password){

msg.textContent =
"Email and Password required.";

return;

}


btn.disabled=true;

btn.textContent="Logging in...";


try{

const result =
await auth.signInWithEmailAndPassword(
email,
password
);


const uid =
result.user.uid;


const adminDoc =
await db
.collection("admins")
.doc(uid)
.get();


if(
!adminDoc.exists ||
adminDoc.data().role !== "admin"
){

await auth.signOut();

msg.textContent =
"Access denied. Admin account required.";

btn.disabled=false;

btn.textContent="🔐 Login";

return;

}


showAdmin();

}catch(error){

console.error(error);

msg.textContent =
"Login failed: "+error.message;

btn.disabled=false;

btn.textContent="🔐 Login";

}

}


/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdmin(){

document
.getElementById("loginScreen")
.style.display="none";

document
.getElementById("adminApp")
.style.display="block";


setTimeout(function(){

map.invalidateSize();

},300);


render();

}


/* =====================================================
   LOGOUT
===================================================== */

async function adminLogout(){

await auth.signOut();

document
.getElementById("adminApp")
.style.display="none";

document
.getElementById("loginScreen")
.style.display="flex";

document
.getElementById("loginPassword")
.value="";

document
.getElementById("loginMsg")
.textContent="";

}


/* =====================================================
   AUTH STATE CHECK
===================================================== */

auth.onAuthStateChanged(async function(user){

if(!user){

document
.getElementById("loginScreen")
.style.display="flex";

document
.getElementById("adminApp")
.style.display="none";

return;

}


try{

const adminDoc =
await db
.collection("admins")
.doc(user.uid)
.get();


if(
adminDoc.exists &&
adminDoc.data().role === "admin"
){

showAdmin();

}else{

await auth.signOut();

}

}catch(error){

console.error(
"Admin authorization error:",
error
);

await auth.signOut();

}

});


/* =====================================================
   EXISTING DRIVER DATA
===================================================== */

const KEY =
"safetycab_admin_final_v1";


let drivers =
JSON.parse(
localStorage.getItem(KEY) || "null"
) || [

{
id:"001",
name:"Jaweed",
phone:"9398179229",
vehicle:"TS08UE0850",
lat:17.42536,
lng:78.48694,
online:true,
duty:true,
rating:5,
last:"Just now"
},

{
id:"002",
name:"Driver 2",
phone:"9000000002",
vehicle:"TS09AB1002",
lat:17.431,
lng:78.492,
online:true,
duty:true,
rating:4.5,
last:"2 min ago"
},

{
id:"003",
name:"Driver 3",
phone:"9000000003",
vehicle:"TS10CD1003",
lat:17.418,
lng:78.48,
online:true,
duty:false,
rating:4,
last:"4 min ago"
},

{
id:"004",
name:"Driver 4",
phone:"9000000004",
vehicle:"TS11EF1004",
lat:17.438,
lng:78.5,
online:true,
duty:false,
rating:0,
last:"8 min ago"
},

{
id:"005",
name:"Driver 5",
phone:"9000000005",
vehicle:"TS12GH1005",
lat:17.405,
lng:78.47,
online:false,
duty:false,
rating:0,
last:"1 hr ago"
}

];


let filter="all";

let markers={};


/* =====================================================
   SAVE LOCAL DEMO DATA
===================================================== */

function save(){

localStorage.setItem(
KEY,
JSON.stringify(drivers)
);

}


/* =====================================================
   MAP
===================================================== */

const map =
L.map("map")
.setView(
[17.42536,78.48694],
13
);


L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap contributors"
}
).addTo(map);


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(x){

return String(x ?? "")
.replace(
/[&<>"']/g,

function(m){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m];

}

);

}


/* =====================================================
   DRIVER MAP ICON
===================================================== */

function ico(d){

return L.divIcon({

className:"",

html:

`<div style="
width:38px;
height:38px;
border-radius:50%;
background:${d.online ? "#18a957" : "#777"};
border:3px solid white;
box-shadow:0 2px 7px #0008;
display:flex;
align-items:center;
justify-content:center;
font-size:19px
">🚕</div>`,

iconSize:[38,38],

iconAnchor:[19,19]

});

}


/* =====================================================
   RENDER
===================================================== */

function render(){

Object
.values(markers)
.forEach(function(m){

map.removeLayer(m);

});


markers={};


drivers.forEach(function(d){

const m =
L.marker(
[d.lat,d.lng],
{icon:ico(d)}
)
.addTo(map);


m.bindTooltip(
d.name,
{direction:"top"}
);


m.on(
"click",
function(){

details(d.id);

}
);


markers[d.id]=m;

});


const q =
document
.getElementById("search")
.value
.toLowerCase()
.trim();


const arr =
drivers.filter(function(d){

const t =
(
d.id+" "+
d.name+" "+
d.vehicle+" "+
d.phone
)
.toLowerCase();


const qok =
!q || t.includes(q);


const fok =
filter==="all" ||

(
filter==="online" &&
d.online
) ||

(
filter==="offline" &&
!d.online
) ||

(
filter==="duty" &&
d.duty
) ||

(
filter==="offduty" &&
!d.duty
);


return qok && fok;

});


document
.getElementById("driverList")
.innerHTML =

arr.map(function(d){

return `

<div class="card">

<div class="name">

🚕 ${esc(d.name)}

<span class="badge ${d.online ? "on" : "off"}">

${d.online ? "GPS ONLINE" : "OFFLINE"}

</span>

</div>


<div class="small">

ID:
${esc(d.id)}

•

${esc(d.vehicle)}

</div>


<div class="small">

📞 ${esc(d.phone)}

•

${d.duty ? "🟢 Duty ON" : "⚪ Duty OFF"}

•

⭐ ${d.rating || "Not Rated"}

</div>


<div class="small">

Last update:
${esc(d.last)}

</div>


<div class="actions">

<button
class="btn"
onclick="details('${esc(d.id)}')">

View

</button>


<button
class="btn"
onclick="editDriver('${esc(d.id)}')">

Edit

</button>


<button
class="btn redbtn"
onclick="delDriver('${esc(d.id)}')">

Delete

</button>

</div>

</div>

`;

}).join("")

||

'<div class="card">No drivers found.</div>';


document
.getElementById("total")
.textContent =
drivers.length;


document
.getElementById("online")
.textContent =
drivers.filter(
function(d){return d.online;}
).length;


document
.getElementById("duty")
.textContent =
drivers.filter(
function(d){return d.duty;}
).length;

}


/* =====================================================
   MODAL
===================================================== */

function openModal(x){

document
.getElementById("sheet")
.innerHTML=x;

document
.getElementById("modal")
.classList.add("show");

}


function closeModal(){

document
.getElementById("modal")
.classList.remove("show");

}


/* =====================================================
   DRIVER DETAILS
===================================================== */

function details(id){

const d =
drivers.find(
function(x){
return x.id===id;
}
);


if(!d)return;


map.setView(
[d.lat,d.lng],
16
);


openModal(`

<button
class="close"
onclick="closeModal()">
✕
</button>


<h2>
🚕 ${esc(d.name)}
</h2>


<p>
<b>Driver ID:</b>
${esc(d.id)}
</p>


<p>
<b>Phone:</b>
${esc(d.phone)}
</p>


<p>
<b>Vehicle:</b>
${esc(d.vehicle)}
</p>


<p>
<b>GPS:</b>
${d.online ? "🟢 ONLINE" : "🔴 OFFLINE"}
</p>


<p>
<b>Duty:</b>
${d.duty ? "🟢 ON" : "⚪ OFF"}
</p>


<p>
<b>Rating:</b>
⭐ ${d.rating || "Not Rated"}
</p>


<p>
<b>Location:</b>
${Number(d.lat).toFixed(6)},
${Number(d.lng).toFixed(6)}
</p>


<p>
<b>Last update:</b>
${esc(d.last)}
</p>


<div class="actions">

<button
class="btn"
onclick="center('${esc(d.id)}')">

📍 Center Map

</button>


<a
class="btn"
style="text-decoration:none"
href="tel:${esc(d.phone)}">

📞 Call

</a>


<button
class="btn"
onclick="editDriver('${esc(d.id)}')">

✏️ Edit

</button>

</div>

`);

}


/* =====================================================
   CENTER DRIVER
===================================================== */

function center(id){

closeModal();


const d =
drivers.find(
function(x){
return x.id===id;
}
);


if(d){

map.setView(
[d.lat,d.lng],
16
);

}

}


/* =====================================================
   ADD / EDIT DRIVER
===================================================== */

function editDriver(id){

const d =
id ?

drivers.find(
function(x){
return x.id===id;
}
)

:

{
id:"",
name:"",
phone:"",
vehicle:"",
lat:17.42536,
lng:78.48694,
online:false,
duty:false,
rating:0
};


openModal(`

<button
class="close"
onclick="closeModal()">
✕
</button>


<h2>

${id ? "✏️ Edit Driver" : "➕ Add Driver"}

</h2>


<div class="row">


<div class="field">

<label>
Driver ID
</label>

<input
id="f_id"
value="${esc(d.id)}">

</div>


<div class="field">

<label>
Name
</label>

<input
id="f_name"
value="${esc(d.name)}">

</div>


<div class="field">

<label>
Phone
</label>

<input
id="f_phone"
value="${esc(d.phone)}">

</div>


<div class="field">

<label>
Vehicle Number
</label>

<input
id="f_vehicle"
value="${esc(d.vehicle)}">

</div>


<div class="field">

<label>
Latitude
</label>

<input
id="f_lat"
type="number"
step="0.000001"
value="${d.lat}">

</div>


<div class="field">

<label>
Longitude
</label>

<input
id="f_lng"
type="number"
step="0.000001"
value="${d.lng}">

</div>


<div class="field">

<label>
GPS Status
</label>

<select id="f_online">

<option
value="1"
${d.online ? "selected" : ""}>

Online

</option>

<option
value="0"
${!d.online ? "selected" : ""}>

Offline

</option>

</select>

</div>


<div class="field">

<label>
Duty Status
</label>

<select id="f_duty">

<option
value="1"
${d.duty ? "selected" : ""}>

Duty ON

</option>

<option
value="0"
${!d.duty ? "selected" : ""}>

Duty OFF

</option>

</select>

</div>


<div class="field">

<label>
Rating
</label>

<input
id="f_rating"
type="number"
min="0"
max="5"
step=".5"
value="${d.rating || 0}">

</div>


</div>


<button
class="btn"
onclick="saveDriver('${id || ""}')">

💾 Save Driver

</button>

`);

}


/* =====================================================
   SAVE DRIVER
===================================================== */

function saveDriver(old){

const o={

id:
document.getElementById("f_id")
.value.trim(),

name:
document.getElementById("f_name")
.value.trim(),

phone:
document.getElementById("f_phone")
.value.trim(),

vehicle:
document.getElementById("f_vehicle")
.value.trim(),

lat:
parseFloat(
document.getElementById("f_lat").value
),

lng:
parseFloat(
document.getElementById("f_lng").value
),

online:
document.getElementById("f_online")
.value==="1",

duty:
document.getElementById("f_duty")
.value==="1",

rating:
parseFloat(
document.getElementById("f_rating").value
) || 0,

last:
"Just updated"

};


if(
!o.id ||
!o.name ||
!Number.isFinite(o.lat) ||
!Number.isFinite(o.lng)
){

alert(
"Driver ID, Name, Latitude and Longitude are required."
);

return;

}


if(old){

const i =
drivers.findIndex(
function(x){
return x.id===old;
}
);


if(i>=0){

drivers[i]=o;

}

}else{

if(
drivers.some(
function(x){
return x.id===o.id;
}
)
){

alert(
"Driver ID already exists."
);

return;

}


drivers.push(o);

}


save();

closeModal();

render();

}


/* =====================================================
   DELETE DRIVER
===================================================== */

function delDriver(id){

const d =
drivers.find(
function(x){
return x.id===id;
}
);


if(
d &&
confirm("Delete "+d.name+"?")
){

drivers =
drivers.filter(
function(x){
return x.id!==id;
}
);


save();

render();

}

}
