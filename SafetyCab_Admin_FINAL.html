<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Safety Cab - Admin Panel FINAL</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#263238;padding-bottom:58px}
button,input,select{font:inherit}
#loginScreen{position:fixed;inset:0;z-index:5000;background:#f4f7fb;display:flex;align-items:center;justify-content:center;padding:20px}
.loginBox{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:24px;box-shadow:0 5px 25px #0002}
.loginLogo{width:64px;height:64px;border-radius:50%;background:#ffd21c;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 14px}
.loginTitle{text-align:center;font-size:24px;font-weight:800;margin-bottom:5px}
.loginSub{text-align:center;font-size:13px;color:#667;margin-bottom:22px}
.loginField{margin-bottom:13px}.loginField label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.loginField input{width:100%;padding:12px;border:1px solid #ccd5dd;border-radius:10px;outline:none}
#loginBtn{width:100%;padding:12px;border:0;border-radius:10px;background:#087fc3;color:#fff;font-weight:700}
#loginBtn:disabled{opacity:.6}#loginMsg{margin-top:12px;font-size:13px;text-align:center;color:#d93636;min-height:18px}
#adminApp{display:none}
.header{height:64px;background:#087fc3;color:#fff;display:flex;align-items:center;padding:0 14px;gap:10px}
.logo{width:42px;height:42px;border-radius:50%;background:#ffd21c;display:flex;align-items:center;justify-content:center;font-size:22px}
.title{font-size:20px;font-weight:800}.sub{font-size:11px;opacity:.9}.adminBar{margin-left:auto}
.logoutBtn{border:1px solid #ffffff66;background:#ffffff18;color:#fff;border-radius:8px;padding:7px 10px;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:#fff}
.stat{background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 2px 8px #0001}.stat b{font-size:24px;display:block}
.blue{color:#087fc3}.green{color:#159447}.red{color:#d93636}
#map{height:calc(100vh - 260px);min-height:390px}
.panel{background:#fff;padding:10px;border-top:1px solid #ddd}.search{width:100%;padding:11px;border:1px solid #ccd5dd;border-radius:10px;margin-bottom:8px}
.filters{display:flex;gap:6px;overflow:auto}.filters button{border:1px solid #ccd5dd;background:#fff;border-radius:18px;padding:8px 12px;white-space:nowrap}
.filters button.active{background:#087fc3;color:#fff}
.list{padding:8px;background:#f4f7fb;max-height:55vh;overflow:auto}.card{background:#fff;border-radius:12px;padding:11px;margin-bottom:8px;box-shadow:0 2px 7px #0001}
.name{font-weight:800}.small{font-size:12px;color:#667;margin-top:3px}.badge{font-size:11px;padding:4px 7px;border-radius:10px}.on{background:#dff6e7;color:#087b35}.off{background:#eee;color:#666}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.btn{border:0;border-radius:8px;padding:8px 10px;background:#087fc3;color:#fff}.redbtn{background:#d93636}.gray{background:#667}
.vehicleTypeBadge{display:inline-block;background:#e4f1fb;color:#075a8c;padding:4px 8px;border-radius:10px;font-size:11px;font-weight:700}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);z-index:1200}
.navbtn{border:0;background:#fff;padding:8px 3px;color:#59636d;font-size:11px}.navbtn b{display:block;font-size:21px}.navbtn.active{color:#087fc3}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:2000;align-items:flex-end}.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}.sheet h2{margin-top:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin-bottom:9px}.field label{display:block;font-size:12px;color:#667;margin-bottom:4px}
.field input,.field select{width:100%;padding:10px;border:1px solid #ccd5dd;border-radius:9px;background:#fff}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px}
.firebaseStatus{margin:8px;padding:9px;border-radius:8px;font-size:12px;display:none}.firebaseStatus.show{display:block}.statusOk{background:#dff6e7;color:#087b35}.statusError{background:#fde2e2;color:#a40000}.statusInfo{background:#e4f1fb;color:#075a8c}

/* BOTH PHOTOS ARE INTENTIONALLY SMALL */
.photoBox,.carPhotoBox{
width:78px;height:78px;border-radius:50%;margin:5px auto 10px;background:#eef3f7;
border:3px solid #ccd5dd;display:flex;align-items:center;justify-content:center;overflow:hidden;
position:relative;cursor:pointer
}
.carPhotoBox{border-radius:12px;border:2px dashed #b9c7d3}
.photoBox img,.carPhotoBox img{width:100%;height:100%;object-fit:cover;display:block}
.photoPlaceholder{font-size:32px}.carPhotoPlaceholder{text-align:center;font-size:10px;font-weight:700;color:#667;line-height:1.2}
.carPhotoIcon{font-size:25px;display:block;margin-bottom:2px}.photoInput{width:100%;padding:10px;border:1px solid #ccd5dd;border-radius:9px;background:#fff}
.photoHint,.carPhotoHint{font-size:11px;color:#667;text-align:center;margin:5px 0 10px}.photoRemove,.carPhotoRemove{display:flex;align-items:center;gap:7px;font-size:12px;margin:8px 0 14px}
.listPhoto{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid #d5dfe7;vertical-align:middle;margin-right:6px;cursor:pointer}
.listCarPhoto{width:48px;height:34px;border-radius:6px;object-fit:cover;border:1px solid #d5dfe7;vertical-align:middle;cursor:pointer}
.detailThumb{width:78px;height:78px;border-radius:50%;object-fit:cover;display:block;margin:5px auto 4px;border:3px solid #ccd5dd;cursor:pointer}
.detailCarThumb{width:78px;height:78px;border-radius:12px;object-fit:cover;display:block;margin:5px auto 4px;border:2px solid #d5dfe7;cursor:pointer}
.thumbHint{text-align:center;font-size:11px;color:#667;margin-bottom:12px}
.bookingBox{background:#f5f9fc;border:1px solid #d8e4ed;border-radius:14px;padding:12px;margin:12px 0}
.bookingItem{background:#fff;border:1px solid #dbe4ea;border-radius:12px;padding:12px;margin-top:9px}
.bookingStatus{display:inline-block;padding:5px 9px;border-radius:12px;background:#fff0bd;color:#806500;font-size:11px;font-weight:800}
.closeBookingBtn{width:100%;margin-top:10px;background:#d93636;border:0;border-radius:10px;color:#fff;padding:11px;font-weight:800}
.noBooking{font-size:13px;color:#667;background:#fff;border-radius:10px;padding:10px}
.photoViewer{display:none;position:fixed;inset:0;z-index:6000;background:#000d;align-items:center;justify-content:center;padding:20px}
.photoViewer.show{display:flex}.photoViewer img{max-width:96vw;max-height:88vh;object-fit:contain;border-radius:12px}
.viewerClose{position:fixed;right:16px;top:18px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;font-size:25px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
@media(min-width:800px){.bottom{left:20%;right:20%}}
</style>
</head>
<body>

<div id="loginScreen">
<div class="loginBox">
<div class="loginLogo">🚕</div>
<div class="loginTitle">Safety Cab Admin</div>
<div class="loginSub">Secure Admin Login</div>
<div class="loginField"><label>Admin Email</label><input id="loginEmail" type="email" placeholder="Enter admin email" autocomplete="username"></div>
<div class="loginField"><label>Password</label><input id="loginPassword" type="password" placeholder="Enter password" autocomplete="current-password"></div>
<button id="loginBtn" onclick="adminLogin()">🔐 Login</button>
<div id="loginMsg"></div>
</div>
</div>

<div id="adminApp">
<header class="header">
<div class="logo">🚕</div>
<div><div class="title">Safety Cab Admin</div><div class="sub">Admin Panel • Driver Radar • Control Center</div></div>
<div class="adminBar"><button class="logoutBtn" onclick="adminLogout()">Logout</button></div>
</header>

<section class="stats">
<div class="stat"><b id="total" class="blue">0</b>Total Drivers</div>
<div class="stat"><b id="online" class="green">0</b>Online</div>
<div class="stat"><b id="duty" class="blue">0</b>Duty ON</div>
</section>

<div id="firebaseStatus" class="firebaseStatus"></div>
<div id="map"></div>

<section class="panel">
<input id="search" class="search" placeholder="🔎 Search Driver / ID / Vehicle / Phone">
<div class="filters">
<button class="active" onclick="setFilter('all',this)">All</button>
<button onclick="setFilter('online',this)">🟢 Online</button>
<button onclick="setFilter('offline',this)">🔴 Offline</button>
<button onclick="setFilter('duty',this)">🟢 Duty ON</button>
<button onclick="setFilter('offduty',this)">⚪ Duty OFF</button>
</div>
</section>

<section id="driverList" class="list"></section>

<div class="bottom">
<button class="navbtn active" onclick="topMap()"><b>🗺️</b>Map</button>
<button class="navbtn" onclick="scrollList()"><b>🚕</b>Drivers</button>
<button class="navbtn" onclick="editDriver(null)"><b>➕</b>Add Driver</button>
<button class="navbtn" onclick="settings()"><b>⚙️</b>Settings</button>
</div>

<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
</div>

<div id="photoViewer" class="photoViewer" onclick="closePhoto(event)">
<button class="viewerClose" onclick="closePhoto()">✕</button>
<img id="viewerImage" src="" alt="Full Photo" onclick="event.stopPropagation()">
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const firebaseConfig={
apiKey:"AIzaSyBqSICccKKX94x04rjCUHXjW5EJoaI10Bc",
authDomain:"safety-cab-radar.firebaseapp.com",
databaseURL:"https://safety-cab-radar-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"safety-cab-radar",
storageBucket:"safety-cab-radar.firebasestorage.app",
messagingSenderId:"900129993912",
appId:"1:900129993912:web:48c98c4d62154d0f39704d"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),rtdb=firebase.database();
const DRIVER_COLLECTION="drivers",PUBLIC_DRIVER_COLLECTION="publicDrivers";

let drivers=[],filter="all",markers={},driversUnsubscribe=null,liveLocationsUnsubscribe=null,appStarted=false,liveLocations={},addressCache={};

const $=id=>document.getElementById(id);
const loginScreen=$("loginScreen"),adminApp=$("adminApp"),loginEmail=$("loginEmail"),loginPassword=$("loginPassword"),loginBtn=$("loginBtn"),loginMsg=$("loginMsg"),driverList=$("driverList"),search=$("search"),modal=$("modal"),sheet=$("sheet"),total=$("total"),online=$("online"),duty=$("duty"),firebaseStatus=$("firebaseStatus");

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function showStatus(message,type){firebaseStatus.textContent=message;firebaseStatus.className="firebaseStatus show "+type;}
function hideStatus(){firebaseStatus.className="firebaseStatus";}
function timestampText(v){
if(!v)return"Not updated";
try{
if(v.toDate)return v.toDate().toLocaleString();
if(v instanceof Date)return v.toLocaleString();
return String(v)
}catch(e){return"Not updated"}
}
function toMillis(v){
try{
if(v&&typeof v.toMillis==="function")return v.toMillis();
if(v&&typeof v.toDate==="function")return v.toDate().getTime();
const n=Number(v);
return Number.isFinite(n)?n:0;
}catch(e){return 0}
}
function liveTimestampText(v){
const n=toMillis(v);
return n?new Date(n).toLocaleString():"Not updated";
}
function relativeTimeText(v){
const n=toMillis(v);
if(!n)return"Not updated";
const sec=Math.floor(Math.max(0,Date.now()-n)/1000);
if(sec<10)return"Just now";
if(sec<60)return sec+" sec ago";
const min=Math.floor(sec/60);
if(min<60)return min+" min ago";
const hr=Math.floor(min/60);
if(hr<24)return hr+" hr ago";
const day=Math.floor(hr/24);
if(day<7)return day+" day"+(day===1?"":"s")+" ago";
return new Date(n).toLocaleString();
}
function updateRelativeTimes(){
document.querySelectorAll("[data-last-update]").forEach(el=>{
const ms=Number(el.getAttribute("data-last-update")||0);
el.textContent=relativeTimeText(ms);
});
}

async function adminLogin(){
const email=loginEmail.value.trim(),password=loginPassword.value;
loginMsg.textContent="";
if(!email||!password){loginMsg.textContent="Email and Password required.";return}
loginBtn.disabled=true;loginBtn.textContent="Logging in...";
try{
const result=await auth.signInWithEmailAndPassword(email,password),uid=result.user.uid;
const doc=await db.collection("admins").doc(uid).get();
if(!doc.exists||doc.data().role!=="admin"){await auth.signOut();loginMsg.textContent="Access denied. Admin account required.";loginBtn.disabled=false;loginBtn.textContent="🔐 Login";return}
}catch(e){console.error(e);loginMsg.textContent="Login failed: "+e.message;loginBtn.disabled=false;loginBtn.textContent="🔐 Login"}
}

function showAdmin(){
loginScreen.style.display="none";adminApp.style.display="block";loginBtn.disabled=false;loginBtn.textContent="🔐 Login";
setTimeout(()=>map.invalidateSize(),300);
if(!appStarted){appStarted=true;startDriversListener();startLiveLocationListener()}
}
async function adminLogout(){
if(driversUnsubscribe){driversUnsubscribe();driversUnsubscribe=null}
if(liveLocationsUnsubscribe){liveLocationsUnsubscribe();liveLocationsUnsubscribe=null}
appStarted=false;drivers=[];liveLocations={};clearMarkers();await auth.signOut();adminApp.style.display="none";loginScreen.style.display="flex";loginPassword.value="";loginMsg.textContent="";
}
auth.onAuthStateChanged(async user=>{
if(!user){adminApp.style.display="none";loginScreen.style.display="flex";appStarted=false;return}
try{
const doc=await db.collection("admins").doc(user.uid).get();
if(doc.exists&&doc.data().role==="admin")showAdmin();
else{await auth.signOut();loginMsg.textContent="Access denied. Admin account required."}
}catch(e){loginMsg.textContent="Authorization error: "+e.message;await auth.signOut()}
});

const map=L.map("map").setView([17.42536,78.48694],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);

function ico(d){return L.divIcon({className:"",html:`<div style="width:38px;height:38px;border-radius:50%;background:${d.online?"#18a957":"#777"};border:3px solid white;box-shadow:0 2px 7px #0008;display:flex;align-items:center;justify-content:center;font-size:19px">🚕</div>`,iconSize:[38,38],iconAnchor:[19,19]});}
function clearMarkers(){Object.values(markers).forEach(m=>map.removeLayer(m));markers={};}
function getDriverLiveData(d){
const l=liveLocations[d.id];
if(l&&Number.isFinite(Number(l.lat))&&Number.isFinite(Number(l.lng)))return {...d,lat:Number(l.lat),lng:Number(l.lng),online:l.online!==undefined?l.online===true:d.online,duty:l.duty!==undefined?l.duty===true:d.duty,telegramId:l.telegramId?String(l.telegramId):d.telegramId,last:l.updatedAt?liveTimestampText(l.updatedAt):d.last};
return d;
}

function buildPublicDriver(d){return{id:d.id||"",name:d.name||"",vehicle:d.vehicle||"",vehicleType:d.vehicleType||"",carPhoto:d.carPhoto||"",lat:Number(d.lat),lng:Number(d.lng),online:d.online===true,duty:d.duty===true,rating:Number(d.rating||0),telegramId:d.telegramId?String(d.telegramId):"",last:d.last||"Not updated",updatedAt:firebase.firestore.FieldValue.serverTimestamp()};}
async function syncPublicDriver(d){await db.collection(PUBLIC_DRIVER_COLLECTION).doc(d.id).set(buildPublicDriver(d),{merge:true});}
async function deletePublicDriver(id){await db.collection(PUBLIC_DRIVER_COLLECTION).doc(id).delete();}

function startDriversListener(){
if(driversUnsubscribe)driversUnsubscribe();
showStatus("Connecting to Firebase Drivers...","statusInfo");
driversUnsubscribe=db.collection(DRIVER_COLLECTION).onSnapshot(s=>{
drivers=s.docs.map(doc=>{const d=doc.data();return{id:d.id||doc.id,name:d.name||"",phone:d.phone||"",vehicle:d.vehicle||"",vehicleType:d.vehicleType||"",carPhoto:d.carPhoto||"",telegramId:d.telegramId?String(d.telegramId):"",lat:Number(d.lat),lng:Number(d.lng),online:d.online===true,duty:d.duty===true,rating:Number(d.rating||0),updatedAtMs:toMillis(d.updatedAt),last:d.last||timestampText(d.updatedAt),profilePhoto:d.profilePhoto||"",deviceUid:d.deviceUid||""}});
hideStatus();render();
},e=>{console.error(e);showStatus("Firebase Drivers error: "+e.message,"statusError");drivers=[];render()});
}
function startLiveLocationListener(){
if(liveLocationsUnsubscribe)liveLocationsUnsubscribe();
liveLocationsUnsubscribe=rtdb.ref("liveLocations").on("value",s=>{liveLocations=s.val()||{};applyLiveLocations()},e=>showStatus("Realtime GPS error: "+e.message,"statusError"));
}
function applyLiveLocations(){
if(!drivers.length)return;
let changed=false;
drivers=drivers.map(d=>{
  const l=liveLocations[d.id];
  if(!l||!Number.isFinite(Number(l.lat))||!Number.isFinite(Number(l.lng)))return d;
  changed=true;
  const next=getDriverLiveData({...d,lat:Number(l.lat),lng:Number(l.lng),online:l.online!==undefined?l.online===true:d.online,duty:l.duty!==undefined?l.duty===true:d.duty,telegramId:l.telegramId?String(l.telegramId):d.telegramId,updatedAtMs:l.updatedAt?toMillis(l.updatedAt):d.updatedAtMs,last:l.updatedAt?liveTimestampText(l.updatedAt):d.last});
  const m=markers[d.id];
  if(m){
    m.setLatLng([next.lat,next.lng]);
    m.setIcon(ico(next));
    m.bindTooltip(next.name||next.id,{direction:"top"});
  }
  return next;
});
if(changed){
  render();
  updateRelativeTimes();
  // Keep the selected/current driver centered on its newest GPS point without changing zoom.
  const sel=window.selectedDriverId&&drivers.find(x=>x.id===window.selectedDriverId);
  if(sel&&Number.isFinite(sel.lat)&&Number.isFinite(sel.lng)){map.panTo([sel.lat,sel.lng],{animate:true,duration:0.5});}
}
}

function driverLastUpdateMs(d){
const live=liveLocations[d.id];
if(live&&live.updatedAt!=null){
const n=toMillis(live.updatedAt);
if(n)return n;
}
const n=Number(d.updatedAtMs||0);
return Number.isFinite(n)&&n>0?n:0;
}
function driverLastUpdateHtml(d){
const ms=driverLastUpdateMs(d);
return ms
?`<span data-last-update="${ms}">${relativeTimeText(ms)}</span>`
:esc(d.last||"Not updated");
}

function render(){
const activeMarkerIds={};
drivers.forEach(o=>{
  const d=getDriverLiveData(o);
  if(!Number.isFinite(d.lat)||!Number.isFinite(d.lng))return;
  activeMarkerIds[d.id]=true;
  let m=markers[d.id];
  if(!m){
    m=L.marker([d.lat,d.lng],{icon:ico(d)}).addTo(map);
    m.on("click",()=>details(d.id));
    markers[d.id]=m;
  }else{
    m.setLatLng([d.lat,d.lng]);
    m.setIcon(ico(d));
  }
  m.bindTooltip(d.name||d.id,{direction:"top"});
});
Object.keys(markers).forEach(id=>{
  if(!activeMarkerIds[id]){try{map.removeLayer(markers[id])}catch(e){}delete markers[id]}
});
const q=search.value.toLowerCase().trim();
const arr=drivers.filter(o=>{const d=getDriverLiveData(o),t=((d.id||"")+" "+(d.name||"")+" "+(d.vehicle||"")+" "+(d.vehicleType||"")+" "+(d.phone||"")).toLowerCase();const qok=!q||t.includes(q);const fok=filter==="all"||(filter==="online"&&d.online)||(filter==="offline"&&!d.online)||(filter==="duty"&&d.duty)||(filter==="offduty"&&!d.duty);return qok&&fok});
driverList.innerHTML=arr.map(o=>{const d=getDriverLiveData(o);return`<div class="card">
<div class="name">${d.profilePhoto?`<img class="listPhoto" src="${esc(d.profilePhoto)}" onclick="openPhoto('${esc(d.profilePhoto)}')">`:"👤"}🚕 ${esc(d.name)} <span class="badge ${d.online?"on":"off"}">${d.online?"GPS ONLINE":"OFFLINE"}</span></div>
<div class="small">ID: ${esc(d.id)} • ${esc(d.vehicle)} • <span class="vehicleTypeBadge">${esc(d.vehicleType||"Not Set")}</span></div>
<div class="small">📞 ${esc(d.phone)} • ${d.duty?"🟢 Duty ON":"⚪ Duty OFF"} • ⭐ ${d.rating||"Not Rated"}</div>
<div class="small">Telegram ID: ${d.telegramId?esc(d.telegramId):"Not linked"}</div>
<div class="small">Live Coordinates: ${Number.isFinite(d.lat)?d.lat.toFixed(6):"N/A"}, ${Number.isFinite(d.lng)?d.lng.toFixed(6):"N/A"}</div>
<div class="small">Last update: ${driverLastUpdateHtml(d)}</div>
<div class="actions"><button class="btn" onclick="details('${esc(d.id)}')">View</button><button class="btn" onclick="editDriver('${esc(d.id)}')">Edit</button><button class="btn redbtn" onclick="delDriver('${esc(d.id)}')">Delete</button></div>
</div>`}).join("")||'<div class="card">No drivers found in Firebase.</div>';
total.textContent=drivers.length;online.textContent=drivers.filter(o=>getDriverLiveData(o).online).length;duty.textContent=drivers.filter(o=>getDriverLiveData(o).duty).length;
}

function openModal(content){sheet.innerHTML=content;modal.classList.add("show")}
function closeModal(){modal.classList.remove("show")}
function openPhoto(src){if(!src)return;$("viewerImage").src=src;$("photoViewer").classList.add("show")}
function closePhoto(e){if(e&&e.target&&e.target.id==="viewerImage")return;$("photoViewer").classList.remove("show");$("viewerImage").src=""}

async function getPresentLocation(lat,lng){
if(!Number.isFinite(lat)||!Number.isFinite(lng))return"Location not available";
const key=lat.toFixed(5)+","+lng.toFixed(5);if(addressCache[key])return addressCache[key];
try{const r=await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+encodeURIComponent(lat)+"&lon="+encodeURIComponent(lng)+"&zoom=18&addressdetails=1");if(!r.ok)return"Address unavailable";const d=await r.json();addressCache[key]=d.display_name||"Address unavailable";return addressCache[key]}catch(e){return"Address unavailable"}
}

async function loadDriverBookings(driverId){
const box=$("bookingList");if(!box)return;
box.innerHTML="<div class='noBooking'>Loading booking...</div>";
try{
const snap=await db.collection("bookings").where("driverId","==",driverId).get();
const docs=snap.docs.map(x=>({id:x.id,...x.data()})).filter(b=>["active","pending"].includes(String(b.status||"").toLowerCase())).sort((a,b)=>{
const ta=a.createdAt?.toMillis?a.createdAt.toMillis():Number(a.createdAt)||0;
const tb=b.createdAt?.toMillis?b.createdAt.toMillis():Number(b.createdAt)||0;return tb-ta;
});
if(!docs.length){box.innerHTML="<div class='noBooking'>No active booking for this driver.</div>";return}
box.innerHTML=docs.map(b=>`<div class="bookingItem">
<b>🔒 Booking</b><br><span class="bookingStatus">${esc(String(b.status||"ACTIVE").toUpperCase())}</span>
<p><b>Booking ID:</b><br>${esc(b.bookingId||b.id)}</p>
<p><b>Customer ID:</b><br>${esc(b.customerId||"Not available")}</p>
<p>📍 <b>Pickup:</b><br>${esc(b.pickupText||((b.pickupLat??"")+" , "+(b.pickupLng??"")))}</p>
<p>🏁 <b>Destination:</b><br>${esc(b.destinationText||((b.destinationLat??"")+" , "+(b.destinationLng??"")))}</p>
<p>🕒 <b>Created:</b><br>${esc(timestampText(b.createdAt)||"Not available")}</p>
<button class="closeBookingBtn" onclick="adminCloseBooking('${esc(b.id)}','${esc(driverId)}')">🔒 Close Booking as Admin</button>
</div>`).join("");
}catch(e){console.error(e);box.innerHTML="<div class='noBooking'>Booking load failed: "+esc(e.message)+"</div>"}
}

async function adminCloseBooking(bookingId,driverId){
if(!confirm("Close this booking as Admin?"))return;
try{
await db.collection("bookings").doc(bookingId).set({status:"closed",closedBy:"admin",closedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
await db.collection(DRIVER_COLLECTION).doc(driverId).set({bookingActive:false,bookingStatus:"free",bookingClosedBy:"admin",bookingClosedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});

await loadDriverBookings(driverId);
setTimeout(hideStatus,2500);
}catch(e){console.error(e);alert("Close booking failed: "+e.message)}
}

async function requestCurrentLocation(id){
const d=drivers.find(x=>x.id===id);
if(!d)return;
const statusBox=$("locationRequestStatus");
const btn=$("refreshLocationBtn");
const oldLive=liveLocations[id];
const oldUpdated=oldLive&&Number.isFinite(Number(oldLive.updatedAt))?Number(oldLive.updatedAt):0;
const requestId=String(Date.now())+"_"+String(Math.random()).slice(2,8);
if(btn){btn.disabled=true;btn.textContent="⏳ Requesting GPS..."}
if(statusBox)statusBox.innerHTML="📍 Driver GPS refresh request sent. Waiting for current location...";
try{
await rtdb.ref("locationRequests/"+id).set({driverId:id,requestId,requestedAt:firebase.database.ServerValue.TIMESTAMP,status:"pending"});
let tries=0;
const timer=setInterval(()=>{
tries++;
const live=liveLocations[id];
const updated=live&&Number.isFinite(Number(live.updatedAt))?Number(live.updatedAt):0;
if(updated>oldUpdated){
clearInterval(timer);
if(btn){btn.disabled=false;btn.textContent="📍 Refresh Current Location"}
if(statusBox)statusBox.innerHTML="✅ Current GPS received. Updating Admin...";
details(id);
return;
}
if(tries>=25){
clearInterval(timer);
if(btn){btn.disabled=false;btn.textContent="📍 Refresh Current Location"}
if(statusBox)statusBox.innerHTML="⚠️ New GPS not received. Driver's Telegram Mini App must be open and have Location permission.";
}
},1000);
}catch(e){
console.error(e);
if(btn){btn.disabled=false;btn.textContent="📍 Refresh Current Location"}
if(statusBox)statusBox.innerHTML="❌ GPS request failed: "+esc(e.message||e);
}
}

function previewProfilePhoto(input){const f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith("image/")){alert("Please select an image file.");input.value="";return}const r=new FileReader();r.onload=e=>{const p=$("profilePhotoPreview");if(p){p.src=e.target.result;p.style.display="block"}const h=$("profilePhotoPlaceholder");if(h)h.style.display="none"};r.readAsDataURL(f)}
function previewCarPhoto(input){const f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith("image/")){alert("Please select an image file.");input.value="";return}const r=new FileReader();r.onload=e=>{const p=$("carPhotoPreview");if(p){p.src=e.target.result;p.style.display="block"}const h=$("carPhotoPlaceholder");if(h)h.style.display="none"};r.readAsDataURL(f)}

function compressImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve("");const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const MAX=700;let w=img.width,h=img.height;if(w>h&&w>MAX){h=Math.round(h*MAX/w);w=MAX}else if(h>=w&&h>MAX){w=Math.round(w*MAX/h);h=MAX}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);let x=c.toDataURL("image/jpeg",.68);if(x.length>700000)x=c.toDataURL("image/jpeg",.52);if(x.length>900000)x=c.toDataURL("image/jpeg",.42);resolve(x)};img.onerror=()=>reject(new Error("Could not read image."));img.src=e.target.result};r.onerror=()=>reject(new Error("Could not read selected photo."));r.readAsDataURL(file)})}
function toggleRemovePhoto(){const c=$("f_removePhoto"),i=$("f_profilePhoto");if(c?.checked){if(i)i.value="";const p=$("profilePhotoPreview");if(p)p.style.display="none";const h=$("profilePhotoPlaceholder");if(h)h.style.display="block"}}

async function saveDriver(oldId){
const id=$("f_id").value.trim().toUpperCase(),name=$("f_name").value.trim(),phone=$("f_phone").value.trim(),vehicle=$("f_vehicle").value.trim(),vehicleType=$("f_vehicleType").value,telegramId=$("f_telegramId").value.trim(),deviceUid=$("f_deviceUid").value.trim(),lat=parseFloat($("f_lat").value),lng=parseFloat($("f_lng").value),online=$("f_online").value==="1",duty=$("f_duty").value==="1",rating=parseFloat($("f_rating").value)||0;
if(!id||!name||!vehicle||!Number.isFinite(lat)||!Number.isFinite(lng)){alert("Driver ID, Name, Vehicle Number, Latitude and Longitude are required.");return}
if(!oldId&&!deviceUid){alert("New Driver ke liye Device Pairing ID required hai. Driver App se Pairing ID copy karke yahan paste karein.");return}
if(!["Sedan","SUV"].includes(vehicleType)){alert("Vehicle Type must be Sedan or SUV.");return}
if(rating<0||rating>5){alert("Rating must be between 0 and 5.");return}
try{
let existingProfile="",existingCar="";
if(oldId){const s=await db.collection(DRIVER_COLLECTION).doc(oldId).get();if(s.exists){existingProfile=s.data().profilePhoto||"";existingCar=s.data().carPhoto||""}}
let profilePhoto=existingProfile,carPhoto=existingCar;
if($("f_removePhoto")?.checked)profilePhoto="";
if($("f_profilePhoto")?.files?.[0]){showStatus("Compressing profile photo...","statusInfo");profilePhoto=await compressImage($("f_profilePhoto").files[0])}
if($("f_removeCarPhoto")?.checked)carPhoto="";
if($("f_carPhoto")?.files?.[0]){showStatus("Compressing car photo...","statusInfo");carPhoto=await compressImage($("f_carPhoto").files[0])}
const data={id,name,phone,vehicle,vehicleType,carPhoto:carPhoto||"",telegramId:telegramId||"",deviceUid:deviceUid||"",lat,lng,online,duty,rating,profilePhoto:profilePhoto||"",last:"Just updated",updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
const oldData=oldId?((await db.collection(DRIVER_COLLECTION).doc(oldId).get()).data()||{}):{};
const oldDeviceUid=String(oldData.deviceUid||"").trim();
if(deviceUid){const pairSnap=await rtdb.ref("driverDevices").child(deviceUid).get();if(pairSnap.exists()){const pairedId=String(pairSnap.child("driverId").val()||"").trim().toUpperCase();if(pairedId&&pairedId!==oldId&&pairedId!==id){alert("Ye Device Pairing ID already "+pairedId+" ke saath paired hai.");hideStatus();return}}}
if(oldDeviceUid&&oldDeviceUid!==deviceUid){await rtdb.ref("driverDevices").child(oldDeviceUid).remove();}
if(deviceUid){await rtdb.ref("driverDevices").child(deviceUid).set({driverId:id,updatedAt:firebase.database.ServerValue.TIMESTAMP});}
if(oldId){
const oldRef=db.collection(DRIVER_COLLECTION).doc(oldId),oldDoc=await oldRef.get();if(!oldDoc.exists){alert("Old driver record not found in Firebase.");hideStatus();return}
if(id!==oldId){
const newRef=db.collection(DRIVER_COLLECTION).doc(id),newDoc=await newRef.get();if(newDoc.exists){alert("New Driver ID already exists.");hideStatus();return}
await newRef.set({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
await syncPublicDriver({...data});try{await deletePublicDriver(oldId)}catch(e){}await oldRef.delete();
}else{await oldRef.set(data,{merge:true});await syncPublicDriver({...data})}
}else{
const ref=db.collection(DRIVER_COLLECTION).doc(id),ex=await ref.get();if(ex.exists){alert("Driver ID already exists in Firebase.");hideStatus();return}
await ref.set({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await syncPublicDriver({...data});
}
closeModal();showStatus("Driver saved successfully.","statusOk");setTimeout(hideStatus,2500);
}catch(e){console.error(e);hideStatus();alert("Firebase save failed: "+e.message)}
}

async function delDriver(id){
const d=drivers.find(x=>x.id===id);if(!d)return;if(!confirm("Delete "+d.name+"?"))return;
try{const snap=await db.collection(DRIVER_COLLECTION).doc(id).get();const du=snap.exists?String(snap.data().deviceUid||"").trim():"";await db.collection(DRIVER_COLLECTION).doc(id).delete();if(du){try{await rtdb.ref("driverDevices").child(du).remove()}catch(e){console.warn("Pairing remove failed",e)}}try{await deletePublicDriver(id)}catch(e){}showStatus("Driver deleted successfully from Firebase.","statusOk");setTimeout(hideStatus,2500)}catch(e){alert("Firebase delete failed: "+e.message)}
}
