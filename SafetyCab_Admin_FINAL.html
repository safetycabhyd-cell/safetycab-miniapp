<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Safety Cab - Admin Panel FINAL</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#263238}button,input,select{font:inherit}.header{height:64px;background:#087fc3;color:#fff;display:flex;align-items:center;padding:0 14px;gap:10px}.logo{width:42px;height:42px;border-radius:50%;background:#ffd21c;display:flex;align-items:center;justify-content:center;font-size:22px}.title{font-size:20px;font-weight:800}.sub{font-size:11px;opacity:.9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:#fff}.stat{background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 2px 8px #0001}.stat b{font-size:24px;display:block}.blue{color:#087fc3}.green{color:#159447}.red{color:#d93636}#map{height:calc(100vh - 260px);min-height:390px}.panel{background:#fff;padding:10px;border-top:1px solid #ddd}.search{width:100%;padding:11px;border:1px solid #ccd5dd;border-radius:10px;margin-bottom:8px}.filters{display:flex;gap:6px;overflow:auto}.filters button{border:1px solid #ccd5dd;background:#fff;border-radius:18px;padding:8px 12px;white-space:nowrap}.filters button.active{background:#087fc3;color:#fff}.list{padding:8px;background:#f4f7fb;max-height:55vh;overflow:auto}.card{background:#fff;border-radius:12px;padding:11px;margin-bottom:8px;box-shadow:0 2px 7px #0001}.name{font-weight:800}.small{font-size:12px;color:#667}.badge{font-size:11px;padding:4px 7px;border-radius:10px}.on{background:#dff6e7;color:#087b35}.off{background:#eee;color:#666}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.btn{border:0;border-radius:8px;padding:8px 10px;background:#087fc3;color:#fff}.redbtn{background:#d93636}.gray{background:#667}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);z-index:1200}.navbtn{border:0;background:#fff;padding:8px 3px;color:#59636d;font-size:11px}.navbtn b{display:block;font-size:21px}.navbtn.active{color:#087fc3}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:2000;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}.sheet h2{margin-top:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin-bottom:9px}.field label{display:block;font-size:12px;color:#667;margin-bottom:4px}.field input,.field select{width:100%;padding:10px;border:1px solid #ccd5dd;border-radius:9px}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px}@media(min-width:800px){.bottom{left:20%;right:20%}}</style></head><body>
<header class="header"><div class="logo">🚕</div><div><div class="title">Safety Cab Admin</div><div class="sub">Admin Panel • Driver Radar • Control Center</div></div></header>
<section class="stats"><div class="stat"><b id="total" class="blue">0</b>Total Drivers</div><div class="stat"><b id="online" class="green">0</b>Online</div><div class="stat"><b id="duty" class="blue">0</b>Duty ON</div></section><div id="map"></div>
<section class="panel"><input id="search" class="search" placeholder="🔎 Search Driver / ID / Vehicle / Phone"><div class="filters"><button class="active" onclick="setFilter('all',this)">All</button><button onclick="setFilter('online',this)">🟢 Online</button><button onclick="setFilter('offline',this)">🔴 Offline</button><button onclick="setFilter('duty',this)">🟢 Duty ON</button><button onclick="setFilter('offduty',this)">⚪ Duty OFF</button></div></section><section id="driverList" class="list"></section>
<div class="bottom"><button class="navbtn active" onclick="topMap()"><b>🗺️</b>Map</button><button class="navbtn" onclick="scrollList()"><b>🚕</b>Drivers</button><button class="navbtn" onclick="editDriver(null)"><b>➕</b>Add Driver</button><button class="navbtn" onclick="settings()"><b>⚙️</b>Settings</button></div><div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const KEY='safetycab_admin_final_v1';let drivers=JSON.parse(localStorage.getItem(KEY)||'null')||[{id:'001',name:'Jaweed',phone:'9398179229',vehicle:'TS08UE0850',lat:17.42536,lng:78.48694,online:true,duty:true,rating:5,last:'Just now'},{id:'002',name:'Driver 2',phone:'9000000002',vehicle:'TS09AB1002',lat:17.431,lng:78.492,online:true,duty:true,rating:4.5,last:'2 min ago'},{id:'003',name:'Driver 3',phone:'9000000003',vehicle:'TS10CD1003',lat:17.418,lng:78.48,online:true,duty:false,rating:4,last:'4 min ago'},{id:'004',name:'Driver 4',phone:'9000000004',vehicle:'TS11EF1004',lat:17.438,lng:78.5,online:true,duty:false,rating:0,last:'8 min ago'},{id:'005',name:'Driver 5',phone:'9000000005',vehicle:'TS12GH1005',lat:17.405,lng:78.47,online:false,duty:false,rating:0,last:'1 hr ago'}];let filter='all',markers={};function save(){localStorage.setItem(KEY,JSON.stringify(drivers))}const map=L.map('map').setView([17.42536,78.48694],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function ico(d){return L.divIcon({className:'',html:`<div style="width:38px;height:38px;border-radius:50%;background:${d.online?'#18a957':'#777'};border:3px solid white;box-shadow:0 2px 7px #0008;display:flex;align-items:center;justify-content:center;font-size:19px">🚕</div>`,iconSize:[38,38],iconAnchor:[19,19]})}function render(){Object.values(markers).forEach(m=>map.removeLayer(m));markers={};drivers.forEach(d=>{let m=L.marker([d.lat,d.lng],{icon:ico(d)}).addTo(map);m.bindTooltip(d.name,{direction:'top'});m.on('click',()=>details(d.id));markers[d.id]=m});let q=document.getElementById('search').value.toLowerCase().trim();let arr=drivers.filter(d=>{let t=(d.id+' '+d.name+' '+d.vehicle+' '+d.phone).toLowerCase();let qok=!q||t.includes(q);let fok=filter==='all'||(filter==='online'&&d.online)||(filter==='offline'&&!d.online)||(filter==='duty'&&d.duty)||(filter==='offduty'&&!d.duty);return qok&&fok});document.getElementById('driverList').innerHTML=arr.map(d=>`<div class="card"><div class="name">🚕 ${esc(d.name)} <span class="badge ${d.online?'on':'off'}">${d.online?'GPS ONLINE':'OFFLINE'}</span></div><div class="small">ID: ${esc(d.id)} • ${esc(d.vehicle)}</div><div class="small">📞 ${esc(d.phone)} • ${d.duty?'🟢 Duty ON':'⚪ Duty OFF'} • ⭐ ${d.rating||'Not Rated'}</div><div class="small">Last update: ${esc(d.last)}</div><div class="actions"><button class="btn" onclick="details('${d.id}')">View</button><button class="btn" onclick="editDriver('${d.id}')">Edit</button><button class="btn redbtn" onclick="delDriver('${d.id}')">Delete</button></div></div>`).join('')||'<div class="card">No drivers found.</div>';total.textContent=drivers.length;online.textContent=drivers.filter(d=>d.online).length;duty.textContent=drivers.filter(d=>d.duty).length}function openModal(x){sheet.innerHTML=x;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}function details(id){let d=drivers.find(x=>x.id===id);if(!d)return;map.setView([d.lat,d.lng],16);openModal(`<button class="close" onclick="closeModal()">✕</button><h2>🚕 ${esc(d.name)}</h2><p><b>Driver ID:</b> ${esc(d.id)}</p><p><b>Phone:</b> ${esc(d.phone)}</p><p><b>Vehicle:</b> ${esc(d.vehicle)}</p><p><b>GPS:</b> ${d.online?'🟢 ONLINE':'🔴 OFFLINE'}</p><p><b>Duty:</b> ${d.duty?'🟢 ON':'⚪ OFF'}</p><p><b>Rating:</b> ⭐ ${d.rating||'Not Rated'}</p><p><b>Location:</b> ${d.lat.toFixed(6)}, ${d.lng.toFixed(6)}</p><p><b>Last update:</b> ${esc(d.last)}</p><div class="actions"><button class="btn" onclick="center('${d.id}')">📍 Center Map</button><a class="btn" style="text-decoration:none" href="tel:${esc(d.phone)}">📞 Call</a><button class="btn" onclick="editDriver('${d.id}')">✏️ Edit</button></div>`)}function center(id){closeModal();let d=drivers.find(x=>x.id===id);if(d)map.setView([d.lat,d.lng],16)}function editDriver(id){let d=id?drivers.find(x=>x.id===id):{id:'',name:'',phone:'',vehicle:'',lat:17.42536,lng:78.48694,online:false,duty:false,rating:0};openModal(`<button class="close" onclick="closeModal()">✕</button><h2>${id?'✏️ Edit Driver':'➕ Add Driver'}</h2><div class="row"><div class="field"><label>Driver ID</label><input id="f_id" value="${esc(d.id)}"></div><div class="field"><label>Name</label><input id="f_name" value="${esc(d.name)}"></div><div class="field"><label>Phone</label><input id="f_phone" value="${esc(d.phone)}"></div><div class="field"><label>Vehicle Number</label><input id="f_vehicle" value="${esc(d.vehicle)}"></div><div class="field"><label>Latitude</label><input id="f_lat" type="number" step="0.000001" value="${d.lat}"></div><div class="field"><label>Longitude</label><input id="f_lng" type="number" step="0.000001" value="${d.lng}"></div><div class="field"><label>GPS Status</label><select id="f_online"><option value="1" ${d.online?'selected':''}>Online</option><option value="0" ${!d.online?'selected':''}>Offline</option></select></div><div class="field"><label>Duty Status</label><select id="f_duty"><option value="1" ${d.duty?'selected':''}>Duty ON</option><option value="0" ${!d.duty?'selected':''}>Duty OFF</option></select></div><div class="field"><label>Rating</label><input id="f_rating" type="number" min="0" max="5" step=".5" value="${d.rating||0}"></div></div><button class="btn" onclick="saveDriver('${id||''}')">💾 Save Driver</button>`)}function saveDriver(old){let o={id:f_id.value.trim(),name:f_name.value.trim(),phone:f_phone.value.trim(),vehicle:f_vehicle.value.trim(),lat:parseFloat(f_lat.value),lng:parseFloat(f_lng.value),online:f_online.value==='1',duty:f_duty.value==='1',rating:parseFloat(f_rating.value)||0,last:'Just updated'};if(!o.id||!o.name||!Number.isFinite(o.lat)||!Number.isFinite(o.lng)){alert('Driver ID, Name, Latitude and Longitude are required.');return}if(old){let i=drivers.findIndex(x=>x.id===old);if(i>=0)drivers[i]=o}else{if(drivers.some(x=>x.id===o.id)){alert('Driver ID already exists.');return}drivers.push(o)}save();closeModal();render()}function delDriver(id){let d=drivers.find(x=>x.id===id);if(d&&confirm('Delete '+d.name+'?')){drivers=drivers.filter(x=>x.id!==id);save();render()}}function setFilter(f,el){filter=f;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}search.addEventListener('input',render);function scrollList(){driverList.scrollIntoView({behavior:'smooth'})}function topMap(){window.scrollTo({top:0,behavior:'smooth'})}function settings(){openModal(`<button class="close" onclick="closeModal()">✕</button><h2>⚙️ Admin Settings</h2><p><b>System:</b> Safety Cab Driver Radar</p><p><b>Version:</b> Final Demo v1.0</p><p>अभी यह demo/local data पर है। Firebase जोड़ने के बाद real-time shared drivers आएँगे।</p><button class="btn redbtn" onclick="if(confirm('Reset demo drivers?')){localStorage.removeItem(KEY);location.reload()}">Reset Demo Data</button>`)}modal.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();
</script></body></html>
