<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBqSICccKKX94x04rjCUHXjW5EJoaI10Bc",

authDomain:
"safety-cab-radar.firebaseapp.com",

databaseURL:
"https://safety-cab-radar-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"safety-cab-radar",

storageBucket:
"safety-cab-radar.firebasestorage.app",

messagingSenderId:
"900129993912",

appId:
"1:900129993912:web:48c98c4d62154d0f39704d"

};


/* =====================================================
   FIREBASE INITIALIZE
===================================================== */

firebase.initializeApp(firebaseConfig);

const auth =
firebase.auth();

const db =
firebase.firestore();

const rtdb =
firebase.database();


/* =====================================================
   FIRESTORE COLLECTIONS
===================================================== */

const DRIVER_COLLECTION =
"drivers";

const PUBLIC_DRIVER_COLLECTION =
"publicDrivers";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let drivers = [];

let filter = "all";

let markers = {};

let driversUnsubscribe = null;

let liveLocationsUnsubscribe = null;

let appStarted = false;

let liveLocations = {};

let addressCache = {};


/* =====================================================
   DOM HELPERS
===================================================== */

const loginScreen =
document.getElementById("loginScreen");

const adminApp =
document.getElementById("adminApp");

const loginEmail =
document.getElementById("loginEmail");

const loginPassword =
document.getElementById("loginPassword");

const loginBtn =
document.getElementById("loginBtn");

const loginMsg =
document.getElementById("loginMsg");

const driverList =
document.getElementById("driverList");

const search =
document.getElementById("search");

const modal =
document.getElementById("modal");

const sheet =
document.getElementById("sheet");

const total =
document.getElementById("total");

const online =
document.getElementById("online");

const duty =
document.getElementById("duty");

const firebaseStatus =
document.getElementById("firebaseStatus");


/* =====================================================
   STATUS MESSAGE
===================================================== */

function showStatus(message,type){

firebaseStatus.textContent =
message;

firebaseStatus.className =
"firebaseStatus show " + type;

}


function hideStatus(){

firebaseStatus.className =
"firebaseStatus";

}


/* =====================================================
   ADMIN LOGIN
===================================================== */

async function adminLogin(){

const email =
loginEmail.value.trim();

const password =
loginPassword.value;

loginMsg.textContent = "";


if(!email || !password){

loginMsg.textContent =
"Email and Password required.";

return;

}


loginBtn.disabled = true;

loginBtn.textContent =
"Logging in...";


try{

const result =
await auth.signInWithEmailAndPassword(
email,
password
);


const uid =
result.user.uid;


const adminDoc =
await db
.collection("admins")
.doc(uid)
.get();


if(
!adminDoc.exists ||
adminDoc.data().role !== "admin"
){

await auth.signOut();

loginMsg.textContent =
"Access denied. Admin account required.";

loginBtn.disabled = false;

loginBtn.textContent =
"🔐 Login";

return;

}


loginMsg.textContent = "";

}
catch(error){

console.error(error);

loginMsg.textContent =
"Login failed: " + error.message;

loginBtn.disabled = false;

loginBtn.textContent =
"🔐 Login";

}

}


/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdmin(){

loginScreen.style.display =
"none";

adminApp.style.display =
"block";


loginBtn.disabled = false;

loginBtn.textContent =
"🔐 Login";


setTimeout(function(){

map.invalidateSize();

},300);


if(!appStarted){

appStarted = true;

startDriversListener();

startLiveLocationListener();

}

}


/* =====================================================
   LOGOUT
===================================================== */

async function adminLogout(){

if(driversUnsubscribe){

driversUnsubscribe();

driversUnsubscribe = null;

}


if(liveLocationsUnsubscribe){

liveLocationsUnsubscribe();

liveLocationsUnsubscribe = null;

}


appStarted = false;

drivers = [];

liveLocations = {};

clearMarkers();


await auth.signOut();


adminApp.style.display =
"none";

loginScreen.style.display =
"flex";

loginPassword.value = "";

loginMsg.textContent = "";

}


/* =====================================================
   AUTH STATE CHECK
===================================================== */

auth.onAuthStateChanged(
async function(user){

if(!user){

adminApp.style.display =
"none";

loginScreen.style.display =
"flex";

appStarted = false;

return;

}


try{

const adminDoc =
await db
.collection("admins")
.doc(user.uid)
.get();


if(
adminDoc.exists &&
adminDoc.data().role === "admin"
){

showAdmin();

}
else{

await auth.signOut();

loginMsg.textContent =
"Access denied. Admin account required.";

}

}
catch(error){

console.error(
"Admin authorization error:",
error
);

loginMsg.textContent =
"Authorization error: " +
error.message;

await auth.signOut();

}

});


/* =====================================================
   MAP
===================================================== */

const map =
L.map("map")
.setView(
[17.42536,78.48694],
13
);


L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:
"© OpenStreetMap contributors"
}
).addTo(map);


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(x){

return String(x ?? "")
.replace(
/[&<>"']/g,
function(m){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m];

});

}


/* =====================================================
   FIRESTORE TIMESTAMP
===================================================== */

function timestampText(value){

if(!value){

return "Not updated";

}


try{

if(
value.toDate &&
typeof value.toDate === "function"
){

const d =
value.toDate();

return d.toLocaleString();

}


if(value instanceof Date){

return value.toLocaleString();

}


return String(value);

}
catch(error){

return "Not updated";

}

}


/* =====================================================
   LIVE TIMESTAMP
===================================================== */

function liveTimestampText(value){

if(!value){

return "Not updated";

}


try{

const n =
Number(value);

if(!Number.isFinite(n)){

return String(value);

}


return new Date(n).toLocaleString();

}
catch(error){

return "Not updated";

}

}


/* =====================================================
   DRIVER MAP ICON
===================================================== */

function ico(d){

return L.divIcon({

className:"",

html:

`<div style="
width:38px;
height:38px;
border-radius:50%;
background:${d.online ? "#18a957" : "#777"};
border:3px solid white;
box-shadow:0 2px 7px #0008;
display:flex;
align-items:center;
justify-content:center;
font-size:19px
">🚕</div>`,

iconSize:
[38,38],

iconAnchor:
[19,19]

});

}


/* =====================================================
   CLEAR MAP MARKERS
===================================================== */

function clearMarkers(){

Object
.values(markers)
.forEach(function(marker){

map.removeLayer(marker);

});


markers = {};

}


/* =====================================================
   BUILD PUBLIC DRIVER DATA
===================================================== */

function buildPublicDriver(d){

return {

id:
d.id || "",

name:
d.name || "",

vehicle:
d.vehicle || "",

lat:
Number(d.lat),

lng:
Number(d.lng),

online:
d.online === true,

duty:
d.duty === true,

rating:
Number(d.rating || 0),

telegramId:
d.telegramId
?
String(d.telegramId)
:
"",

last:
d.last || "Not updated",

updatedAt:
firebase.firestore.FieldValue.serverTimestamp()

};

}


/* =====================================================
   SYNC ONE DRIVER TO PUBLIC DRIVERS
===================================================== */

async function syncPublicDriver(d){

const publicRef =
db
.collection(PUBLIC_DRIVER_COLLECTION)
.doc(d.id);


const publicData =
buildPublicDriver(d);


await publicRef.set(
publicData,
{
merge:true
}
);

}


/* =====================================================
   DELETE PUBLIC DRIVER
===================================================== */

async function deletePublicDriver(id){

await db
.collection(PUBLIC_DRIVER_COLLECTION)
.doc(id)
.delete();

}


/* =====================================================
   FIRESTORE DRIVER LISTENER
===================================================== */

function startDriversListener(){

if(driversUnsubscribe){

driversUnsubscribe();

driversUnsubscribe = null;

}


showStatus(
"Connecting to Firebase Drivers...",
"statusInfo"
);


driversUnsubscribe =
db
.collection(DRIVER_COLLECTION)
.onSnapshot(
function(snapshot){

drivers =
snapshot.docs.map(
function(doc){

const data =
doc.data();

return {

id:
data.id || doc.id,

name:
data.name || "",

phone:
data.phone || "",

vehicle:
data.vehicle || "",

telegramId:
data.telegramId
?
String(data.telegramId)
:
"",

lat:
Number(data.lat),

lng:
Number(data.lng),

online:
data.online === true,

duty:
data.duty === true,

rating:
Number(data.rating || 0),

last:
data.last ||
timestampText(data.updatedAt)

};

}
);


hideStatus();

render();

},
function(error){

console.error(
"Firestore listener error:",
error
);

showStatus(
"Firebase Drivers error: " +
error.message,
"statusError"
);

drivers = [];

render();

});

}


/* =====================================================
   REALTIME DATABASE LIVE LOCATION LISTENER
===================================================== */

function startLiveLocationListener(){

if(liveLocationsUnsubscribe){

liveLocationsUnsubscribe();

liveLocationsUnsubscribe = null;

}


liveLocationsUnsubscribe =
rtdb
.ref("liveLocations")
.on(
"value",
function(snapshot){

const data =
snapshot.val() || {};

liveLocations =
data;

applyLiveLocations();

},
function(error){

console.error(
"Realtime Database listener error:",
error
);

showStatus(
"Realtime GPS error: " +
error.message,
"statusError"
);

});

}


/* =====================================================
   APPLY LIVE GPS TO DRIVERS
===================================================== */

function applyLiveLocations(){

if(!drivers.length){

return;

}


let changed = false;


drivers =
drivers.map(
function(d){

const live =
liveLocations[d.id];


if(
!live ||
!Number.isFinite(Number(live.lat)) ||
!Number.isFinite(Number(live.lng))
){

return d;

}


changed = true;


return {

...d,

lat:
Number(live.lat),

lng:
Number(live.lng),

online:
live.online !== undefined
?
live.online === true
:
d.online,

duty:
live.duty !== undefined
?
live.duty === true
:
d.duty,

telegramId:
live.telegramId
?
String(live.telegramId)
:
d.telegramId,

last:
live.updatedAt
?
liveTimestampText(live.updatedAt)
:
d.last

};

}
);


if(changed){

render();

}

}


/* =====================================================
   CURRENT LIVE DRIVER DATA
===================================================== */

function getDriverLiveData(d){

const live =
liveLocations[d.id];


if(
live &&
Number.isFinite(Number(live.lat)) &&
Number.isFinite(Number(live.lng))
){

return {

...d,

lat:
Number(live.lat),

lng:
Number(live.lng),

online:
live.online !== undefined
?
live.online === true
:
d.online,

duty:
live.duty !== undefined
?
live.duty === true
:
d.duty,

telegramId:
live.telegramId
?
String(live.telegramId)
:
d.telegramId,

last:
live.updatedAt
?
liveTimestampText(live.updatedAt)
:
d.last

};

}


return d;

}


/* =====================================================
   REVERSE GEOCODE CURRENT LOCATION
===================================================== */

async function getPresentLocation(lat,lng){

if(
!Number.isFinite(lat) ||
!Number.isFinite(lng)
){

return "Location not available";

}


const key =
lat.toFixed(5) +
"," +
lng.toFixed(5);


if(addressCache[key]){

return addressCache[key];

}


try{

const url =
"https://nominatim.openstreetmap.org/reverse" +
"?format=jsonv2" +
"&lat=" +
encodeURIComponent(lat) +
"&lon=" +
encodeURIComponent(lng) +
"&zoom=18" +
"&addressdetails=1";


const response =
await fetch(url);


if(!response.ok){

return "Address unavailable";

}


const data =
await response.json();


let address =
data.display_name;


if(!address){

address =
"Address unavailable";

}


addressCache[key] =
address;


return address;

}
catch(error){

console.error(
"Reverse geocode error:",
error
);

return "Address unavailable";

}

}


/* =====================================================
   UPDATE PRESENT LOCATION IN MODAL
===================================================== */

async function updatePresentLocation(id,lat,lng){

const box =
document.getElementById(
"presentLocation"
);


if(!box){

return;

}


box.innerHTML =
"📍 <b>Present Location:</b><br>Finding current location...";


const address =
await getPresentLocation(
lat,
lng
);


if(
document.getElementById(
"presentLocation"
)
){

document.getElementById(
"presentLocation"
).innerHTML =

"📍 <b>Present Location:</b><br>" +
esc(address);

}

}

function(original){

getDriverLiveData(original);

!Number.isFinite(d.lat) ||
!Number.isFinite(d.lng)
){

return;

}


const marker =
L.marker(
[d.lat,d.lng],
{
icon:ico(d)
}
)
.addTo(map);


marker.bindTooltip(
d.name || d.id,
{
direction:"top"
}
);


marker.on(
"click",
function(){

details(d.id);

}
);


markers[d.id] =
marker;

});


/* ================= SEARCH ================= */

search.value
.toLowerCase()
.trim();

drivers.filter(
function(original){

const d =
getDriverLiveData(original);


const t =
(
(d.id || "") +
" " +
(d.name || "") +
" " +
(d.vehicle || "") +
" " +
(d.phone || "")
)
.toLowerCase();


const qok =
!q ||
t.includes(q);


const fok =
filter === "all" ||

(
filter === "online" &&
d.online
) ||

(
filter === "offline" &&
!d.online
) ||

(
filter === "duty" &&
d.duty
) ||

(
filter === "offduty" &&
!d.duty
);


return qok && fok;

const d =
getDriverLiveData(original);

Number.isFinite(d.lat) &&

16

/* =====================================================
   SAVE DRIVER
===================================================== */

async function saveDriver(oldId){

const id =
document
.getElementById("f_id")
.value
.trim();


const name =
document
.getElementById("f_name")
.value
.trim();


const phone =
document
.getElementById("f_phone")
.value
.trim();


const vehicle =
document
.getElementById("f_vehicle")
.value
.trim();


const telegramId =
document
.getElementById("f_telegramId")
.value
.trim();


const lat =
parseFloat(
document
.getElementById("f_lat")
.value
);


const lng =
parseFloat(
document
.getElementById("f_lng")
.value
);


const online =
document
.getElementById("f_online")
.value === "1";


const duty =
document
.getElementById("f_duty")
.value === "1";


const rating =
parseFloat(
document
.getElementById("f_rating")
.value
) || 0;


if(
!id ||
!name ||
!Number.isFinite(lat) ||
!Number.isFinite(lng)
){

alert(
"Driver ID, Name, Latitude and Longitude are required."
);

return;

}


if(
rating < 0 ||
rating > 5
){

alert(
"Rating must be between 0 and 5."
);

return;

}


try{

const driverData = {

id:id,

name:name,

phone:phone,

vehicle:vehicle,

telegramId:
telegramId || "",

lat:lat,

lng:lng,

online:online,

duty:duty,

rating:rating,

last:"Just updated",

updatedAt:
firebase.firestore.FieldValue.serverTimestamp()

};


/* =====================================================
   EDIT
===================================================== */

if(oldId){

const oldRef =
db
.collection(DRIVER_COLLECTION)
.doc(oldId);


const oldDoc =
await oldRef.get();


if(!oldDoc.exists){

alert(
"Old driver record not found in Firebase."
);

return;

}


/*
 Driver ID changed.
*/

if(id !== oldId){

const newRef =
db
.collection(DRIVER_COLLECTION)
.doc(id);


const newDoc =
await newRef.get();


if(newDoc.exists){

alert(
"New Driver ID already exists."
);

return;

}


/* Save private driver record */

await newRef.set({

...driverData,

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});


/* Create public radar record */

await db
.collection(PUBLIC_DRIVER_COLLECTION)
.doc(id)
.set(
buildPublicDriver({
...driverData
})
);


/* Remove old public record */

try{

await deletePublicDriver(oldId);

}catch(e){

console.log(
"Old public record not found."
);

}


/* Delete old private record */

await oldRef.delete();

}
else{

/* Update private record */

await oldRef.set(
driverData,
{
merge:true
}
);


/* Update public radar record */

await syncPublicDriver({
...driverData
});

}

}


/* =====================================================
   ADD
===================================================== */

else{

const newRef =
db
.collection(DRIVER_COLLECTION)
.doc(id);


const existing =
await newRef.get();


if(existing.exists){

alert(
"Driver ID already exists in Firebase."
);

return;

}


/* Save private driver */

await newRef.set({

...driverData,

createdAt:
firebase.firestore.FieldValue.serverTimestamp(),

updatedAt:
firebase.firestore.FieldValue.serverTimestamp()

});


/* Save public radar driver */

await syncPublicDriver({
...driverData
});

}


closeModal();


showStatus(
"Driver saved successfully. Radar data synced.",
"statusOk"
);


setTimeout(
hideStatus,
3000
);


}
catch(error){

console.error(
"Save driver error:",
error
);


alert(
"Firebase save failed: " +
error.message
);

}

}


/* =====================================================
   DELETE DRIVER
===================================================== */

async function delDriver(id){

const d =
drivers.find(
function(x){

return x.id === id;

}
);


if(!d){

return;

}


if(
!confirm(
"Delete " +
d.name +
"?"
)
){

return;

}


try{

/* Delete private record */

await db
.collection(DRIVER_COLLECTION)
.doc(id)
.delete();


/* Delete public radar record */

try{

await deletePublicDriver(id);

}catch(publicError){

console.log(
"Public driver record already missing."
);

}


showStatus(
"Driver deleted successfully from Firebase.",
"statusOk"
);


setTimeout(
hideStatus,
2500
);


}
catch(error){

console.error(
"Delete driver error:",
error
);


alert(
"Firebase delete failed: " +
error.message
);

}

}
