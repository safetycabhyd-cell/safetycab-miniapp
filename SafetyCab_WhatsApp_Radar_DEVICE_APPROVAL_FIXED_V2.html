<!doctype html><html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Safety Cab Driver Radar - Device Approval</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6ff;color:#222}
.wrap{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:24px;padding:28px 18px;margin:45px auto 20px;box-shadow:0 8px 30px #0002;text-align:center}
.logo{font-size:58px}h1{font-size:29px;margin:8px 0 10px}.sub{color:#666;line-height:1.5}
input{width:100%;padding:16px;border:1px solid #d7dbe5;border-radius:14px;font-size:18px;margin:18px 0 10px;text-transform:uppercase}
button{width:100%;padding:15px;border:0;border-radius:13px;background:#1187c9;color:#fff;font-size:17px;font-weight:700}
button:disabled{opacity:.6}.msg{margin-top:14px;padding:14px;border-radius:13px;line-height:1.5}.info{background:#e9f4ff;color:#165a82}.ok{background:#e4f8ea;color:#176b32}.warn{background:#fff5d9;color:#765600}.err{background:#ffe5e5;color:#a51e1e}
.device{margin-top:16px;background:#f4f5fb;padding:13px;border-radius:12px;color:#555;word-break:break-all;font-size:14px}.hidden{display:none!important}
#radarView{display:none}.top{background:#1187c9;color:#fff;padding:16px 18px;font-size:21px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.stat{background:#fff;border-radius:14px;padding:13px;text-align:center;box-shadow:0 2px 10px #0001}.stat b{display:block;font-size:24px;color:#1187c9}
#map{height:68vh;min-height:430px}.bottom{background:#fff;padding:12px;text-align:center;color:#666;font-size:14px}.driver-list{padding:10px}.driver{background:#fff;margin:8px 0;padding:12px;border-radius:12px;box-shadow:0 2px 8px #0000000d}.small{font-size:13px;color:#666}
</style></head><body>
<div id="approvalView" class="wrap"><div class="card">
<div class="logo">🚕</div><h1>Safety Cab Driver Radar</h1>
<div class="sub">🔐 <b>Device Approval Security</b><br>पहली बार इस फोन पर Radar चलाने के लिए Driver ID से Device Approval लेना होगा।</div>
<input id="driverId" placeholder="DRIVER ID E.G. DC001" maxlength="20" autocomplete="off">
<button id="requestBtn">📱 REQUEST DEVICE APPROVAL</button><div id="message" class="msg hidden"></div>
<div class="device"><b>Device ID:</b><br><span id="deviceIdText"></span><br>यह ID इसी browser/device में सुरक्षित रहेगी।</div>
</div></div>
<div id="radarView"><div class="top">🚕 Safety Cab Driver Radar</div>
<div class="stats"><div class="stat"><b id="total">0</b>Total</div><div class="stat"><b id="online">0</b>Online</div><div class="stat"><b id="duty">0</b>Duty ON</div></div>
<div id="map"></div><div id="driverList" class="driver-list"></div><div class="bottom">Safety Cab • Approved Device</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import{getAuth,signInAnonymously,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const app=initializeApp({
apiKey:"AIzaSyBqSICccKKX94x04rjCUHXjW5EJoaI10Bc",
authDomain:"safety-cab-radar.firebaseapp.com",
databaseURL:"https://safety-cab-radar-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"safety-cab-radar",storageBucket:"safety-cab-radar.firebasestorage.app",
messagingSenderId:"900129993912",appId:"1:900129993912:web:48c98c4d62154d0f39704d"
});
const auth=getAuth(app),db=getFirestore(app),rtdb=getDatabase(app);
const av=document.getElementById("approvalView"),rv=document.getElementById("radarView");
const inp=document.getElementById("driverId"),btn=document.getElementById("requestBtn"),msg=document.getElementById("message");
let user=null,unsub=null,started=false,map,markers={};
function device(){let x=localStorage.getItem("safetyCabDeviceId");if(!x){x=crypto.randomUUID();localStorage.setItem("safetyCabDeviceId",x)}return x}
const deviceId=device();document.getElementById("deviceIdText").textContent=deviceId;
function show(t,c="info"){msg.className="msg "+c;msg.textContent=t;msg.classList.remove("hidden")}
onAuthStateChanged(auth,u=>{user=u});
signInAnonymously(auth).catch(e=>show("❌ Firebase Anonymous Login failed: "+e.message,"err"));

function listen(driverId){
 if(unsub)unsub();
 const rq=doc(db,"deviceRequests",deviceId);
 const ap=doc(db,"approvedDevices",deviceId);
 unsub=onSnapshot(rq,async s=>{
   if(s.exists()){let d=s.data();
     if(d.status==="approved")return openRadar(driverId);
     if(d.status==="rejected")return show("❌ Admin ने इस Device को Reject किया है।","err");
     if(d.status==="revoked")return show("⛔ इस Device की Approval Revoke कर दी गई है।","err");
     return show("🟡 Approval Pending है। Admin के Approve करने का इंतजार करें।","warn");
   }
   try{let a=await getDoc(ap);if(a.exists()&&a.data().status==="approved")openRadar(driverId)}
   catch(e){console.error(e)}
 },e=>show("❌ Approval status read failed: "+e.message,"err"));
}
btn.onclick=async()=>{
 const driverId=inp.value.trim().toUpperCase();
 if(!driverId)return show("⚠️ पहले Driver ID डालें, जैसे DC001।","warn");
 if(!user)return show("⏳ Firebase login हो रहा है। 2 सेकंड बाद फिर दबाएँ।","warn");
 btn.disabled=true;btn.textContent="⏳ SENDING...";
 try{
   const ap=await getDoc(doc(db,"approvedDevices",deviceId));
   if(ap.exists()&&ap.data().status==="approved"){show("✅ Device पहले से Approved है। Radar खोल रहा हूँ...","ok");return openRadar(driverId)}
   await setDoc(doc(db,"deviceRequests",deviceId),{
     deviceId,driverId,status:"pending",requestedByUid:user.uid,requestedAt:serverTimestamp(),
     userAgent:navigator.userAgent
   },{merge:true});
   show("✅ Device Approval Request भेज दी गई है। Admin Panel में Pending दिखाई देगा।","ok");
   listen(driverId);
 }catch(e){console.error(e);show("❌ Request भेजी नहीं गई: "+e.message,"err")}
 finally{btn.disabled=false;btn.textContent="📱 REQUEST DEVICE APPROVAL"}
};

function openRadar(driverId){if(started)return;started=true;av.classList.add("hidden");rv.style.display="block";setTimeout(startRadar,100)}
function startRadar(){
 map=L.map("map").setView([17.385,78.4867],12);
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
 onValue(ref(rtdb,"liveLocations"),snap=>{
   const data=snap.val()||{};let total=0,on=0,duty=0,list=[];
   Object.entries(data).forEach(([id,v])=>{
     if(!v)return;let lat=Number(v.lat??v.latitude),lng=Number(v.lng??v.longitude);
     if(!Number.isFinite(lat)||!Number.isFinite(lng))return;
     total++;let online=v.online===true||v.isOnline===true||v.status==="online"||v.duty===true||v.dutyOn===true;
     let du=v.duty===true||v.dutyOn===true||String(v.dutyStatus||"").toLowerCase()==="on";
     if(online)on++;if(du)duty++;let did=v.driverId||id,name=v.name||v.driverName||id;
     list.push([did,name,online,du]);
     let pop="<b>🚕 Safety Cab</b><br>Driver ID: "+esc(did)+"<br>Name: "+esc(name)+"<br>"+(online?"🟢 Online":"🔴 Offline")+"<br>"+(du?"🟢 Duty ON":"⚪ Duty OFF");
     if(markers[id]){markers[id].setLatLng([lat,lng]).bindPopup(pop)}else markers[id]=L.marker([lat,lng]).addTo(map).bindPopup(pop);
   });
   Object.keys(markers).forEach(id=>{if(!data[id]){map.removeLayer(markers[id]);delete markers[id]}});
   totalEl.textContent=total;onlineEl.textContent=on;dutyEl.textContent=duty;
   listEl.innerHTML=list.map(x=>'<div class="driver"><b>🚕 '+esc(x[0])+'</b> — '+esc(x[1])+'<div class="small">'+(x[2]?"🟢 Online":"🔴 Offline")+" | "+(x[3]?"🟢 Duty ON":"⚪ Duty OFF")+"</div></div>").join("");
 });
}
const totalEl=document.getElementById("total"),onlineEl=document.getElementById("online"),dutyEl=document.getElementById("duty"),listEl=document.getElementById("driverList");
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body></html>
