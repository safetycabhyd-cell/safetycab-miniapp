<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<title>Safety Cab Admin Panel</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial,sans-serif;
background:#f2f2f2;
margin:0;
padding:15px;
}

h2{
margin-top:5px;
}

.box{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

input{
width:100%;
box-sizing:border-box;
padding:12px;
margin:6px 0;
border:1px solid #ccc;
border-radius:6px;
}

.driver{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
border-left:5px solid green;
}

.selectBox{
display:flex;
align-items:center;
gap:8px;
margin-bottom:10px;
}

.selectBox input{
width:20px;
height:20px;
margin:0;
}

.deleteBtn{
background:#d32f2f;
color:white;
border:0;
padding:10px;
border-radius:6px;
margin-top:10px;
width:100%;
}

.status{
color:green;
font-weight:bold;
}

</style>

</head>


<body>


<h2>🚕 Safety Cab Admin</h2>


<div class="box">

<h3>🔎 Search Driver</h3>

<input
id="search"
placeholder="Driver Name / ID / Vehicle"
oninput="showDrivers()">

</div>


<h3>👨‍✈️ Driver List</h3>


<div id="list">
Loading...
</div>


<script>


/* =========================
   LOAD SAVED DRIVERS
========================= */

let drivers =
JSON.parse(
localStorage.getItem("drivers")
) || [];



/* =========================
   SHOW DRIVERS
========================= */

function showDrivers(){

let search =
document.getElementById("search")
.value
.toLowerCase()
.trim();


let html = "";


let filtered =
drivers.filter(function(d){

return (

String(d.id || "")
.toLowerCase()
.includes(search)

||

String(d.name || "")
.toLowerCase()
.includes(search)

||

String(d.vehicle || "")
.toLowerCase()
.includes(search)

);

});


if(filtered.length === 0){

html =
"<p>कोई Driver नहीं मिला।</p>";

}


filtered.forEach(function(d){

/*
   Original array में Driver का index
*/

let index =
drivers.indexOf(d);


html += `

<div class="driver">

<div class="selectBox">

<input
type="checkbox"
id="select_${index}">

<label for="select_${index}">
Select Driver
</label>

</div>


<b>Driver ID:</b>
${d.id || "-"}

<br><br>


<b>Name:</b>
${d.name || "-"}

<br><br>


<b>Vehicle:</b>
${d.vehicle || "-"}

<br><br>


<b>Latitude:</b>
${d.latitude || "-"}

<br>

<b>Longitude:</b>
${d.longitude || "-"}

<br><br>


<b>Status:</b>

<span class="status">
🟢 ${d.status || "Online"}
</span>

<br><br>


<b>Last Update:</b>
${d.time || "-"}


<button
class="deleteBtn"
onclick="deleteDriver(${index})">

🗑️ Delete This Driver

</button>

</div>

`;

});


document.getElementById("list")
.innerHTML = html;

}



/* =========================
   DELETE ONE DRIVER
========================= */

function deleteDriver(index){

let driver =
drivers[index];


if(!driver){

return;

}


let ok =
confirm(
"क्या " +
(driver.name || "इस Driver") +
" को Delete करना है?"
);


if(!ok){

return;

}


/*
   सिर्फ Selected Driver Delete
*/

drivers.splice(index,1);


/*
   Save remaining Drivers
*/

localStorage.setItem(
"drivers",
JSON.stringify(drivers)
);


/*
   Refresh List
*/

showDrivers();


alert(
"Driver Delete हो गया"
);

}



/* =========================
   START
========================= */

showDrivers();

</script>


</body>

</html>
