<!DOCTYPE html>
<html>
<head>
<title>GPS Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<h2>Driver GPS Test</h2>

<button onclick="getGPS()">
Get Location
</button>

<p id="result">
Location Waiting...
</p>


<script>

function getGPS(){

navigator.geolocation.getCurrentPosition(

function(position){

let lat = position.coords.latitude;
let lng = position.coords.longitude;

document.getElementById("result").innerHTML =
"Latitude: " + lat +
"<br>Longitude: " + lng;

},

function(error){

document.getElementById("result").innerHTML =
"GPS Error: Permission Allow करें";

}

);

}

</script>

</body>
</html>
