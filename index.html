<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafetyCab</title>
</head>

<body style="font-family:Arial;background:#f5f5f5;text-align:center;padding:20px;">

<h1>🚖 SafetyCab</h1>
<h2>Book Your Ride</h2>

<input id="pickup" type="text" placeholder="📍 Pick-up Location"
style="width:90%;padding:12px;margin:10px;font-size:16px;"><br>

<input id="drop" type="text" placeholder="📍 Drop Location"
style="width:90%;padding:12px;margin:10px;font-size:16px;"><br>

<button onclick="getLocation()"
style="width:90%;padding:15px;margin:10px;background:#007bff;color:white;border:none;border-radius:10px;font-size:18px;">
📍 Use Current Location
</button><br>

<button onclick="bookRide()"
style="width:90%;padding:15px;margin:10px;background:green;color:white;border:none;border-radius:10px;font-size:20px;">
🚕 Book Ride
</button><br>

<button onclick="sos()"
style="width:90%;padding:15px;margin:10px;background:red;color:white;border:none;border-radius:10px;font-size:20px;">
🚨 SOS Emergency
</button>

<p id="location" style="font-size:16px;color:blue;"></p>

<script>
function getLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
      let lat = position.coords.latitude;
      let lon = position.coords.longitude;

      document.getElementById("pickup").value = lat + ", " + lon;
      document.getElementById("location").innerHTML =
        "Current Location:<br>" + lat + ", " + lon;
    }, function() {
      alert("Location permission denied.");
    });
  } else {
    alert("Geolocation is not supported.");
  }
}

function bookRide() {
  let pickup = document.getElementById("pickup").value;
  let drop = document.getElementById("drop").value;

  if (pickup === "" || drop === "") {
    alert("Please enter Pick-up and Drop Location.");
    return;
  }

  alert("Ride Booked!\n\nPickup: " + pickup + "\nDrop: " + drop);
}

function sos() {
  alert("🚨 SOS Alert Activated!");
}
</script>

</body>
</html>
