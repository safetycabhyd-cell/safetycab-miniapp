
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafetyCab</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
text-align:center;
padding:20px;
}

input,button{
width:90%;
padding:15px;
margin:10px;
font-size:18px;
border-radius:10px;
}

button{
border:none;
color:white;
cursor:pointer;
}

#locationBtn{
background:#007bff;
}

#bookBtn{
background:green;
}

#sosBtn{
background:red;
}
</style>
</head>

<body>

<h1>🚖 SafetyCab</h1>
<h2>Book Your Ride</h2>

<input id="pickup" type="text" placeholder="📍 Pick-up Location">

<input id="drop" type="text" placeholder="📍 Drop Location">

<button id="locationBtn" onclick="getLocation()">
📍 Use Current Location
</button>

<button id="bookBtn" onclick="bookRide()">
🚕 Book Ride
</button>

<button id="sosBtn" onclick="sos()">
🚨 SOS Emergency
</button>

<p id="location"></p>

<script>
  function getLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
      let lat = position.coords.latitude;
      let lon = position.coords.longitude;

      document.getElementById("pickup").value = lat + "," + lon;
      document.getElementById("location").innerHTML =
        "Current Location:<br>" + lat + "," + lon;
    }, function() {
      alert("Location permission denied.");
    });
  } else {
    alert("Geolocation is not supported.");
  }
}

function bookRide() {
  let pickup = document.getElementById("pickup").value;
  let drop = document.getElementById("drop").value;

  if (pickup === "" || drop === "") {
    alert("Please enter Pick-up and Drop Location.");
    return;
  }

  window.open(
    "https://www.google.com/maps/dir/?api=1&origin=" +
    encodeURIComponent(pickup) +
    "&destination=" +
    encodeURIComponent(drop) +
    "&travelmode=driving",
    "_blank"
  );
}

function sos() {
  window.location.href = "tel:112";
}
</script>

</body>
</html>
