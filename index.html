<!DOCTYPE html>
<html>
<head>

<title>Safety Cab Admin</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:15px;
}

.box{
background:white;
padding:15px;
border-radius:10px;
}

input,button{
width:100%;
padding:12px;
margin:6px 0;
box-sizing:border-box;
}

button{
background:green;
color:white;
border:0;
border-radius:6px;
}

.driver{
background:white;
padding:15px;
margin-top:10px;
border-radius:10px;
}

</style>

</head>

<body>

<h2>🚕 Safety Cab Admin Panel</h2>

<div class="box">

<input
id="driverId"
placeholder="Driver ID">

<input
id="driverName"
placeholder="Driver Name">

<input
id="vehicle"
placeholder="Vehicle Number">

<button onclick="getGPS()">
📍 Get GPS
</button>

<p id="gps">
GPS Waiting...
</p>

<button onclick="addDriver()">
➕ Add Driver
</button>

</div>


<h3>Driver List</h3>

<div id="list">
No Driver Added
</div>


<script>

let drivers = [];

let lat = "";
let lng = "";


function getGPS(){

navigator.geolocation.getCurrentPosition(

function(position){

lat =
position.coords.latitude;

lng =
position.coords.longitude;

document.getElementById("gps").innerHTML =
"Latitude: " + lat +
"<br>Longitude: " + lng;

},

function(){

alert("GPS Permission Allow करें");

}

);

}


function addDriver(){

let id =
document.getElementById("driverId").value;

let name =
document.getElementById("driverName").value;

let vehicle =
document.getElementById("vehicle").value;


if(id === "" ||
name === "" ||
vehicle === ""){

alert("तीनों जानकारी भरें");

return;

}


let driver = {

id:id,

name:name,

vehicle:vehicle,

latitude:lat,

longitude:lng,

status:"Online",

time:new Date().toLocaleString()

};


drivers.push(driver);


showDrivers();


}


function showDrivers(){

let html = "";


drivers.forEach(function(d){

html += `

<div class="driver">

<b>Driver ID:</b>
${d.id}

<br>

<b>Name:</b>
${d.name}

<br>

<b>Vehicle:</b>
${d.vehicle}

<br>

<b>Location:</b>
${d.latitude},
${d.longitude}

<br>

<b>Status:</b>
🟢 ${d.status}

<br>

<b>Last Update:</b>
${d.time}

</div>

`;

});


document.getElementById("list").innerHTML =
html;

}

</script>

</body>
</html>
