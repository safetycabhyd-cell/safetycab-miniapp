
<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<title>Safety Cab Admin Panel</title>

<meta
name="viewport"
content="width=device-width, initial-scale=1"
>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;

background:#f2f2f2;

margin:0;

padding:15px;

}

h2{

font-size:28px;

margin:10px 0 20px;

}

h3{

margin-top:5px;

}

.box{

background:white;

padding:15px;

border-radius:12px;

margin-bottom:15px;

}

input{

width:100%;

box-sizing:border-box;

padding:12px;

margin:6px 0;

border:1px solid #ccc;

border-radius:6px;

font-size:15px;

}

button{

width:100%;

padding:12px;

margin:6px 0;

border:0;

border-radius:6px;

font-size:16px;

color:white;

background:#168a3a;

cursor:pointer;

}

button:active{

opacity:.8;

}

.stop,
.dutyOff,
.delete{

background:#d32f2f;

}

.searchBtn{

background:#1769aa;

}

.pickupBtn{

background:#168a3a;

}

.dropBtn{

background:#d66a00;

}

.driver{

background:white;

padding:15px;

margin:10px 0;

border-radius:10px;

border-left:5px solid #168a3a;

}

.online{

color:green;

font-weight:bold;

}

.offline{

color:red;

font-weight:bold;

}

.dutyOn{

color:#168a3a;

font-weight:bold;

}

.dutyOffText{

color:#d32f2f;

font-weight:bold;

}

.gps-indicator{

display:inline-block;

padding:6px 10px;

border-radius:20px;

font-weight:bold;

font-size:14px;

margin-top:5px;

}

.gps-green{

background:#d9f7df;

color:#168a3a;

}

.gps-red{

background:#ffe0e0;

color:#d32f2f;

}

.gps-yellow{

background:#fff4c2;

color:#9a7300;

}

.stars{

font-size:28px;

letter-spacing:3px;

margin:8px 0;

}

.star{

cursor:pointer;

color:#ccc;

}

.star.active{

color:#f5b400;

}

.car-icon{

width:32px;

height:32px;

display:flex;

align-items:center;

justify-content:center;

border-radius:50%;

font-size:23px;

background:white;

box-shadow:0 2px 6px rgba(0,0,0,.45);

border:3px solid #168a3a;

}

.car-offline{

border-color:#d32f2f;

filter:grayscale(1);

opacity:.75;

}

.car-online{

border-color:#168a3a;

}

.car-updating{

border-color:#e0a800;

}

.pickup-marker{

font-size:30px;

filter:drop-shadow(1px 2px 2px #555);

}

.drop-marker{

font-size:30px;

filter:drop-shadow(1px 2px 2px #555);

}

#map{

height:400px;

width:100%;

border-radius:10px;

margin-bottom:20px;

}

#mapSection{

display:block;

}

.search-result{

background:#f8f8f8;

border:1px solid #ddd;

padding:10px;

margin:5px 0;

border-radius:7px;

cursor:pointer;

}

.search-result:hover{

background:#eaf4ff;

}

.small{

font-size:13px;

color:#666;

}

</style>

</head>


<body>


<h2>🚕 Safety Cab Admin Panel</h2>


<!-- =====================================================
     DRIVER REGISTRATION
===================================================== -->

<div class="box">

<h3>👨‍✈️ Driver Registration</h3>


<input
id="driverId"
placeholder="Driver ID"
>


<input
id="driverName"
placeholder="Driver Name"
>


<input
id="phone"
placeholder="Phone Number"
inputmode="numeric"
>


<input
id="vehicle"
placeholder="Vehicle Number"
>


<button onclick="startLiveGPS()">

📍 START LIVE GPS

</button>


<button
class="stop"
onclick="stopLiveGPS()"
>

⛔ STOP GPS

</button>


<p>

<b>GPS Status:</b>

<span
id="gpsStatus"
class="offline"
>

🔴 GPS OFFLINE

</span>

</p>


<div
id="gpsIndicator"
class="gps-indicator gps-red"
>

🔴 GPS OFFLINE

</div>


<p id="location">

Latitude: -

<br>

Longitude: -

</p>


<button onclick="saveDriver()">

💾 SAVE DRIVER

</button>


</div>



<!-- =====================================================
     SEARCH DRIVER
===================================================== -->

<div class="box">

<h3>🔎 Search Driver</h3>


<input
id="search"
placeholder="Name / ID / Vehicle"
oninput="showDrivers()"
>

</div>



<!-- =====================================================
     PICKUP / DROP
===================================================== -->

<div class="box">

<h3>📍 Pickup & Drop</h3>


<label>

<b>📍 Pickup Location</b>

</label>


<input
id="pickupSearch"
placeholder="Pickup location search करें"
>


<button
class="pickupBtn"
onclick="searchPickup()"
>

🔎 SEARCH PICKUP

</button>


<div id="pickupResults"></div>


<br>


<label>

<b>🏁 Drop Location</b>

</label>


<input
id="dropSearch"
placeholder="Drop location search करें"
>


<button
class="dropBtn"
onclick="searchDrop()"
>

🔎 SEARCH DROP

</button>


<div id="dropResults"></div>


<p
id="routeStatus"
class="small"
>

Pickup और Drop select करने के बाद Map पर दिखाई देंगे।

</p>

</div>



<!-- =====================================================
     DRIVER LIST
===================================================== -->

<h3>👨‍✈️ Driver List</h3>


<div id="list">

Loading...

</div>



<!-- =====================================================
     DRIVER MAP
===================================================== -->

<div id="mapSection">

<h3>🗺️ Driver Map</h3>

<div id="map"></div>

</div>



<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>



<script>

/* =====================================================
   STORAGE KEYS
===================================================== */

const DRIVER_STORAGE_KEY =
"safetycab_final_drivers";

const FORM_STORAGE_KEY =
"safetycab_driver_form";



/* =====================================================
   DRIVERS
===================================================== */

let drivers = [];


try{

drivers =
JSON.parse(
localStorage.getItem(
DRIVER_STORAGE_KEY
)
) || [];

}catch(error){

drivers = [];

}



/* =====================================================
   GPS VARIABLES
===================================================== */

let watchId = null;

let currentLat = "";

let currentLng = "";



/* =====================================================
   MAP VARIABLES
===================================================== */

let markers = [];

let pickupMarker = null;

let dropMarker = null;

let pickupLocation = null;

let dropLocation = null;



/* =====================================================
   OLD DATA FIX
===================================================== */

drivers.forEach(function(d){

if(typeof d.online === "undefined"){

d.online = false;

}

if(typeof d.duty === "undefined"){

d.duty = false;

}

if(typeof d.rating === "undefined"){

d.rating = 0;

}

if(typeof d.lastUpdate === "undefined"){

d.lastUpdate = "-";

}

if(typeof d.phone === "undefined"){

d.phone = "";

}

if(typeof d.vehicle === "undefined"){

d.vehicle = "";

}

});



/* =====================================================
   SAVE DRIVERS
===================================================== */

function saveData(){

localStorage.setItem(

DRIVER_STORAGE_KEY,

JSON.stringify(drivers)

);

}



/* =====================================================
   FORM DRAFT SAVE
===================================================== */

function saveFormDraft(){

const formData = {

driverId:
document.getElementById(
"driverId"
).value,

driverName:
document.getElementById(
"driverName"
).value,

phone:
document.getElementById(
"phone"
).value,

vehicle:
document.getElementById(
"vehicle"
).value

};


localStorage.setItem(

FORM_STORAGE_KEY,

JSON.stringify(formData)

);

}



/* =====================================================
   FORM DRAFT RESTORE
===================================================== */

function restoreFormDraft(){

try{

const saved =
JSON.parse(
localStorage.getItem(
FORM_STORAGE_KEY
)
);


if(!saved){

return;

}


document.getElementById(
"driverId"
).value =
saved.driverId || "";


document.getElementById(
"driverName"
).value =
saved.driverName || "";


document.getElementById(
"phone"
).value =
saved.phone || "";


document.getElementById(
"vehicle"
).value =
saved.vehicle || "";


}catch(error){

console.log(
"Form restore error:",
error
);

}

}



/* =====================================================
   AUTO SAVE FORM WHILE TYPING
===================================================== */

[
"driverId",
"driverName",
"phone",
"vehicle"
]
.forEach(function(id){

document.getElementById(id)
.addEventListener(
"input",
function(){

saveFormDraft();

}
);

});



/* =====================================================
   MAP
===================================================== */

let map =
L.map("map").setView(

[17.2872833,78.4662117],

13

);


L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19,

attribution:
"© OpenStreetMap contributors"

}

).addTo(map);



/* =====================================================
   CAR ICON
===================================================== */

function createCarIcon(driver){

let carClass =
"car-icon ";


if(driver.online){

carClass +=
"car-online";

}else{

carClass +=
"car-offline";

}


return L.divIcon({

className:"",

html:

`
<div class="${carClass}">
🚕
</div>
`,

iconSize:[38,38],

iconAnchor:[19,19],

popupAnchor:[0,-20]

});

}



/* =====================================================
   GPS INDICATOR
===================================================== */

function setGPSIndicator(status){

let indicator =
document.getElementById(
"gpsIndicator"
);

let gpsStatus =
document.getElementById(
"gpsStatus"
);


if(status === "online"){

gpsStatus.innerHTML =
"🟢 GPS ONLINE";

gpsStatus.className =
"online";


indicator.innerHTML =
"🟢 GPS ONLINE";

indicator.className =
"gps-indicator gps-green";

}

else if(status === "updating"){

gpsStatus.innerHTML =
"🟡 GPS UPDATING";

gpsStatus.className =
"";


indicator.innerHTML =
"🟡 GPS UPDATING";

indicator.className =
"gps-indicator gps-yellow";

}

else{

gpsStatus.innerHTML =
"🔴 GPS OFFLINE";

gpsStatus.className =
"offline";


indicator.innerHTML =
"🔴 GPS OFFLINE";

indicator.className =
"gps-indicator gps-red";

}

}



/* =====================================================
   START LIVE GPS
===================================================== */

function startLiveGPS(){

if(!navigator.geolocation){

alert(
"इस Browser में GPS उपलब्ध नहीं है"
);

return;

}


setGPSIndicator(
"updating"
);


if(watchId !== null){

navigator.geolocation.clearWatch(
watchId
);

}


watchId =
navigator.geolocation.watchPosition(

function(position){

currentLat =
position.coords.latitude;

currentLng =
position.coords.longitude;


setGPSIndicator(
"online"
);


document.getElementById(
"location"
).innerHTML =

"Latitude: " +
currentLat +

"<br>Longitude: " +
currentLng;


let id =
document.getElementById(
"driverId"
).value.trim();


let driver =
drivers.find(
d => d.id === id
);


if(driver){

driver.latitude =
currentLat;

driver.longitude =
currentLng;

driver.online =
true;

driver.lastUpdate =
new Date().toLocaleString();


saveData();

showDrivers();

showMap();

}

},

function(error){

setGPSIndicator(
"offline"
);


if(error.code === 1){

alert(
"Location Permission Allow करें"
);

}

else if(error.code === 2){

alert(
"GPS Location उपलब्ध नहीं है"
);

}

else if(error.code === 3){

alert(
"GPS Timeout हुआ"
);

}

},

{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}



/* =====================================================
   STOP GPS
===================================================== */

function stopLiveGPS(){

if(watchId !== null){

navigator.geolocation.clearWatch(
watchId
);

watchId = null;

}


setGPSIndicator(
"offline"
);


let id =
document.getElementById(
"driverId"
).value.trim();


let driver =
drivers.find(
d => d.id === id
);


if(driver){

driver.online =
false;

driver.lastUpdate =
new Date().toLocaleString();


saveData();

showDrivers();

showMap();

}

}



/* =====================================================
   SAVE DRIVER
===================================================== */

function saveDriver(){

let id =
document.getElementById(
"driverId"
).value.trim();


let name =
document.getElementById(
"driverName"
).value.trim();


let phone =
document.getElementById(
"phone"
).value.trim();


let vehicle =
document.getElementById(
"vehicle"
).value.trim();



if(id === ""){

alert(
"Driver ID डालिए"
);

return;

}


if(name === ""){

alert(
"Driver Name डालिए"
);

return;

}


if(phone === ""){

alert(
"Phone Number डालिए"
);

return;

}


if(vehicle === ""){

alert(
"Vehicle Number डालिए"
);

return;

}



/* पुराने Driver की location */

let driver =
drivers.find(
d => d.id === id
);


if(
currentLat === "" ||
currentLng === ""
){

if(
driver &&
driver.latitude !== undefined &&
driver.longitude !== undefined &&
driver.latitude !== "" &&
driver.longitude !== ""
){

currentLat =
driver.latitude;

currentLng =
driver.longitude;

}else{

alert(
"पहले START LIVE GPS दबाइए"
);

return;

}

}



/* Existing Driver */

if(driver){

driver.name =
name;

driver.phone =
phone;

driver.vehicle =
vehicle;

driver.latitude =
currentLat;

driver.longitude =
currentLng;

driver.online =
true;

driver.lastUpdate =
new Date().toLocaleString();

}


/* New Driver */

else{

drivers.push({

id:id,

name:name,

phone:phone,

vehicle:vehicle,

latitude:currentLat,

longitude:currentLng,

online:true,

duty:false,

rating:0,

lastUpdate:
new Date().toLocaleString()

});

}


saveData();

saveFormDraft();

showDrivers();

showMap();


alert(
"✅ Driver Saved"
);

}



/* =====================================================
   DUTY ON
===================================================== */

function dutyOn(index){

if(!drivers[index]){

return;

}


drivers[index].duty =
true;


saveData();

showDrivers();

showMap();

}



/* =====================================================
   DUTY OFF
===================================================== */

function dutyOff(index){

if(!drivers[index]){

return;

}


drivers[index].duty =
false;


saveData();

showDrivers();

showMap();

}



/* =====================================================
   RATING
===================================================== */

function setRating(index,rating){

if(!drivers[index]){

return;

}


drivers[index].rating =
rating;


saveData();

showDrivers();

showMap();

}



/* =====================================================
   STAR DISPLAY
===================================================== */

function getStars(index,rating){

let html = "";


for(
let i=1;
i<=5;
i++
){

html +=

`

<span
class="star ${
i <= rating
? "active"
: ""
}"
onclick="setRating(${index},${i})"
>

★

</span>

`;

}


return html;

}



/* =====================================================
   GPS STATUS DISPLAY
===================================================== */

function getGPSIndicator(d){

if(d.online){

return `

<span
class="gps-indicator gps-green"
>

🟢 GPS ONLINE

</span>

`;

}


return `

<span
class="gps-indicator gps-red"
>

🔴 GPS OFFLINE

</span>

`;

}



/* =====================================================
   DRIVER LIST
===================================================== */

function showDrivers(){

let search =
document.getElementById(
"search"
).value
.toLowerCase()
.trim();


let result =
drivers.filter(
function(d){

return (

String(d.id)
.toLowerCase()
.includes(search)

||

String(d.name)
.toLowerCase()
.includes(search)

||

String(d.phone)
.toLowerCase()
.includes(search)

||

String(d.vehicle)
.toLowerCase()
.includes(search)

);

});


let html = "";


if(result.length === 0){

html = `

<div class="box">

❌ कोई Driver नहीं मिला।

<br><br>

Total Drivers:
${drivers.length}

</div>

`;

}



result.forEach(
function(d){

let index =
drivers.indexOf(d);


html += `

<div class="driver">

<b>Driver ID:</b>

${d.id}

<br><br>


<b>Name:</b>

${d.name}

<br><br>


<b>Phone:</b>

${d.phone || "-"}

<br><br>


<b>Vehicle:</b>

${d.vehicle || "-"}

<br><br>


<b>GPS Status:</b>

<br>

${getGPSIndicator(d)}

<br><br>


<b>Duty Status:</b>

<span class="${
d.duty
? "dutyOn"
: "dutyOffText"
}">

${
d.duty
? "🟢 Duty ON"
: "🔴 Duty OFF"
}

</span>

<br><br>


<b>⭐ Driver Rating:</b>

<div class="stars">

${getStars(
index,
d.rating || 0
)}

</div>


<div>

${
d.rating
? d.rating + " / 5"
: "Not Rated"
}

</div>

<br>


<b>Location:</b>

${d.latitude || "-"},
${d.longitude || "-"}

<br><br>


<b>Last GPS Update:</b>

${d.lastUpdate || "-"}


<button
onclick="dutyOn(${index})"
>

🟢 DUTY ON

</button>


<button
class="dutyOff"
onclick="dutyOff(${index})"
>

🔴 DUTY OFF

</button>


<button
class="delete"
onclick="deleteDriver(${index})"
>

🗑️ DELETE DRIVER

</button>


</div>

`;

});


document.getElementById(
"list"
).innerHTML =
html;

}



/* =====================================================
   DELETE DRIVER
===================================================== */

function deleteDriver(index){

if(!drivers[index]){

return;

}


let ok =
confirm(

"क्या " +
drivers[index].name +
" को Delete करना है?"

);


if(!ok){

return;

}


let deletedId =
drivers[index].id;


drivers.splice(
index,
1
);


saveData();


/* अगर यही Driver form में है */

if(
document.getElementById(
"driverId"
).value.trim()
=== deletedId
){

document.getElementById(
"driverId"
).value = "";

document.getElementById(
"driverName"
).value = "";

document.getElementById(
"phone"
).value = "";

document.getElementById(
"vehicle"
).value = "";

saveFormDraft();

}


showDrivers();

showMap();

}



/* =====================================================
   SHOW DRIVER MAP
===================================================== */

function showMap(){

markers.forEach(
function(marker){

map.removeLayer(marker);

}
);


markers = [];


drivers.forEach(
function(d){

let lat =
Number(d.latitude);

let lng =
Number(d.longitude);


if(
!isNaN(lat) &&
!isNaN(lng)
){

let marker =
L.marker(

[lat,lng],

{

icon:
createCarIcon(d)

}

).addTo(map);


marker.bindPopup(`

<b>🚕 Driver:</b>

${d.name}

<br><br>

<b>Driver ID:</b>

${d.id}

<br><br>

<b>Phone:</b>

${d.phone || "-"}

<br><br>

<b>Vehicle:</b>

${d.vehicle}

<br><br>

<b>GPS:</b>

${
d.online
? "🟢 Online"
: "🔴 Offline"
}

<br><br>

<b>Duty:</b>

${
d.duty
? "🟢 ON"
: "🔴 OFF"
}

<br><br>

<b>Rating:</b>

⭐ ${d.rating || 0} / 5

<br><br>

<b>Location:</b>

${lat}, ${lng}

`);


markers.push(marker);

}

});


if(markers.length > 0){

let group =
L.featureGroup(markers);


map.fitBounds(

group.getBounds(),

{

padding:[30,30]

}

);

}

}



/* =====================================================
   AUTOMATIC MAP OPEN
===================================================== */

function openMapAutomatically(){

setTimeout(
function(){

document.getElementById(
"mapSection"
).scrollIntoView({

behavior:"smooth",

block:"start"

});


setTimeout(
function(){

map.invalidateSize();

},
500
);

},
200
);

}



/* =====================================================
   PICKUP ICON
===================================================== */

function createPickupIcon(){

return L.divIcon({

className:"",

html:

`

<div class="pickup-marker">

📍

</div>

`,

iconSize:[35,35],

iconAnchor:[17,35]

});

}



/* =====================================================
   DROP ICON
===================================================== */

function createDropIcon(){

return L.divIcon({

className:"",

html:

`

<div class="drop-marker">

🏁

</div>

`,

iconSize:[35,35],

iconAnchor:[17,35]

});

}



/* =====================================================
   SEARCH LOCATION
===================================================== */

async function searchLocation(query){

if(!query){

alert(
"Location का नाम डालिए"
);

return [];

}


try{

let url =

"https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=in&q="

+

encodeURIComponent(query);


let response =
await fetch(

url,

{

headers:{

"Accept":
"application/json"

}

}

);


let data =
await response.json();


return data;


}catch(error){

alert(
"Location Search नहीं हो पाया। Internet Check करें।"
);

return [];

}

}



/* =====================================================
   SHOW SEARCH RESULTS
===================================================== */

function showSearchResults(
data,
containerId,
type
){

let container =
document.getElementById(
containerId
);


container.innerHTML = "";


if(data.length === 0){

container.innerHTML =

"<p>❌ Location नहीं मिली।</p>";

return;

}


data.forEach(
function(item){

let div =
document.createElement(
"div"
);


div.className =
"search-result";


div.innerHTML =

"📍 " +
item.display_name;


div.onclick =
function(){

selectLocation(
item,
type
);

};


container.appendChild(
div
);

});

}



/* =====================================================
   SEARCH PICKUP
===================================================== */

async function searchPickup(){

let query =
document.getElementById(
"pickupSearch"
).value.trim();


if(!query){

alert(
"Pickup Location डालिए"
);

return;

}


let data =
await searchLocation(
query
);


showSearchResults(

data,

"pickupResults",

"pickup"

);

}



/* =====================================================
   SEARCH DROP
===================================================== */

async function searchDrop(){

let query =
document.getElementById(
"dropSearch"
).value.trim();


if(!query){

alert(
"Drop Location डालिए"
);

return;

}


let data =
await searchLocation(
query
);


showSearchResults(

data,

"dropResults",

"drop"

);

}



/* =====================================================
   SELECT LOCATION
===================================================== */

function selectLocation(
item,
type
){

let lat =
Number(item.lat);

let lng =
Number(item.lon);



if(type === "pickup"){

pickupLocation = {

lat:lat,

lng:lng,

name:
item.display_name

};


if(pickupMarker){

map.removeLayer(
pickupMarker
);

}


pickupMarker =
L.marker(

[lat,lng],

{

icon:
createPickupIcon()

}

).addTo(map);


pickupMarker.bindPopup(

"<b>📍 PICKUP</b><br>" +

item.display_name

).openPopup();


document.getElementById(
"pickupSearch"
).value =
item.display_name;


document.getElementById(
"pickupResults"
).innerHTML =
"";


openMapAutomatically();


map.setView(

[lat,lng],

15

);

}



if(type === "drop"){

dropLocation = {

lat:lat,

lng:lng,

name:
item.display_name

};


if(dropMarker){

map.removeLayer(
dropMarker
);

}


dropMarker =
L.marker(

[lat,lng],

{

icon:
createDropIcon()

}

).addTo(map);


dropMarker.bindPopup(

"<b>🏁 DROP</b><br>" +

item.display_name

).openPopup();


document.getElementById(
"dropSearch"
).value =
item.display_name;


document.getElementById(
"dropResults"
).innerHTML =
"";


openMapAutomatically();


map.setView(

[lat,lng],

15

);

}


fitAllLocations();

updateRouteStatus();

}



/* =====================================================
   FIT ALL LOCATIONS
===================================================== */

function fitAllLocations(){

let points = [];


drivers.forEach(
function(d){

let lat =
Number(d.latitude);

let lng =
Number(d.longitude);


if(
!isNaN(lat) &&
!isNaN(lng)
){

points.push(

[lat,lng]

);

}

});


if(pickupLocation){

points.push([

pickupLocation.lat,

pickupLocation.lng

]);

}


if(dropLocation){

points.push([

dropLocation.lat,

dropLocation.lng

]);

}


if(points.length > 0){

let bounds =
L.latLngBounds(
points
);


map.fitBounds(

bounds,

{

padding:[40,40]

}

);

}

}



/* =====================================================
   ROUTE STATUS
===================================================== */

function updateRouteStatus(){

let status =
document.getElementById(
"routeStatus"
);


if(
pickupLocation &&
dropLocation
){

status.innerHTML =

"📍 Pickup + 🏁 Drop दोनों Map पर हैं।";

}

else if(pickupLocation){

status.innerHTML =

"📍 Pickup selected है। अब Drop Location चुनिए।";

}

else if(dropLocation){

status.innerHTML =

"🏁 Drop selected है। अब Pickup Location चुनिए।";

}

else{

status.innerHTML =

"Pickup और Drop select करने के बाद Map पर दिखाई देंगे।";

}

}



/* =====================================================
   MAP CLICK
===================================================== */

map.on(
"click",
function(e){

let lat =
e.latlng.lat.toFixed(7);

let lng =
e.latlng.lng.toFixed(7);


L.popup()

.setLatLng(
e.latlng
)

.setContent(

"📍 Location<br>" +

lat +

", " +

lng

)

.openOn(map);

});



/* =====================================================
   RESTORE SAVED DRIVER FORM
===================================================== */

restoreFormDraft();



/* =====================================================
   IF SAVED DRIVER EXISTS,
   RESTORE ITS LAST LOCATION
===================================================== */

function restoreCurrentDriverLocation(){

let id =
document.getElementById(
"driverId"
).value.trim();


if(!id){

return;

}


let driver =
drivers.find(
d => d.id === id
);


if(!driver){

return;

}


if(
driver.latitude !== undefined &&
driver.longitude !== undefined
){

currentLat =
driver.latitude;

currentLng =
driver.longitude;


document.getElementById(
"location"
).innerHTML =

"Latitude: " +

currentLat +

"<br>Longitude: " +

currentLng;

}

}



/* =====================================================
   START PAGE
===================================================== */

showDrivers();

showMap();

updateRouteStatus();

restoreCurrentDriverLocation();



/* =====================================================
   MAP REFRESH
===================================================== */

setInterval(
function(){

showMap();

},
5000
);

</script>

</body>

</html>
