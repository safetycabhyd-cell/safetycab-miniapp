<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<title>Safety Cab Admin</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial,sans-serif;
background:#f2f2f2;
margin:0;
padding:15px;
}

h2{
margin-top:5px;
}

.box{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

input{
width:100%;
box-sizing:border-box;
padding:12px;
margin:6px 0;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
}

button{
width:100%;
box-sizing:border-box;
padding:12px;
margin:6px 0;
border:0;
border-radius:6px;
background:#168a3a;
color:white;
font-size:16px;
}

.stop{
background:#d32f2f;
}

.driver{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
border-left:5px solid #168a3a;
}

.delete{
background:#d32f2f;
}

.online{
color:green;
font-weight:bold;
}

#message{
font-weight:bold;
}

</style>

</head>

<body>


<h2>🚕 Safety Cab Admin Panel</h2>


<div class="box">

<h3>➕ Add Driver</h3>


<input
id="driverId"
placeholder="Driver ID">


<input
id="driverName"
placeholder="Driver Name">


<input
id="phone"
placeholder="Phone Number">


<input
id="vehicle"
placeholder="Vehicle Number">


<button onclick="getGPS()">

📍 Get GPS Location

</button>


<p id="gps">
GPS Waiting...
</p>


<button onclick="saveDriver()">

💾 Save Driver

</button>


<p id="message"></p>

</div>



<div class="box">

<h3>🔎 Search Driver</h3>


<input
id="search"
placeholder="Name / ID / Vehicle"
oninput="showDrivers()">

</div>



<h3>👨‍✈️ Driver List</h3>


<div id="list">
Loading...
</div>



<script>

/* =========================
   LOAD DATA
========================= */

let drivers = [];

try{

drivers =
JSON.parse(
localStorage.getItem(
"safetycab_final_drivers"
)
) || [];

}catch(error){

drivers = [];

}


let latitude = "";

let longitude = "";


/* =========================
   GPS
========================= */

function getGPS(){

if(!navigator.geolocation){

alert(
"इस Browser में GPS उपलब्ध नहीं है"
);

return;

}


navigator.geolocation.getCurrentPosition(

function(position){

latitude =
position.coords.latitude;

longitude =
position.coords.longitude;


document.getElementById("gps")
.innerHTML =

"🟢 GPS Ready" +

"<br>Latitude: " +
latitude +

"<br>Longitude: " +
longitude;

},

function(){

alert(
"GPS Permission Allow करें"
);

},

{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}


/* =========================
   SAVE DRIVER
========================= */

function saveDriver(){

let id =
document.getElementById(
"driverId"
).value.trim();


let name =
document.getElementById(
"driverName"
).value.trim();


let phone =
document.getElementById(
"phone"
).value.trim();


let vehicle =
document.getElementById(
"vehicle"
).value.trim();


if(id === ""){

alert("Driver ID डालिए");

return;

}


if(name === ""){

alert("Driver Name डालिए");

return;

}


if(vehicle === ""){

alert("Vehicle Number डालिए");

return;

}


if(
latitude === "" ||
longitude === ""
){

alert(
"पहले Get GPS Location दबाइए"
);

return;

}


/* Check existing driver */

let existing =
drivers.find(
d => d.id === id
);


if(existing){

existing.name =
name;

existing.phone =
phone;

existing.vehicle =
vehicle;

existing.latitude =
latitude;

existing.longitude =
longitude;

existing.status =
"Online";

existing.time =
new Date().toLocaleString();

}

else{

drivers.push({

id:id,

name:name,

phone:phone,

vehicle:vehicle,

latitude:latitude,

longitude:longitude,

status:"Online",

time:new Date().toLocaleString()

});

}


/* SAVE */

localStorage.setItem(

"safetycab_final_drivers",

JSON.stringify(drivers)

);


showDrivers();


document.getElementById(
"message"
).innerHTML =
"✅ Driver Saved Successfully";


/* Clear form */

document.getElementById(
"driverId"
).value = "";

document.getElementById(
"driverName"
).value = "";

document.getElementById(
"phone"
).value = "";

document.getElementById(
"vehicle"
).value = "";

}


/* =========================
   SHOW DRIVERS
========================= */

function showDrivers(){

let search =
document.getElementById(
"search"
).value
.toLowerCase()
.trim();


let result =
drivers.filter(function(d){

return (

String(d.id)
.toLowerCase()
.includes(search)

||

String(d.name)
.toLowerCase()
.includes(search)

||

String(d.vehicle)
.toLowerCase()
.includes(search)

);

});


let html = "";


if(result.length === 0){

html = `

<div class="box">

❌ कोई Driver नहीं मिला।

<br><br>

Total Drivers:
${drivers.length}

</div>

`;

}


result.forEach(function(d){

let index =
drivers.indexOf(d);


html += `

<div class="driver">

<b>Driver ID:</b>
${d.id}

<br><br>

<b>Name:</b>
${d.name}

<br><br>

<b>Phone:</b>
${d.phone || "-"}

<br><br>

<b>Vehicle:</b>
${d.vehicle}

<br><br>

<b>Latitude:</b>
${d.latitude}

<br>

<b>Longitude:</b>
${d.longitude}

<br><br>

<b>Status:</b>

<span class="online">
🟢 ${d.status}
</span>

<br><br>

<b>Last Update:</b>
${d.time}


<button
class="delete"
onclick="deleteDriver(${index})">

🗑️ Delete This Driver

</button>

</div>

`;

});


document.getElementById(
"list"
).innerHTML = html;

}


/* =========================
   DELETE ONE DRIVER
========================= */

function deleteDriver(index){

if(!drivers[index]){

return;

}


let ok =
confirm(
"क्या " +
drivers[index].name +
" को Delete करना है?"
);


if(!ok){

return;

}


drivers.splice(index,1);


localStorage.setItem(

"safetycab_final_drivers",

JSON.stringify(drivers)

);


showDrivers();

}


/* =========================
   START
========================= */

showDrivers();

</script>

</body>
</html>
