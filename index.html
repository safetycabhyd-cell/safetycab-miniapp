<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<title>Safety Cab Live GPS</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:15px;
}

h2{
    margin-top:5px;
}

.box{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:6px 0;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

button{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:6px 0;
    border:0;
    border-radius:6px;
    background:#168a3a;
    color:white;
    font-size:16px;
}

.stop{
    background:#d32f2f;
}

.delete{
    background:#d32f2f;
}

.driver{
    background:white;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    border-left:5px solid #168a3a;
}

.online{
    color:green;
    font-weight:bold;
}

.offline{
    color:red;
    font-weight:bold;
}

.selectBox{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
}

.selectBox input{
    width:20px;
    height:20px;
}

</style>

</head>


<body>


<h2>🚕 Safety Cab Admin</h2>


<div class="box">

<h3>👨‍✈️ Driver Registration</h3>


<input
id="driverId"
placeholder="Driver ID">


<input
id="driverName"
placeholder="Driver Name">


<input
id="phone"
placeholder="Phone Number">


<input
id="vehicle"
placeholder="Vehicle Number">


<button onclick="startLiveGPS()">

📍 START LIVE GPS

</button>


<button
class="stop"
onclick="stopLiveGPS()">

⛔ STOP GPS

</button>


<p id="gpsStatus">

🔴 GPS OFF

</p>


<p id="location">

Latitude: -
<br>
Longitude: -

</p>


<button onclick="saveDriver()">

💾 SAVE DRIVER

</button>

</div>



<div class="box">

<h3>🔎 Search Driver</h3>

<input
id="search"
placeholder="Name / Driver ID / Vehicle"
oninput="showDrivers()">

</div>



<h3>👨‍✈️ Driver List</h3>


<div id="list">

Loading...

</div>



<script>


/* =========================
   LOAD DATA
========================= */

let drivers = [];

try{

drivers =
JSON.parse(
localStorage.getItem(
"safetycab_final_drivers"
)
) || [];

}catch(error){

drivers = [];

}


let watchId = null;

let currentLat = "";

let currentLng = "";


/* =========================
   START LIVE GPS
========================= */

function startLiveGPS(){

if(!navigator.geolocation){

alert(
"इस Browser में GPS उपलब्ध नहीं है"
);

return;

}


document.getElementById(
"gpsStatus"
).innerHTML =
"🟡 GPS Starting...";


watchId =
navigator.geolocation.watchPosition(

function(position){

currentLat =
position.coords.latitude;

currentLng =
position.coords.longitude;


document.getElementById(
"gpsStatus"
).innerHTML =
"🟢 GPS LIVE";


document.getElementById(
"location"
).innerHTML =

"Latitude: " +
currentLat +

"<br>Longitude: " +
currentLng +

"<br>Accuracy: " +
Math.round(
position.coords.accuracy
) +
" meters";


let id =
document.getElementById(
"driverId"
).value.trim();


if(id !== ""){

let driver =
drivers.find(
d => d.id === id
);


if(driver){

driver.latitude =
currentLat;

driver.longitude =
currentLng;

driver.status =
"Online";

driver.time =
new Date().toLocaleString();


saveData();

showDrivers();

}

}

},


function(error){

document.getElementById(
"gpsStatus"
).innerHTML =
"🔴 GPS ERROR";


if(error.code === 1){

alert(
"Location Permission Allow करें"
);

}

},


{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}


/* =========================
   STOP GPS
========================= */

function stopLiveGPS(){

if(watchId !== null){

navigator.geolocation.clearWatch(
watchId
);

watchId = null;

}


document.getElementById(
"gpsStatus"
).innerHTML =
"🔴 GPS OFF";


let id =
document.getElementById(
"driverId"
).value.trim();


let driver =
drivers.find(
d => d.id === id
);


if(driver){

driver.status =
"Offline";

driver.time =
new Date().toLocaleString();

saveData();

showDrivers();

}

}


/* =========================
   SAVE DRIVER
========================= */

function saveDriver(){

let id =
document.getElementById(
"driverId"
).value.trim();


let name =
document.getElementById(
"driverName"
).value.trim();


let phone =
document.getElementById(
"phone"
).value.trim();


let vehicle =
document.getElementById(
"vehicle"
).value.trim();


if(id === ""){

alert(
"Driver ID डालिए"
);

return;

}


if(name === ""){

alert(
"Driver Name डालिए"
);

return;

}


if(vehicle === ""){

alert(
"Vehicle Number डालिए"
);

return;

}


if(
currentLat === "" ||
currentLng === ""
){

alert(
"पहले START LIVE GPS दबाइए"
);

return;

}


let driver =
drivers.find(
d => d.id === id
);


if(driver){

driver.name =
name;

driver.phone =
phone;

driver.vehicle =
vehicle;

driver.latitude =
currentLat;

driver.longitude =
currentLng;

driver.status =
"Online";

driver.time =
new Date().toLocaleString();

}

else{

drivers.push({

id:id,

name:name,

phone:phone,

vehicle:vehicle,

latitude:currentLat,

longitude:currentLng,

status:"Online",

time:new Date().toLocaleString()

});

}


saveData();

showDrivers();


alert(
"✅ Driver Saved Successfully"
);

}


/* =========================
   SAVE DATA
========================= */

function saveData(){

localStorage.setItem(

"safetycab_final_drivers",

JSON.stringify(drivers)

);

}


/* =========================
   SHOW DRIVER LIST
========================= */

function showDrivers(){

let search =
document.getElementById(
"search"
).value
.toLowerCase()
.trim();


let result =
drivers.filter(function(d){

return (

String(d.id)
.toLowerCase()
.includes(search)

||

String(d.name)
.toLowerCase()
.includes(search)

||

String(d.phone)
.toLowerCase()
.includes(search)

||

String(d.vehicle)
.toLowerCase()
.includes(search)

);

});


let html = "";


if(result.length === 0){

html = `

<div class="box">

❌ कोई Driver नहीं मिला।

<br><br>

Total Drivers:
${drivers.length}

</div>

`;

}


result.forEach(function(d){

let index =
drivers.indexOf(d);


html += `

<div class="driver">


<div class="selectBox">

<input
type="checkbox"
id="select_${index}">

<label
for="select_${index}">

☑️ Select Driver

</label>

</div>


<b>Driver ID:</b>
${d.id}

<br><br>


<b>Name:</b>
${d.name}

<br><br>


<b>Phone:</b>
${d.phone || "-"}

<br><br>


<b>Vehicle:</b>
${d.vehicle}

<br><br>


<b>Latitude:</b>
${d.latitude}

<br>


<b>Longitude:</b>
${d.longitude}

<br><br>


<b>Status:</b>

<span class="${
d.status === "Online"
? "online"
: "offline"
}">

${
d.status === "Online"
? "🟢 Online"
: "🔴 Offline"
}

</span>

<br><br>


<b>Last Update:</b>
${d.time}


<button
class="delete"
onclick="deleteDriver(${index})">

🗑️ Delete This Driver

</button>


</div>

`;

});


document.getElementById(
"list"
).innerHTML = html;

}


/* =========================
   DELETE ONE DRIVER
========================= */

function deleteDriver(index){

if(!drivers[index]){

return;

}


let name =
drivers[index].name;


let ok =
confirm(
"क्या " +
name +
" को Delete करना है?"
);


if(!ok){

return;

}


drivers.splice(index,1);


saveData();


showDrivers();


alert(
"✅ Driver Delete हो गया"
);

}


/* =========================
   START
========================= */

showDrivers();

</script>


</body>

</html>
