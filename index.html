<!DOCTYPE html>
<html>
<head>
<title>Driver Mini App</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    font-family:Arial;
    background:#f2f2f2;
    padding:20px;
}

.box{
    background:white;
    padding:20px;
    border-radius:10px;
}

input,button{
    width:100%;
    padding:10px;
    margin:5px 0;
}

button{
    background:green;
    color:white;
    border:0;
}

.driver{
    background:white;
    padding:15px;
    margin-top:10px;
    border-radius:10px;
}
</style>

</head>

<body>

<h2>🚕 Driver Mini App</h2>

<div class="box">

<input id="driver_id" placeholder="Driver ID">

<input id="name" placeholder="Name">

<input id="phone" placeholder="Phone">

<input id="vehicle" placeholder="Vehicle Number">

<input id="lat" placeholder="Latitude">

<input id="lng" placeholder="Longitude">


<button onclick="addDriver()">
Add Driver
</button>

</div>


<h3>Driver List</h3>

<div id="list"></div>


<script>


let drivers = JSON.parse(localStorage.getItem("drivers")) || [];


function addDriver(){

let driver={

driver_id:driver_id.value,
name:name.value,
phone:phone.value,
vehicle_number:vehicle.value,
latitude:lat.value,
longitude:lng.value,
online_status:"Online",
last_update_time:new Date().toLocaleString()

};


drivers.push(driver);


localStorage.setItem(
"drivers",
JSON.stringify(drivers)
);


showDrivers();

}


function showDrivers(){

let html="";


drivers.forEach(d=>{

html += `

<div class="driver">

<b>ID:</b> ${d.driver_id}<br>

<b>Name:</b> ${d.name}<br>

<b>Phone:</b> ${d.phone}<br>

<b>Vehicle:</b> ${d.vehicle_number}<br>

<b>Location:</b> ${d.latitude}, ${d.longitude}<br>

<b>Status:</b> 🟢 ${d.online_status}<br>

<b>Update:</b> ${d.last_update_time}

</div>

`;

});


document.getElementById("list").innerHTML=html;

}


showDrivers();


</script>


</body>
</html>
