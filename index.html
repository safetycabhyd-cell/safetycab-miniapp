<!DOCTYPE html>
<html>
<head>

<title>Safety Cab - Live GPS</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:15px;
}

.box{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

input,button{
width:100%;
padding:12px;
margin:6px 0;
box-sizing:border-box;
}

button{
background:green;
color:white;
border:0;
border-radius:6px;
font-size:16px;
}

.stop{
background:#d32f2f;
}

.driver{
background:white;
padding:15px;
margin-top:10px;
border-radius:10px;
border-left:5px solid green;
}

.online{
color:green;
font-weight:bold;
}

</style>

</head>

<body>

<h2>🚕 Safety Cab - Live GPS</h2>


<div class="box">

<h3>Driver Details</h3>

<input
id="driverId"
placeholder="Driver ID">

<input
id="driverName"
placeholder="Driver Name">

<input
id="vehicle"
placeholder="Vehicle Number">


<button onclick="startGPS()">
📍 Start Live GPS
</button>


<button
class="stop"
onclick="stopGPS()">
⛔ Stop Live GPS
</button>


<p id="gps">
GPS Waiting...
</p>


<button onclick="addDriver()">
➕ Add / Save Driver
</button>


</div>


<h3>Driver List</h3>

<div id="list">
Loading...
</div>


<script>


/* =========================
   SAVED DATA
========================= */

let drivers =
JSON.parse(
localStorage.getItem("drivers")
) || [];


let watchId = null;

let currentLat = "";

let currentLng = "";


/* =========================
   START LIVE GPS
========================= */

function startGPS(){

if(!navigator.geolocation){

alert(
"इस Browser में GPS उपलब्ध नहीं है"
);

return;

}


watchId =
navigator.geolocation.watchPosition(

function(position){

currentLat =
position.coords.latitude;

currentLng =
position.coords.longitude;


document.getElementById("gps").innerHTML =

"🟢 Live GPS ON" +

"<br>Latitude: " +
currentLat +

"<br>Longitude: " +
currentLng;


updateDriverLocation();

},


function(error){

document.getElementById("gps").innerHTML =
"🔴 GPS Permission / Error";

},


{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);


}


/* =========================
   STOP GPS
========================= */

function stopGPS(){

if(watchId !== null){

navigator.geolocation.clearWatch(
watchId
);

watchId = null;

}


document.getElementById("gps").innerHTML =
"🔴 Live GPS OFF";

}


/* =========================
   ADD DRIVER
========================= */

function addDriver(){

let id =
document.getElementById("driverId")
.value.trim();

let name =
document.getElementById("driverName")
.value.trim();

let vehicle =
document.getElementById("vehicle")
.value.trim();


if(id === ""){

alert("Driver ID डालिए");

return;

}


if(name === ""){

alert("Driver Name डालिए");

return;

}


if(vehicle === ""){

alert("Vehicle Number डालिए");

return;

}


if(currentLat === "" ||
currentLng === ""){

alert(
"पहले Start Live GPS दबाइए"
);

return;

}


let existing =
drivers.find(
d => d.id === id
);


if(existing){

existing.name = name;

existing.vehicle = vehicle;

existing.latitude =
currentLat;

existing.longitude =
currentLng;

existing.status =
"Online";

existing.time =
new Date().toLocaleString();

}

else{

drivers.push({

id:id,

name:name,

vehicle:vehicle,

latitude:currentLat,

longitude:currentLng,

status:"Online",

time:new Date().toLocaleString()

});

}


saveData();

showDrivers();


alert(
"Driver Saved Successfully"
);

}


/* =========================
   UPDATE LOCATION
========================= */

function updateDriverLocation(){

let id =
document.getElementById("driverId")
.value.trim();


if(id === ""){

return;

}


let driver =
drivers.find(
d => d.id === id
);


if(!driver){

return;

}


driver.latitude =
currentLat;

driver.longitude =
currentLng;

driver.status =
"Online";

driver.time =
new Date().toLocaleString();


saveData();

showDrivers();

}


/* =========================
   SAVE DATA
========================= */

function saveData(){

localStorage.setItem(
"drivers",
JSON.stringify(drivers)
);

}


/* =========================
   SHOW DRIVERS
========================= */

function showDrivers(){

let html = "";


if(drivers.length === 0){

html =
"<p>कोई Driver नहीं है</p>";

}


drivers.forEach(function(d){

html += `

<div class="driver">

<b>Driver ID:</b>
${d.id}

<br>

<b>Name:</b>
${d.name}

<br>

<b>Vehicle:</b>
${d.vehicle}

<br>

<b>Latitude:</b>
${d.latitude}

<br>

<b>Longitude:</b>
${d.longitude}

<br>

<b>Status:</b>
<span class="online">
🟢 ${d.status}
</span>

<br>

<b>Last Update:</b>
${d.time}

</div>

`;

});


document.getElementById("list")
.innerHTML = html;

}


/* =========================
   START PAGE
========================= */

showDrivers();

</script>

</body>
</html>
