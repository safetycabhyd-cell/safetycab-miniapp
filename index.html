<!DOCTYPE html>
<html>
<head>

<title>Safety Cab Admin</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:15px;
}

.box{
background:white;
padding:15px;
border-radius:10px;
}

input,button{
width:100%;
padding:12px;
margin:6px 0;
box-sizing:border-box;
}

button{
background:green;
color:white;
border:0;
border-radius:6px;
}

.driver{
background:white;
padding:15px;
margin-top:10px;
border-radius:10px;
}

</style>

</head>

<body>

<h2>🚕 Safety Cab Admin Panel</h2>

<div class="box">

<input
id="driverId"
placeholder="Driver ID">

<input
id="driverName"
placeholder="Driver Name">

<input
id="vehicle"
placeholder="Vehicle Number">


<button onclick="getGPS()">
📍 Get GPS
</button>


<p id="gps">
GPS Waiting...
</p>


<button onclick="addDriver()">
➕ Add Driver
</button>


<button onclick="clearAll()">
🗑️ Delete All Drivers
</button>

</div>


<h3>Driver List</h3>

<div id="list">
Loading...
</div>


<script>

/* SAVED DATA LOAD */

let drivers =
JSON.parse(
localStorage.getItem("drivers")
) || [];


let lat = "";
let lng = "";



/* GPS */

function getGPS(){

navigator.geolocation.getCurrentPosition(

function(position){

lat =
position.coords.latitude;

lng =
position.coords.longitude;


document.getElementById("gps").innerHTML =

"Latitude: " + lat +
"<br>Longitude: " + lng;

},

function(){

alert(
"GPS Permission Allow करें"
);

}

);

}



/* ADD DRIVER */

function addDriver(){

let id =
document.getElementById("driverId")
.value.trim();

let name =
document.getElementById("driverName")
.value.trim();

let vehicle =
document.getElementById("vehicle")
.value.trim();


if(id === "" ||
name === "" ||
vehicle === ""){

alert(
"Driver ID, Name और Vehicle Number भरें"
);

return;

}


if(lat === "" || lng === ""){

alert(
"पहले Get GPS दबाएं"
);

return;

}


let driver = {

id:id,

name:name,

vehicle:vehicle,

latitude:lat,

longitude:lng,

status:"Online",

time:new Date().toLocaleString()

};


drivers.push(driver);


/* SAVE */

localStorage.setItem(
"drivers",
JSON.stringify(drivers)
);


/* SHOW */

showDrivers();


alert(
"Driver Successfully Saved"
);

}



/* SHOW DRIVERS */

function showDrivers(){

let html = "";


if(drivers.length === 0){

html =
"<p>कोई Driver नहीं है</p>";

}


drivers.forEach(function(d){

html += `

<div class="driver">

<b>Driver ID:</b>
${d.id}

<br>

<b>Name:</b>
${d.name}

<br>

<b>Vehicle:</b>
${d.vehicle}

<br>

<b>Latitude:</b>
${d.latitude}

<br>

<b>Longitude:</b>
${d.longitude}

<br>

<b>Status:</b>
🟢 ${d.status}

<br>

<b>Last Update:</b>
${d.time}

</div>

`;

});


document.getElementById("list")
.innerHTML = html;

}



/* DELETE ALL */

function clearAll(){

if(
confirm(
"क्या सभी Driver Delete करना है?"
)
){

drivers = [];

localStorage.removeItem(
"drivers"
);

showDrivers();

}

}



/* PAGE START */

showDrivers();

</script>

</body>
</html>
