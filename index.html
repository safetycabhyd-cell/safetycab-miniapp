<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<title>Safety Cab Live GPS</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial,sans-serif;
background:#f2f2f2;
margin:0;
padding:15px;
}

.box{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

input{
width:100%;
box-sizing:border-box;
padding:12px;
margin:6px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:12px;
margin:6px 0;
border:0;
border-radius:6px;
background:#168a3a;
color:white;
font-size:16px;
}

.stop{
background:#d32f2f;
}

.driver{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
border-left:5px solid #168a3a;
}

.online{
color:green;
font-weight:bold;
}

.offline{
color:red;
font-weight:bold;
}

</style>

</head>

<body>


<h2>🚕 Safety Cab Live GPS</h2>


<div class="box">

<h3>👨‍✈️ Driver Details</h3>


<input
id="driverId"
placeholder="Driver ID">


<input
id="driverName"
placeholder="Driver Name">


<input
id="phone"
placeholder="Phone Number">


<input
id="vehicle"
placeholder="Vehicle Number">


<button onclick="startLiveGPS()">

📍 START LIVE GPS

</button>


<button
class="stop"
onclick="stopLiveGPS()">

⛔ STOP GPS

</button>


<div id="gpsStatus">

🔴 GPS OFF

</div>


<p id="location">
Latitude: -
<br>
Longitude: -
</p>


<button onclick="saveDriver()">

💾 SAVE DRIVER

</button>

</div>



<h3>👨‍✈️ Driver List</h3>


<div id="list">
No Driver
</div>



<script>

/* =========================
   DATA
========================= */

let drivers =
JSON.parse(
localStorage.getItem(
"safetycab_final_drivers"
)
) || [];


let watchId = null;

let currentLat = "";

let currentLng = "";


/* =========================
   START LIVE GPS
========================= */

function startLiveGPS(){

if(!navigator.geolocation){

alert(
"इस Browser में GPS उपलब्ध नहीं है"
);

return;

}


document.getElementById(
"gpsStatus"
).innerHTML =
"🟡 GPS Starting...";


watchId =
navigator.geolocation.watchPosition(

function(position){

currentLat =
position.coords.latitude;

currentLng =
position.coords.longitude;


document.getElementById(
"gpsStatus"
).innerHTML =
"🟢 GPS LIVE";


document.getElementById(
"location"
).innerHTML =

"Latitude: " +
currentLat +

"<br>" +

"Longitude: " +
currentLng +

"<br>" +

"Accuracy: " +
Math.round(
position.coords.accuracy
) +
" meters";


/* Current Driver ID */

let id =
document.getElementById(
"driverId"
).value.trim();


if(id !== ""){

let driver =
drivers.find(
d => d.id === id
);


if(driver){

driver.latitude =
currentLat;

driver.longitude =
currentLng;

driver.status =
"Online";

driver.time =
new Date().toLocaleString();


saveData();

showDrivers();

}

}

},


function(error){

document.getElementById(
"gpsStatus"
).innerHTML =
"🔴 GPS ERROR";


if(error.code === 1){

alert(
"Location Permission Allow करें"
);

}

else if(error.code === 2){

alert(
"GPS Location उपलब्ध नहीं है"
);

}

else if(error.code === 3){

alert(
"GPS Timeout"
);

}

},


{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}


/* =========================
   STOP GPS
========================= */

function stopLiveGPS(){

if(watchId !== null){

navigator.geolocation.clearWatch(
watchId
);

watchId = null;

}


document.getElementById(
"gpsStatus"
).innerHTML =
"🔴 GPS OFF";


let id =
document.getElementById(
"driverId"
).value.trim();


let driver =
drivers.find(
d => d.id === id
);


if(driver){

driver.status =
"Offline";

driver.time =
new Date().toLocaleString();

saveData();

showDrivers();

}

}


/* =========================
   SAVE DRIVER
========================= */

function saveDriver(){

let id =
document.getElementById(
"driverId"
).value.trim();


let name =
document.getElementById(
"driverName"
).value.trim();


let phone =
document.getElementById(
"phone"
).value.trim();


let vehicle =
document.getElementById(
"vehicle"
).value.trim();


if(id === ""){

alert(
"Driver ID डालिए"
);

return;

}


if(name === ""){

alert(
"Driver Name डालिए"
);

return;

}


if(vehicle === ""){

alert(
"Vehicle Number डालिए"
);

return;

}


if(
currentLat === "" ||
currentLng === ""
){

alert(
"पहले START LIVE GPS दबाइए"
);

return;

}


let driver =
drivers.find(
d => d.id === id
);


if(driver){

driver.name =
name;

driver.phone =
phone;

driver.vehicle =
vehicle;

driver.latitude =
currentLat;

driver.longitude =
currentLng;

driver.status =
"Online";

driver.time =
new Date().toLocaleString();

}

else{

drivers.push({

id:id,

name:name,

phone:phone,

vehicle:vehicle,

latitude:currentLat,

longitude:currentLng,

status:"Online",

time:new Date().toLocaleString()

});

}


saveData();

showDrivers();


alert(
"✅ Driver Saved"
);

}


/* =========================
   SAVE DATA
========================= */

function saveData(){

localStorage.setItem(

"safetycab_final_drivers",

JSON.stringify(drivers)

);

}


/* =========================
   DRIVER LIST
========================= */

function showDrivers(){

if(drivers.length === 0){

document.getElementById(
"list"
).innerHTML =
"<div class='box'>❌ कोई Driver नहीं है</div>";

return;

}


let html = "";


drivers.forEach(function(d){

html += `

<div class="driver">

<b>Driver ID:</b>
${d.id}

<br><br>

<b>Name:</b>
${d.name}

<br><br>

<b>Phone:</b>
${d.phone || "-"}

<br><br>

<b>Vehicle:</b>
${d.vehicle}

<br><br>

<b>Latitude:</b>
${d.latitude}

<br>

<b>Longitude:</b>
${d.longitude}

<br><br>

<b>Status:</b>

<span class="${
d.status === "Online"
? "online"
: "offline"
}">

${
d.status === "Online"
? "🟢 Online"
: "🔴 Offline"
}

</span>

<br><br>

<b>Last Update:</b>
${d.time}

</div>

`;

});


document.getElementById(
"list"
).innerHTML = html;

}


/* =========================
   START
========================= */

showDrivers();

</script>

</body>
</html>
