<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<title>Safety Cab Live GPS</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f2f2f2;
margin:0;
padding:15px;
}

.box{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

input{
width:100%;
box-sizing:border-box;
padding:12px;
margin:6px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:12px;
margin:6px 0;
border:0;
border-radius:6px;
background:#168a3a;
color:white;
font-size:16px;
}

.stop,.delete{
background:#d32f2f;
}

.driver{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
border-left:5px solid #168a3a;
}

.online{
color:green;
font-weight:bold;
}

.offline{
color:red;
font-weight:bold;
}

#map{
height:400px;
width:100%;
border-radius:10px;
margin-bottom:20px;
}

</style>

</head>

<body>

<h2>🚕 Safety Cab Admin</h2>

<div class="box">

<h3>👨‍✈️ Driver Registration</h3>

<input
id="driverId"
placeholder="Driver ID">

<input
id="driverName"
placeholder="Driver Name">

<input
id="phone"
placeholder="Phone Number">

<input
id="vehicle"
placeholder="Vehicle Number">

<button onclick="startLiveGPS()">
📍 START LIVE GPS
</button>

<button
class="stop"
onclick="stopLiveGPS()">
⛔ STOP GPS
</button>

<p id="gpsStatus">
🔴 GPS OFF
</p>

<p id="location">
Latitude: -
<br>
Longitude: -
</p>

<button onclick="saveDriver()">
💾 SAVE DRIVER
</button>

</div>


<div class="box">

<h3>🔎 Search Driver</h3>

<input
id="search"
placeholder="Name / Driver ID / Vehicle"
oninput="showDrivers()">

</div>


<h3>👨‍✈️ Driver List</h3>

<div id="list">
Loading...
</div>


<h3>🗺️ Driver Map</h3>

<div id="map"></div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =========================
   DATA
========================= */

let drivers =
JSON.parse(
localStorage.getItem(
"safetycab_final_drivers"
)
) || [];

let watchId = null;

let currentLat = "";

let currentLng = "";

let markers = [];


/* =========================
   MAP
========================= */

let map =
L.map("map").setView(
[17.2872833,78.4662117],
13
);

L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(map);


/* =========================
   LIVE GPS
========================= */

function startLiveGPS(){

if(!navigator.geolocation){

alert(
"इस Browser में GPS उपलब्ध नहीं है"
);

return;

}

document.getElementById(
"gpsStatus"
).innerHTML =
"🟡 GPS Starting...";


watchId =
navigator.geolocation.watchPosition(

function(position){

currentLat =
position.coords.latitude;

currentLng =
position.coords.longitude;


document.getElementById(
"gpsStatus"
).innerHTML =
"🟢 GPS LIVE";


document.getElementById(
"location"
).innerHTML =

"Latitude: " +
currentLat +

"<br>Longitude: " +
currentLng;


let id =
document.getElementById(
"driverId"
).value.trim();


let driver =
drivers.find(
d => d.id === id
);


if(driver){

driver.latitude =
currentLat;

driver.longitude =
currentLng;

driver.status =
"Online";

driver.time =
new Date().toLocaleString();

saveData();

showDrivers();

showMap();

}

},

function(){

document.getElementById(
"gpsStatus"
).innerHTML =
"🔴 GPS ERROR";

alert(
"Location Permission Allow करें"
);

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}

);

}


/* =========================
   STOP GPS
========================= */

function stopLiveGPS(){

if(watchId !== null){

navigator.geolocation.clearWatch(
watchId
);

watchId = null;

}

document.getElementById(
"gpsStatus"
).innerHTML =
"🔴 GPS OFF";

}


/* =========================
   SAVE DRIVER
========================= */

function saveDriver(){

let id =
document.getElementById(
"driverId"
).value.trim();

let name =
document.getElementById(
"driverName"
).value.trim();

let phone =
document.getElementById(
"phone"
).value.trim();

let vehicle =
document.getElementById(
"vehicle"
).value.trim();


if(id === "" ||
name === "" ||
vehicle === ""){

alert(
"Driver ID, Name और Vehicle भरें"
);

return;

}


if(
currentLat === "" ||
currentLng === ""
){

alert(
"पहले START LIVE GPS दबाइए"
);

return;

}


let driver =
drivers.find(
d => d.id === id
);


if(driver){

driver.name = name;

driver.phone = phone;

driver.vehicle = vehicle;

driver.latitude =
currentLat;

driver.longitude =
currentLng;

driver.status =
"Online";

driver.time =
new Date().toLocaleString();

}

else{

drivers.push({

id:id,

name:name,

phone:phone,

vehicle:vehicle,

latitude:currentLat,

longitude:currentLng,

status:"Online",

time:new Date().toLocaleString()

});

}


saveData();

showDrivers();

showMap();

alert(
"✅ Driver Saved"
);

}


/* =========================
   SAVE DATA
========================= */

function saveData(){

localStorage.setItem(
"safetycab_final_drivers",
JSON.stringify(drivers)
);

}


/* =========================
   DRIVER LIST
========================= */

function showDrivers(){

let search =
document.getElementById(
"search"
).value
.toLowerCase()
.trim();


let result =
drivers.filter(function(d){

return (

String(d.id)
.toLowerCase()
.includes(search)

||

String(d.name)
.toLowerCase()
.includes(search)

||

String(d.vehicle)
.toLowerCase()
.includes(search)

);

});


let html = "";


if(result.length === 0){

html =
"<div class='box'>❌ कोई Driver नहीं मिला।</div>";

}


result.forEach(function(d){

let index =
drivers.indexOf(d);


html += `

<div class="driver">

<b>Driver ID:</b>
${d.id}

<br><br>

<b>Name:</b>
${d.name}

<br><br>

<b>Phone:</b>
${d.phone || "-"}

<br><br>

<b>Vehicle:</b>
${d.vehicle}

<br><br>

<b>Location:</b>
${d.latitude},
${d.longitude}

<br><br>

<b>Status:</b>

<span class="${
d.status === "Online"
? "online"
: "offline"
}">

${
d.status === "Online"
? "🟢 Online"
: "🔴 Offline"
}

</span>

<br><br>

<b>Last Update:</b>
${d.time}

<button
class="delete"
onclick="deleteDriver(${index})">

🗑️ Delete This Driver

</button>

</div>

`;

});


document.getElementById(
"list"
).innerHTML = html;

}


/* =========================
   DELETE ONE
========================= */

function deleteDriver(index){

if(!drivers[index]){
return;
}

let ok =
confirm(
"क्या " +
drivers[index].name +
" को Delete करना है?"
);

if(!ok){
return;
}

drivers.splice(index,1);

saveData();

showDrivers();

showMap();

}


/* =========================
   MAP MARKERS
========================= */

function showMap(){

markers.forEach(function(marker){

map.removeLayer(marker);

});

markers = [];


drivers.forEach(function(d){

let lat =
Number(d.latitude);

let lng =
Number(d.longitude);


if(
!isNaN(lat) &&
!isNaN(lng)
){

let marker =
L.marker([lat,lng])
.addTo(map);

marker.bindPopup(`

<b>Driver:</b>
${d.name}

<br>

<b>ID:</b>
${d.id}

<br>

<b>Vehicle:</b>
${d.vehicle}

<br>

<b>Status:</b>
🟢 ${d.status}

`);

markers.push(marker);

}

});


if(markers.length > 0){

let group =
L.featureGroup(markers);

map.fitBounds(
group.getBounds(),
{
padding:[30,30]
}
);

}

}


/* =========================
   START
========================= */

showDrivers();

showMap();

</script>

</body>
</html>
