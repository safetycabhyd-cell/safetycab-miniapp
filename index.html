<!DOCTYPE html>
<html>
<head>

<title>Driver Map</title>

<meta name="viewport" content="width=device-width, initial-scale=1">


<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
font-family:Arial;
padding:10px;
}

#map{
height:400px;
width:100%;
}

</style>

</head>


<body>


<h2>🚕 Driver Live Map</h2>

<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


// Map Start

let map = L.map('map').setView(
[17.2872833,78.4662117],
13
);


// Map Layer

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map);



// Driver Location

let latitude = 17.2872833;

let longitude = 78.4662117;



// Marker

L.marker(
[latitude,longitude]
)
.addTo(map)
.bindPopup(
"Driver Location"
)
.openPopup();



</script>


</body>
</html>
