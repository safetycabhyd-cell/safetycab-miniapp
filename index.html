<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<title>Safety Cab Driver List</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial,sans-serif;
background:#f2f2f2;
padding:15px;
}

.box{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

input{
width:100%;
box-sizing:border-box;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
}

.driver{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
border-left:5px solid green;
}

.delete{
width:100%;
padding:11px;
margin-top:12px;
background:#d32f2f;
color:white;
border:0;
border-radius:6px;
}

.status{
color:green;
font-weight:bold;
}

</style>

</head>

<body>

<h2>🚕 Safety Cab Admin Panel</h2>


<div class="box">

<h3>🔎 Search Driver</h3>

<input
id="search"
placeholder="Name / Driver ID / Vehicle"
oninput="showDrivers()">

</div>


<h3>👨‍✈️ Driver List</h3>

<div id="list">
Loading...
</div>


<script>

/* =========================
   READ ALL OLD DATA
========================= */

let allData = [];


/* Old key: drivers */

try{

let old1 =
JSON.parse(
localStorage.getItem("drivers")
);

if(Array.isArray(old1)){

allData =
allData.concat(old1);

}

}catch(e){}


/* Old key: safetycab_drivers */

try{

let old2 =
JSON.parse(
localStorage.getItem("safetycab_drivers")
);

if(Array.isArray(old2)){

allData =
allData.concat(old2);

}

}catch(e){}


/* Remove duplicate records */

let drivers = [];


allData.forEach(function(d){

let id =
d.id ||
d.driver_id ||
"";


let name =
d.name ||
"";


let vehicle =
d.vehicle ||
d.vehicle_number ||
"";


let phone =
d.phone ||
"";


let latitude =
d.latitude ||
"";


let longitude =
d.longitude ||
"";


let status =
d.status ||
d.online_status ||
"Online";


let time =
d.time ||
d.last_update_time ||
"";


/* Ignore completely empty records */

if(
id !== "" ||
name !== "" ||
vehicle !== ""
){

drivers.push({

id:String(id),

name:String(name),

phone:String(phone),

vehicle:String(vehicle),

latitude:String(latitude),

longitude:String(longitude),

status:
status === true
? "Online"
: String(status),

time:String(time)

});

}

});


/* =========================
   SHOW
========================= */

function showDrivers(){

let search =
document.getElementById("search")
.value
.toLowerCase()
.trim();


let result =
drivers.filter(function(d){

return (

d.id.toLowerCase()
.includes(search)

||

d.name.toLowerCase()
.includes(search)

||

d.phone.toLowerCase()
.includes(search)

||

d.vehicle.toLowerCase()
.includes(search)

);

});


let html = "";


if(result.length === 0){

html = `

<div class="box">

❌ कोई Driver नहीं मिला।

<br><br>

Total Saved Data:
${drivers.length}

</div>

`;

}


result.forEach(function(d){

let index =
drivers.indexOf(d);


html += `

<div class="driver">

<b>Driver ID:</b>
${d.id || "-"}

<br><br>

<b>Name:</b>
${d.name || "-"}

<br><br>

<b>Phone:</b>
${d.phone || "-"}

<br><br>

<b>Vehicle:</b>
${d.vehicle || "-"}

<br><br>

<b>Latitude:</b>
${d.latitude || "-"}

<br>

<b>Longitude:</b>
${d.longitude || "-"}

<br><br>

<b>Status:</b>

<span class="status">
🟢 ${d.status || "Online"}
</span>

<br><br>

<b>Last Update:</b>
${d.time || "-"}


<button
class="delete"
onclick="deleteDriver(${index})">

🗑️ Delete This Driver

</button>

</div>

`;

});


document.getElementById("list")
.innerHTML = html;

}


/* =========================
   DELETE ONE
========================= */

function deleteDriver(index){

let ok =
confirm(
"क्या " +
drivers[index].name +
" को Delete करना है?"
);


if(!ok){

return;

}


let id =
drivers[index].id;

let name =
drivers[index].name;

let vehicle =
drivers[index].vehicle;


/* Remove from local list */

drivers.splice(index,1);


/* Save corrected list */

localStorage.setItem(
"safetycab_drivers",
JSON.stringify(drivers)
);


/* Also update old key */

let oldDrivers =
JSON.parse(
localStorage.getItem("drivers")
) || [];


oldDrivers =
oldDrivers.filter(function(d){

let oldId =
d.id ||
d.driver_id ||
"";

let oldName =
d.name ||
"";

let oldVehicle =
d.vehicle ||
d.vehicle_number ||
"";


return !(
String(oldId) === String(id) &&
String(oldName) === String(name) &&
String(oldVehicle) === String(vehicle)
);

});


localStorage.setItem(
"drivers",
JSON.stringify(oldDrivers)
);


showDrivers();


alert(
"Driver Delete हो गया"
);

}


/* =========================
   START
========================= */

showDrivers();

</script>

</body>
</html>
