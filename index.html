<!DOCTYPE html>
<html>
<head>

<title>Driver Admin Panel</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:15px;
}

.box,.driver{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:10px;
}

input,button{
width:100%;
padding:12px;
margin:5px 0;
}

button{
background:blue;
color:white;
border:0;
}

#map{
height:400px;
}

</style>

</head>


<body>


<h2>🛡️ Admin Panel</h2>


<div class="box">

<input id="search" placeholder="Search Driver Name">

<button onclick="searchDriver()">
Search
</button>

</div>



<h3>All Drivers</h3>

<div id="list"></div>


<h3>Driver Map</h3>

<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


let drivers =
JSON.parse(localStorage.getItem("drivers")) || [];



// List Show

function showDrivers(data){


let html="";


data.forEach(d=>{


html += `

<div class="driver">

<b>Name:</b> ${d.name}<br>

<b>Vehicle:</b> ${d.vehicle}<br>

<b>Location:</b>
${d.latitude}, ${d.longitude}<br>

<b>Status:</b>
🟢 ${d.status}<br>

<b>Update:</b>
${d.time}

</div>

`;

});


document.getElementById("list").innerHTML=html;


}




// Search

function searchDriver(){


let text =
document.getElementById("search").value.toLowerCase();


let result =
drivers.filter(d=>
d.name.toLowerCase().includes(text)
);


showDrivers(result);

}



// Map

let map = L.map('map').setView(
[17.2872833,78.4661983],
13
);


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);



drivers.forEach(d=>{


if(d.latitude && d.longitude){


L.marker(
[
Number(d.latitude),
Number(d.longitude)
]

)
.addTo(map)
.bindPopup(d.name);


}


});



showDrivers(drivers);


</script>


</body>
</html>
