<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<title>Safety Cab Admin</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial,sans-serif;
background:#f2f2f2;
margin:0;
padding:15px;
}

h2{
margin-top:5px;
}

.box{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

input{
width:100%;
box-sizing:border-box;
padding:12px;
margin:6px 0;
border:1px solid #ccc;
border-radius:6px;
}

.driver{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
border-left:5px solid green;
}

.select{
display:flex;
align-items:center;
gap:8px;
margin-bottom:10px;
}

.select input{
width:20px;
height:20px;
margin:0;
}

.delete{
width:100%;
padding:11px;
margin-top:12px;
background:#d32f2f;
color:white;
border:0;
border-radius:6px;
font-size:15px;
}

.online{
color:green;
font-weight:bold;
}

.noDriver{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
}

</style>

</head>


<body>


<h2>🚕 Safety Cab Admin Panel</h2>


<div class="box">

<h3>🔎 Search Driver</h3>

<input
id="search"
type="text"
placeholder="Name / Driver ID / Vehicle"
oninput="showDrivers()">

</div>


<h3>👨‍✈️ Driver List</h3>

<div id="list"></div>


<script>

/* =================================
   LOAD EXISTING DRIVER DATA
================================= */

let drivers = [];

try{

drivers =
JSON.parse(
localStorage.getItem("drivers")
) || [];

}catch(error){

drivers = [];

}


/* =================================
   SHOW DRIVER LIST
================================= */

function showDrivers(){

let search =
document.getElementById("search")
.value
.toLowerCase()
.trim();


let result =
drivers.filter(function(d){

let id =
String(d.id || d.driver_id || "")
.toLowerCase();

let name =
String(d.name || "")
.toLowerCase();

let vehicle =
String(d.vehicle || d.vehicle_number || "")
.toLowerCase();

return (

id.includes(search) ||

name.includes(search) ||

vehicle.includes(search)

);

});


let html = "";


if(result.length === 0){

html = `

<div class="noDriver">

❌ कोई Driver नहीं मिला।

<br><br>

अगर आपने Driver पहले Save किया था,
तो उसी Browser में वही
index.html खोलें जिसमें Driver दिखाई दे रहा था।

</div>

`;

}


result.forEach(function(d){

let originalIndex =
drivers.indexOf(d);


let id =
d.id || d.driver_id || "-";

let name =
d.name || "-";

let vehicle =
d.vehicle ||
d.vehicle_number ||
"-";

let latitude =
d.latitude || "-";

let longitude =
d.longitude || "-";

let status =
d.status ||
d.online_status ||
"Offline";

let time =
d.time ||
d.last_update_time ||
"-";


html += `

<div class="driver">


<div class="select">

<input
type="checkbox"
id="driver_${originalIndex}">

<label
for="driver_${originalIndex}">

☑️ Select Driver

</label>

</div>


<b>Driver ID:</b>
${id}

<br><br>


<b>Name:</b>
${name}

<br><br>


<b>Vehicle Number:</b>
${vehicle}

<br><br>


<b>Latitude:</b>
${latitude}

<br>


<b>Longitude:</b>
${longitude}

<br><br>


<b>Status:</b>

<span class="online">

🟢 ${status}

</span>

<br><br>


<b>Last Update:</b>
${time}


<button
class="delete"
onclick="deleteDriver(${originalIndex})">

🗑️ Delete This Driver

</button>


</div>

`;

});


document.getElementById("list")
.innerHTML = html;

}


/* =================================
   DELETE ONLY ONE DRIVER
================================= */

function deleteDriver(index){

if(!drivers[index]){

return;

}


let name =
drivers[index].name ||
"इस Driver";


let ok =
confirm(
"क्या " +
name +
" को Delete करना है?"
);


if(!ok){

return;

}


drivers.splice(index,1);


localStorage.setItem(
"drivers",
JSON.stringify(drivers)
);


showDrivers();


alert(
"Driver Delete हो गया"
);

}


/* =================================
   START
================================= */

showDrivers();

</script>


</body>
</html>
