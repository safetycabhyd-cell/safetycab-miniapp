<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<title>Safety Cab Mini App</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

body{
font-family:Arial,sans-serif;
background:#f2f2f2;
margin:0;
padding:15px;
}

h2{
margin-top:5px;
}

.box{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

input,button{
width:100%;
box-sizing:border-box;
padding:12px;
margin:6px 0;
border-radius:6px;
}

input{
border:1px solid #ccc;
}

button{
background:#168a3a;
color:white;
border:0;
font-size:16px;
}

.stop{
background:#d32f2f;
}

.delete{
background:#555;
}

.driver{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
border-left:5px solid #168a3a;
}

.online{
color:green;
font-weight:bold;
}

#map{
height:400px;
width:100%;
border-radius:10px;
}

.small{
font-size:13px;
color:#666;
}

</style>

</head>


<body>


<h2>🚕 Safety Cab</h2>


<div class="box">

<h3>Driver Registration</h3>


<input
id="driverId"
placeholder="Driver ID">


<input
id="driverName"
placeholder="Driver Name">


<input
id="vehicleNumber"
placeholder="Vehicle Number">


<button onclick="startGPS()">
📍 Start Live GPS
</button>


<button
class="stop"
onclick="stopGPS()">

⛔ Stop Live GPS

</button>


<p id="gps">
GPS Waiting...
</p>


<button onclick="saveDriver()">

➕ Save Driver

</button>


<button
class="delete"
onclick="deleteAll()">

🗑️ Delete All Drivers

</button>

</div>



<div class="box">

<h3>🔎 Search Driver</h3>


<input
id="search"
placeholder="Name / ID / Vehicle"
oninput="searchDrivers()">

</div>



<h3>👨‍✈️ All Drivers</h3>


<div id="list">
Loading...
</div>



<h3>🗺️ Driver Map</h3>


<div id="map"></div>


<p class="small">
Safety Cab Mini App — Demo Version
</p>



<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>



<script>

/* =========================
   DATA
========================= */

let drivers =
JSON.parse(
localStorage.getItem("drivers")
) || [];


let currentLat = "";

let currentLng = "";

let watchId = null;


/* =========================
   MAP
========================= */

let map =
L.map("map").setView(
[17.2872833,78.4661983],
13
);


L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(map);


let markers = [];


/* =========================
   GPS START
========================= */

function startGPS(){

if(!navigator.geolocation){

alert(
"इस Browser में GPS उपलब्ध नहीं है"
);

return;

}


if(watchId !== null){

navigator.geolocation.clearWatch(
watchId
);

}


watchId =
navigator.geolocation.watchPosition(

function(position){

currentLat =
position.coords.latitude;

currentLng =
position.coords.longitude;


document.getElementById("gps").innerHTML =

"🟢 Live GPS ON" +

"<br>Latitude: " +
currentLat +

"<br>Longitude: " +
currentLng;


/* Current Driver Update */

let id =
document.getElementById("driverId")
.value.trim();


let driver =
drivers.find(
d => d.id === id
);


if(driver){

driver.latitude =
currentLat;

driver.longitude =
currentLng;

driver.status =
"Online";

driver.time =
new Date().toLocaleString();


saveData();

showDrivers();

showMap();

}

},


function(){

document.getElementById("gps")
.innerHTML =
"🔴 GPS Permission Error";

},


{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}


/* =========================
   STOP GPS
========================= */

function stopGPS(){

if(watchId !== null){

navigator.geolocation.clearWatch(
watchId
);

watchId = null;

}


document.getElementById("gps")
.innerHTML =
"🔴 Live GPS OFF";

}


/* =========================
   SAVE DRIVER
========================= */

function saveDriver(){

let id =
document.getElementById("driverId")
.value.trim();


let name =
document.getElementById("driverName")
.value.trim();


let vehicle =
document.getElementById("vehicleNumber")
.value.trim();


if(id === ""){

alert("Driver ID डालिए");

return;

}


if(name === ""){

alert("Driver Name डालिए");

return;

}


if(vehicle === ""){

alert("Vehicle Number डालिए");

return;

}


if(
currentLat === "" ||
currentLng === ""
){

alert(
"पहले Start Live GPS दबाइए"
);

return;

}


/* Existing Driver */

let existing =
drivers.find(
d => d.id === id
);


if(existing){

existing.name =
name;

existing.vehicle =
vehicle;

existing.latitude =
currentLat;

existing.longitude =
currentLng;

existing.status =
"Online";

existing.time =
new Date().toLocaleString();

}


/* New Driver */

else{

drivers.push({

id:id,

name:name,

vehicle:vehicle,

latitude:currentLat,

longitude:currentLng,

status:"Online",

time:new Date().toLocaleString()

});

}


saveData();

showDrivers();

showMap();


alert(
"Driver Successfully Saved"
);

}


/* =========================
   SAVE LOCAL DATA
========================= */

function saveData(){

localStorage.setItem(
"drivers",
JSON.stringify(drivers)
);

}


/* =========================
   DRIVER LIST
========================= */

function showDrivers(data=drivers){

let html = "";


if(data.length === 0){

html =
"<p>कोई Driver नहीं है।</p>";

}


data.forEach(function(d){

html += `

<div class="driver">

<b>Driver ID:</b>
${d.id}

<br>

<b>Name:</b>
${d.name}

<br>

<b>Vehicle:</b>
${d.vehicle}

<br>

<b>Latitude:</b>
${d.latitude}

<br>

<b>Longitude:</b>
${d.longitude}

<br>

<b>Status:</b>

<span class="online">
🟢 ${d.status}
</span>

<br>

<b>Last Update:</b>
${d.time}

</div>

`;

});


document.getElementById("list")
.innerHTML = html;

}


/* =========================
   SEARCH
========================= */

function searchDrivers(){

let text =
document.getElementById("search")
.value
.toLowerCase()
.trim();


let result =
drivers.filter(function(d){

return (

d.name
.toLowerCase()
.includes(text)

||

d.id
.toLowerCase()
.includes(text)

||

d.vehicle
.toLowerCase()
.includes(text)

);

});


showDrivers(result);

}


/* =========================
   MAP MARKERS
========================= */

function showMap(){

/* Remove old markers */

markers.forEach(function(marker){

map.removeLayer(marker);

});


markers = [];


/* Add new markers */

drivers.forEach(function(d){

if(
d.latitude !== "" &&
d.longitude !== ""
){

let marker =
L.marker([
Number(d.latitude),
Number(d.longitude)
])


.addTo(map)


.bindPopup(`

<b>Driver:</b>
${d.name}

<br>

<b>ID:</b>
${d.id}

<br>

<b>Vehicle:</b>
${d.vehicle}

<br>

<b>Status:</b>
🟢 ${d.status}

`);


markers.push(marker);

}

});


/* Fit map */

if(markers.length > 0){

let group =
L.featureGroup(markers);

map.fitBounds(
group.getBounds(),
{
padding:[30,30]
}
);

}

}


/* =========================
   DELETE ALL
========================= */

function deleteAll(){

let ok =
confirm(
"क्या सभी Driver Data Delete करना है?"
);


if(!ok){

return;

}


drivers = [];


localStorage.removeItem(
"drivers"
);


showDrivers();

showMap();


alert(
"सभी Driver Delete हो गए"
);

}


/* =========================
   START
========================= */

showDrivers();

showMap();

</script>


</body>

</html>
