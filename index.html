<!DOCTYPE html>
<html>
<head>

<title>Driver Map App</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:15px;
}

.box,.driver{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:10px;
}

input,button{
width:100%;
padding:12px;
margin:5px 0;
}

button{
background:green;
color:white;
border:0;
}

#map{
height:400px;
width:100%;
}

</style>

</head>

<body>


<h2>🚕 Driver Live Map</h2>


<div class="box">

<input id="driverId" placeholder="Driver ID">

<input id="driverName" placeholder="Driver Name">

<input id="vehicleNumber" placeholder="Vehicle Number">


<button onclick="getGPS()">
📍 Get GPS
</button>


<p id="gps">
GPS Waiting...
</p>


<button onclick="addDriver()">
Add Driver
</button>


</div>



<h3>Driver List</h3>

<div id="list"></div>


<h3>Map</h3>

<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


let drivers =
JSON.parse(localStorage.getItem("drivers")) || [];


let lat="";
let lng="";



// GPS

function getGPS(){

navigator.geolocation.getCurrentPosition(

function(position){

lat = position.coords.latitude;

lng = position.coords.longitude;


document.getElementById("gps").innerHTML =
"Latitude: "+lat+
"<br>Longitude: "+lng;

}

);

}




// Add Driver

function addDriver(){


let driver={

id:driverId.value,

name:driverName.value,

vehicle:vehicleNumber.value,

latitude:lat,

longitude:lng,

status:"Online",

time:new Date().toLocaleString()

};


drivers.push(driver);


localStorage.setItem(
"drivers",
JSON.stringify(drivers)
);


showDrivers();

showMap();


}




// Driver List

function showDrivers(){


let html="";


drivers.forEach(d=>{


html += `

<div class="driver">

<b>Name:</b> ${d.name}<br>

<b>Vehicle:</b> ${d.vehicle}<br>

<b>Location:</b>
${d.latitude}, ${d.longitude}<br>

<b>Status:</b> 🟢 ${d.status}<br>

<b>Time:</b> ${d.time}

</div>

`;

});


document.getElementById("list").innerHTML=html;

}




// Map

let map = L.map('map').setView(
[17.2872833,78.4661983],
13
);


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);



function showMap(){


drivers.forEach(d=>{


if(d.latitude && d.longitude){


L.marker(
[
Number(d.latitude),
Number(d.longitude)
]
)

.addTo(map)

.bindPopup(
d.name
);


}

});


}



showDrivers();

showMap();


</script>


</body>
</html>
