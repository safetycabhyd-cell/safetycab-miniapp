<!DOCTYPE html>
<html>
<head>

<title>Driver Group View</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

.box,.driver{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:10px;
}

input,button{
width:100%;
padding:10px;
margin:5px 0;
}

button{
background:green;
color:white;
border:0;
}

.driver{
border-left:5px solid green;
}

</style>

</head>


<body>


<h2>🚕 Driver Group</h2>


<div class="box">

<input id="driver_id" placeholder="Driver ID">

<input id="name" placeholder="Driver Name">

<input id="vehicle" placeholder="Vehicle Number">


<button onclick="getGPS()">
📍 Get GPS
</button>


<p id="gps">
GPS Waiting...
</p>


<button onclick="addDriver()">
Add Driver
</button>


</div>



<h3>All Drivers</h3>

<div id="list"></div>



<script>


let drivers =
JSON.parse(localStorage.getItem("drivers")) || [];


let lat="";
let lng="";



function getGPS(){


navigator.geolocation.getCurrentPosition(

function(position){

lat=position.coords.latitude;

lng=position.coords.longitude;


document.getElementById("gps").innerHTML=

"Latitude: "+lat+
"<br>Longitude: "+lng;


}

);


}



function addDriver(){


let driver={

driver_id:
driver_id.value,

name:
name.value,

vehicle:
vehicle.value,

latitude:lat,

longitude:lng,

status:"Online",

time:new Date().toLocaleString()

};


drivers.push(driver);


localStorage.setItem(
"drivers",
JSON.stringify(drivers)
);


showDrivers();


}



function showDrivers(){


let html="";


drivers.forEach((d,index)=>{


html += `

<div class="driver">

<b>Driver ID:</b> ${d.driver_id}<br>

<b>Name:</b> ${d.name}<br>

<b>Vehicle:</b> ${d.vehicle}<br>

<b>Location:</b><br>
${d.latitude}, ${d.longitude}<br>

<b>Status:</b> 🟢 ${d.status}<br>

<b>Last Update:</b> ${d.time}

</div>

`;

});


document.getElementById("list").innerHTML=html;


}



showDrivers();


</script>


</body>
</html>
